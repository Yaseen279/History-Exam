/* ---- Scores ---- */
function scoreCard(s,holder){
  if(s.special){
    var e=curEnc(),n=news2(e?e.v:{});
    return '<details class="card sc"><summary><span>'+esc(s.name)+'</span><span class="pill '+(n.any?(n.tot>=5?'red':n.tot>=1?'amber':'green'):'grey')+'" id="scr-news">'+(n.any?n.tot+(n.miss.length?'+':''):'--')+'</span></summary><div class="res">'+(e?'Enter vitals on the Encounter tab, Vitals stage. '+(n.any?esc(n.txt):''):'Start an encounter and enter vitals to calculate NEWS2.')+'</div></details>';
  }
  var st=holder[s.id]||{v:{}};
  var rows=s.items.map(function(it,i){
    var idx=(st.v||{})[i]||0,opts=it[1];
    if(opts.length===2&&opts[0][1]===0&&opts[0][0]==='No'){
      return '<div class="scrow"><span>'+esc(it[0])+'</span><div class="seg one"><button class="y'+(idx===1?' on':'')+'" data-act="scChk" data-sid="'+s.id+'" data-i="'+i+'" aria-pressed="'+(idx===1)+'">'+(idx===1?'Yes (+'+opts[1][1]+')':'Yes')+'</button></div></div>';
    }
    return '<div class="scrow"><span>'+esc(it[0])+'</span><select data-sc="'+s.id+':'+i+'" aria-label="'+esc(it[0])+'">'+opts.map(function(o,j){return '<option value="'+j+'"'+(j===idx?' selected':'')+'>'+esc(o[0])+(o[1]?' ('+o[1]+')':'')+'</option>'}).join('')+'</select></div>';
  }).join('');
  var tot=scoreTotal(s,st.v);
  return '<details class="card sc"'+(st.t?' open':'')+'><summary><span>'+esc(s.name)+'</span><span class="pill teal" id="scp-'+s.id+'">'+(st.t?tot:'--')+'</span></summary><div style="margin-block-start:8px">'+rows+'</div><div class="res" id="scr-'+s.id+'">'+scResult(s,st)+'</div></details>';
}
function scResult(s,st){if(!st.t)return '<span class="small muted">Set the items above to calculate.</span>'+(s.note?'<div class="small muted" style="margin-block-start:4px">'+esc(s.note)+'</div>':'');var tot=scoreTotal(s,st.v);return '<b>'+tot+'</b> <span class="small">'+esc(scoreInterp(s,tot))+'</span>'+(s.note?'<div class="small muted" style="margin-block-start:4px">'+esc(s.note)+'</div>':'')}
function viewScores(e){
  var holder=scHolder();
  var h=pkCard()+'<div class="row" style="justify-content:space-between;margin-block-end:10px"><h2>Scores</h2><span class="small muted">'+(e?'Saved with the current encounter':'Scratch pad, not saved to a patient')+'</span></div>';
  var sug=[];if(e){sug=getP(e.pid).sc}
  var order=SCORES.filter(function(s){return sug.indexOf(s.id)>=0}).concat(SCORES.filter(function(s){return sug.indexOf(s.id)<0}));
  if(sug.length)h+='<p class="small muted" style="margin-block-end:8px">Suggested for '+esc(getP(e.pid).name.toLowerCase())+' are listed first.</p>';
  return h+order.map(function(s){return scoreCard(s,holder)}).join('');
}

      (op.n||[]).forEach(function(nt){ex+='<div class="gnote gk'+g.cx.indexOf(nt[0][0])+'"><span class="gchips">'+nt[0].map(function(c){return '<span class="gchip gk'+g.cx.indexOf(c)+'">'+esc(c)+'</span>'}).join('')+'</span><span>'+esc(nt[1])+'</span></div>'});

    var box='<div class="xfb'+(on?' on':'')+'" data-gi="'+i+'"><div class="xfh"><b><i>'+(i+1)+'</i>'+esc(x[0])+'</b><button class="xft" data-act="guideTick" data-i="'+i+'" aria-pressed="'+on+'" aria-label="Mark step '+(i+1)+' done">'+(on?'Done':'Tick')+'</button></div>'+how+ex+'</div>';
    h+='<div class="xfa" aria-hidden="true"></div>';

  if(flagMiss.length)h+='<div class="alert" role="alert"><b>Red flags you have not asked about:</b><ul style="margin:4px 0 0;padding-inline-start:18px">'+flagMiss.map(function(it){return '<li>'+esc(it.t)+'</li>'}).join('')+'</ul></div>';

/* Decision tree in the style of the reference algorithms, generated from the complaint content */
function histFlow(P){
  var H=P.sections.filter(function(s){return s.kind==='H'});
  var flags=[];H.forEach(function(s){s.items.forEach(function(it){if(it.flag&&flags.indexOf(it.c)<0)flags.push(it.c)})});
  var mnm=P.dd.filter(function(d){return d.mnm}).map(function(d){return d.name});
  var story=H.filter(function(s){return s.g===H[0].g}),bgS=H.filter(function(s){return /^background/i.test(s.g||'')});
  var aid=function(ss){return ss.length&&ss[0].gmn?ss[0].gmn:null};
  var hk=HOOKS[P.id],h='<div class="xf"><div class="xfs"><span>'+esc(P.name)+'</span></div>';
  if(hk)h+='<div class="xfa"></div><div class="xfq"><b>Think of the causes</b>'+esc(hk[0])+'</div>';
  if(flags.length){
    h+='<div class="xfa"></div><div class="xfr"><div class="xfg"><b>Any red flag?</b><ul>'+flags.slice(0,7).map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div><div class="xfc"><i>yes</i></div><div class="xfo"><div class="dg"><span>Prioritise</span><b>'+(mnm.length?esc(mnm.join(', ')):'The dangerous causes')+'</b></div></div></div><div class="xfn">no</div>';
  }
  var sa=aid(story);
  h+='<div class="xfa"></div><div class="xfq"><b>Take the story'+(H[0].g?': '+esc(H[0].g.replace(/ \((handbook|Browse)\)$/,'')):'')+'</b>'+(sa?esc(sa.t+(sa.x?' · '+sa.x:'')):esc(story.map(function(s){return s.title}).join(' · ')))+'</div>';
  h+='<div class="xfa"></div><div class="xfq soft"><b>Then screen each cause</b>Ask the key questions in each box; a yes points to the diagnoses on the right. There can be more than one.</div>';
  /* a question belongs in a cause's box unless its weights point only at other causes (e.g. tongue protrusion is thyroglossal cyst, not thyroid) */
  var fits=function(it,c){var any=false;for(var k in it.w){any=true;if(c.dd.indexOf(k)>=0)return true}return !any};
  P.cz.forEach(function(c){
    var feats=[];
    P.sections.forEach(function(s){if(c.secs.indexOf(s.title)<0)return;s.items.forEach(function(it){if((it.hy||it.flag)&&fits(it,c)&&feats.indexOf(it.c)<0)feats.push(it.c)})});
    if(!feats.length)P.sections.forEach(function(s){if(c.secs.indexOf(s.title)<0)return;s.items.forEach(function(it){if(feats.length<3&&fits(it,c)&&feats.indexOf(it.c)<0)feats.push(it.c)})});
    var dx=c.dd.map(function(k){var d=P.dmap[k];return d?'<li'+(d.mnm?' class="m"':'')+'>'+esc(d.name)+'</li>':''}).join('');
    h+='<div class="xfa"></div><div class="xfr"><div class="xfb"><div class="xfh"><b>'+esc(c.n)+'</b></div><ul>'+feats.slice(0,6).map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div><div class="xfc"><i>yes</i></div><div class="xfo"><div><ul>'+dx+'</ul></div></div></div>';
  });
  var ba=aid(bgS);
  h+='<div class="xfa"></div><div class="xfs end"><span>'+(ba?'Then the background: '+esc(ba.t):'Then the background: past history, drugs, family and social')+'</span></div></div>';
  h+='<p class="small muted">Red-bordered diagnoses are must-not-miss. Generated from the verified complaint, so it always matches the History tab.</p>';
  return h;
}

function ddSim(P,a,b){var t=0;P.sections.forEach(function(s){s.items.forEach(function(it){var x=it.w[a.k]||0,y=it.w[b.k]||0;if(x&&y)t+=Math.min(x,y)})});return t}
/* a realistic patient for the diagnosis: age and sex drawn by how likely the diagnosis is in them */
function qPatient(P,d){
  var c=[],tot=0,ages=[20,30,40,50,60,70,80];
  ages.forEach(function(a){['M','F'].forEach(function(sx){var r=demoAdj(P.id,d,{sex:sx,age:a});if(r.na)return;var w=Math.max(r.m,0.02);c.push({a:a,sx:sx,w:w});tot+=w})});
  if(!c.length)return {age:45,sex:'M'};
  var x=Math.random()*tot,k=0;for(;k<c.length-1;k++){x-=c[k].w;if(x<=0)break}
  return {age:c[k].a+Math.floor(Math.random()*9)-4,sex:c[k].sx};
}
function qLab(x){var t=x.it.t;t=t.charAt(0).toUpperCase()+t.slice(1);return /^[A-Za-z' ]{2,28}:/.test(t)?t:(x.kind==='H'?'History: ':'Exam: ')+t}
function qWords(t){return t.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(' ').filter(function(w){return w.length>3})}
function qClose(a,b){var A=qWords(a),B=qWords(b);if(!A.length||!B.length)return false;var c=0;A.forEach(function(w){if(B.indexOf(w)>=0)c++});return c/Math.min(A.length,B.length)>=0.5}
function qComplaint(P){return P.name.split(' / ')[0].split(' (')[0].toLowerCase()}
function qStrong(P,d,minW,strict){var items=[];P.sections.forEach(function(s){s.items.forEach(function(it){
  var w=it.w[d.k];if(!(w>=minW))return;var best=true;for(var k in it.w){if(k!==d.k&&(strict?it.w[k]>=3:it.w[k]>w))best=false}
  if(best)items.push({it:it,kind:s.kind})})});return items}
function qLookalikes(P,d,pt,diff){
  var cand=P.dd.filter(function(x){if(x===d)return false;var r=demoAdj(P.id,x,pt);return !r.na&&r.m>=0.15}).map(function(x){return {d:x,s:ddSim(P,d,x)+Math.random()*1.5}});
  cand.sort(function(a,b){return b.s-a.s});
  if(diff==='easy')return shuffle(cand.slice(-Math.max(3,Math.ceil(cand.length/2)))).slice(0,3).map(function(c){return c.d});
  if(diff==='hard')return cand.slice(0,3).map(function(c){return c.d});
  return shuffle(cand.slice(0,5)).slice(0,3).map(function(c){return c.d});
}
function genQuiz(pid,diff,pat){
  diff=diff||'med';pat=pat||'dx';
  var pool=pid?[getP(pid)]:PRES;
  for(var tries=0;tries<150;tries++){
    var P=pool[Math.floor(Math.random()*pool.length)];if(P.dd.length<4)continue;
    var d=P.dd[Math.floor(Math.random()*P.dd.length)],key=P.id+'.'+d.k;
    if(tries<90&&UI.qRecent.indexOf(key)>=0)continue;
    var pt=qPatient(P,d),strong=diff==='easy'?qStrong(P,d,4,true):qStrong(P,d,3);
    if(diff==='easy'&&strong.length<4)strong=qStrong(P,d,3,true);
    if(diff==='easy'&&strong.length<4)continue;
    var others=qLookalikes(P,d,pt,diff);if(others.length<3)continue;
    var kind=pat==='mix'?(Math.random()<0.5?'dx':'clue'):pat,q;
    if(kind==='dx'){
      var n=diff==='easy'?4:diff==='med'?3:2;if(strong.length<n)continue;
      var pick=shuffle(strong).slice(0,n);
      if(diff==='hard'){
        var vague=[];P.sections.forEach(function(s){s.items.forEach(function(it){var w=it.w[d.k];if(!(w>=1&&w<=2))return;
          for(var o=0;o<others.length;o++)if((it.w[others[o].k]||0)>w)return;vague.push({it:it,kind:s.kind})})});
        if(vague.length)pick.push(shuffle(vague)[0]);
      }
      pick.sort(function(a,b){return a.kind<b.kind?-1:1});
      q={kind:'dx',items:pick,all:strong,opts:shuffle(others.concat([d]).map(function(x){return {name:x.name,ok:x===d}}))};
    }else{
      if(!strong.length)continue;
      var right=shuffle(strong)[0],wrong=[],used={};used[right.it.t]=1;
      for(var j=0;j<others.length;j++){
        var o=others[j],c=[];P.sections.forEach(function(s){s.items.forEach(function(it){var w=it.w[o.k];if(w>=3&&!(it.w[d.k]>0)&&!used[it.t]&&!qClose(it.t,right.it.t)&&!wrong.some(function(y){return qClose(it.t,y.it.t)}))c.push({it:it,kind:s.kind,o:o})})});
        if(!c.length)break;var w=shuffle(c)[0];used[w.it.t]=1;wrong.push(w)}
      if(wrong.length<3)continue;
      var lab=qLab;
      q={kind:'clue',all:strong,opts:shuffle([{name:lab(right),ok:true,note:'points to '+d.name}].concat(wrong.map(function(x){return {name:lab(x),ok:false,note:'points to '+x.o.name}})))};
    }
    UI.qRecent.push(key);if(UI.qRecent.length>25)UI.qRecent.shift();
    q.pid=P.id;q.d=d;q.pt=pt;q.diff=diff;q.ans=null;return q;
  }
  return null;
}

  });
  if(q.ans!=null){
    var okA=q.opts[q.ans].ok;
    h+='<div class="note" style="margin-block-start:10px;background:var(--surface2);color:var(--ink)"><b>'+(okA?'Correct.':'Answer: '+esc(q.d.name)+'.')+'</b> ';

function qTokens(q){return q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){return t.length>1}).map(function(t){return t.length>4?t.replace(/(es|s)$/,''):t})}
/* Rank presentations for a typed complaint: name > synonyms > text of history items */
function symRank(q){
  var toks=qTokens(q);if(!toks.length)return [];
  var full=q.toLowerCase().trim(),out=[];
  PRES.forEach(function(p){
    if(p.id==='other')return;
    var nm=p.name.toLowerCase(),sy=(SYN[p.id]||'').toLowerCase(),sc=0,via='';
    if(nm.indexOf(full)>=0)sc+=100;
    if(sy.indexOf(full)>=0)sc+=60;
    toks.forEach(function(t){
      if(nm.indexOf(t)>=0)sc+=22;
      if(sy.indexOf(t)>=0)sc+=14;
    });
    var hit=0;
    p.sections.forEach(function(s){s.items.forEach(function(it){
      var tl=it.t.toLowerCase();
      if(tl.indexOf(full)>=0){hit+=4;if(!via)via=it.t}
      else if(toks.every(function(t){return tl.indexOf(t)>=0})){hit+=2;if(!via)via=it.t}
    })});
    sc+=Math.min(hit,8);
    if(sc>0)out.push({p:p,sc:sc,via:sc<22?via:''});
  });
  out.sort(function(a,b){return b.sc-a.sc||(a.p.name<b.p.name?-1:1)});

}

/* ---- scoring from an arbitrary answer map (same rule as ddxScores) ---- */
function gScore(P,f,x){
  var m={},res=P.dd.map(function(d){var r={d:d,s:d.prior*2};m[d.k]=r;return r});
  P.sections.forEach(function(sec){sec.items.forEach(function(it){
    var st=f[fkey(P,it)];if(!st)return;
    for(var k in it.w){var r=m[k];if(!r)continue;var w=it.w[k];
      if(st===1)r.s+=w;else if(st===-1&&w>=3)r.s-=w*0.5}
  })});
  res.forEach(function(r){r.s=Math.max(0,r.s)});
  return res;
}
function gProb(res){
  var mx=0;res.forEach(function(r){if(r.s>mx)mx=r.s});
  var z=0,p=res.map(function(r){var v=Math.exp((r.s-mx)/2.2);z+=v;return v});

function gEnt(p){var h=0;p.forEach(function(v){if(v>1e-9)h-=v*Math.log(v)});return h}
function gLik(w){return Math.min(0.85,Math.max(0.05,0.08+0.14*(w||0)))}
/* expected information gain of asking item it, given current probabilities */
function gGain(res,p,it){
  var py=0,pn=0,qy=[],qn=[];
  res.forEach(function(r,i){var l=gLik(it.w[r.d.k]);var a=p[i]*l,b=p[i]*(1-l);py+=a;pn+=b;qy.push(a);qn.push(b)});
  if(py<=0||pn<=0)return 0;
  var h0=gEnt(p);
  return h0-(py*gEnt(qy.map(function(v){return v/py}))+pn*gEnt(qn.map(function(v){return v/pn})));
}

/* the whole interview as an ordered list of steps */
function gFlow(e){

function gPos(e,fl){var i=e.gi||0;if(i<0)i=0;if(i>fl.length)i=fl.length;return i}

/* the next best question for this encounter: the one that separates the differential most */
function gNext(e){
  var P=getP(e.pid),skip=gSkipSet(e),best=null,left=0,asked=0;
  if(!P.dd.length){

      var k=fkey(P,it);if(e.f[k]){asked++;return}if(skip[k])return;left++;if(!best)best={it:it,sec:s,gain:0}})});

  return '<div class="eyebrow" style="margin-block:8px 6px">Study this complaint</div><div class="chips" style="flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0">'+b.join('')+'</div>';
}

<script>/* ---------- Updates: register the service worker and tell the student when a newer index.html is online ---------- */
(function(){
  if(!("serviceWorker" in navigator))return;
  var base=null,last=0,shown=false;
  function sig(res){return res.headers.get("ETag")||res.headers.get("Last-Modified")||res.headers.get("Content-Length")||""}
  function show(){if(shown)return;shown=true;var b=document.getElementById("upd");if(b)b.hidden=false}
  function check(){
    if(!navigator.onLine||Date.now()-last<5*60*1000)return;last=Date.now();
    fetch("./index.html",{method:"HEAD",cache:"no-cache"}).then(function(res){
      if(!res.ok)return;var s=sig(res);if(!s)return;
      if(base===null)base=s;else if(s!==base)show();
    }).catch(function(){});
  }
  document.getElementById("updGo").addEventListener("click",function(){try{if(typeof saveNow==="function")saveNow()}catch(e){}location.reload()});
  document.getElementById("updX").addEventListener("click",function(){document.getElementById("upd").hidden=true});
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){reg.update().catch(function(){});check()}});
    }).catch(function(){});
    check();
    setInterval(function(){if(document.visibilityState==="visible")check()},30*60*1000);
  });
})();</script>
