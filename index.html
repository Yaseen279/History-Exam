function sentence(arr){return arr.join('; ')}
function cap(arr,n){return arr.length>n?arr.slice(0,n).join('; ')+' and '+(arr.length-n)+' more':arr.join('; ')}
function lowerFirst(s){return s.charAt(0).toLowerCase()+s.slice(1)}
/* Ward-round case presentation, in the order a consultant expects: one-liner, HPI, background, examination,
   impression, plan. Capped so that it fits about one minute of speech (about 150 words). */
function presParts(e){
  var P=getP(e.pid),c=collect(e),tx=e.tx,v=e.v||{},ds=ddxScores(e),hid=DB.hideDdx,S=[];
  var cc=e.cc?lowerFirst(e.cc):(P.id==='other'?'an unspecified complaint':P.name.toLowerCase());
  var pm=[tx.pmh,tx.psh?'previous surgery: '+tx.psh:''].filter(Boolean).join('; ');var pmh=pm?(' with a background of '+pm.replace(/\.$/,'')):'';
  S.push(['Opening','This is '+(e.pt.ref?e.pt.ref+', a ':'a ')+ptWho(e)+pmh+', presenting with '+cc+(e.dur?' for '+e.dur:'')+'.']);
  var h=[];
  if(tx.hpc)h.push(tx.hpc.replace(/\s+$/,'').replace(/\.?$/,'.'));
  if(c.hp.length)h.push('Associated with '+cap(c.hp.map(lowerFirst),5)+'.');
  if(c.hn.length)h.push('No '+cap(c.hn.map(lowerFirst),4)+'.');
  var rp=rosPres(e);if(rp)h.push(rp);
  if(h.length)S.push(['History',h.join(' ')]);
  var bg=[];if(tx.dh)bg.push('on '+tx.dh);if(tx.all)bg.push('allergic to '+tx.all);if(tx.sh)bg.push(tx.sh);if(tx.fh)bg.push('family history of '+tx.fh);
  if(bg.length)S.push(['Background',bg.join('; ').replace(/\.$/,'')+'.']);
  var x=[],vl=vitLine(v);if(vl)x.push('Vitals: '+vl+'.');
  if(c.ep.length)x.push('Positive findings: '+cap(c.ep.map(lowerFirst),6)+'.');
  if(c.en.length)x.push('Pertinent negatives: '+cap(c.en.map(lowerFirst),3)+'.');
  if(x.length)S.push(['Examination',x.join(' ')]);
  var lead=tx.dx||(!hid&&ds.nF?ds.res[0].d.name:'');
  var im=[];
  if(lead)im.push('My impression is '+lead+'.');
  var alts=(!hid&&ds.nF)?ds.res.slice(lead===(ds.res[0]&&ds.res[0].d.name)?1:0,4).map(function(r){return r.d.name}).slice(0,3):[];
  if(alts.length)im.push('Differentials include '+alts.join(', ')+'.');
  var mm=hid?[]:mnmStatus(e).filter(function(m){return !m.ex&&m.d.name!==lead&&alts.indexOf(m.d.name)<0}).map(function(m){return m.d.name});
  if(mm.length)im.push('I would exclude '+mm.slice(0,3).join(', ')+'.');
  if(im.length)S.push(['Impression',im.join(' ')]);
  S.push(['Plan',tx.plan?tx.plan.replace(/\.?$/,'.'):'I would investigate with '+P.inv.split(';').slice(0,4).map(function(s){return s.trim()}).join(', ')+'.']);
  return S;
}
function buildPres(e){return presParts(e).map(function(p){return '['+p[0]+']\n'+p[1]}).join('\n\n')}
function presStats(e){
  var w=presParts(e).reduce(function(n,p){return n+p[1].split(/\s+/).filter(Boolean).length},0),sec=Math.round(w/2.5);
  return {w:w,sec:sec,txt:w+' words, about '+sec+' seconds at a steady speaking pace'+(sec>75?'. Too long: cut the lower-value negatives and keep the key positives.':sec<30?'. Short: add more of the history and examination.':'.')};
}

/* ================= files / clipboard ================= */
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function copyText(text){
  var p=(navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(text):Promise.reject();
  return p.then(function(){return true}).catch(function(){
    try{var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}});
}
function blobSave(name,text,mime){try{var b=new Blob([text],{type:mime||'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},3000);return true}catch(e){return false}}
function offerFile(name,text){
  var get=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')):Promise.resolve(null);
  return get.then(function(dl){
    if(!dl){if(!window.claude&&blobSave(name,text)){toast('Saved '+name);return true}return copyText(text).then(function(){toast('Saving is unavailable here. Copied to clipboard.')})}
    return dl.save({filename:name,data:text}).then(function(){toast('Saved '+name);return true}).catch(function(err){
      if(err&&err.code==='declined')return;
      if(err&&err.code==='rate_limited'){toast('Wait a moment, then try again.');return}
      return copyText(text).then(function(){toast('Could not save. Copied to clipboard.')})});
  }).catch(function(){return copyText(text).then(function(){toast('Saving failed. Copied to clipboard.')})});
}
function offerBinary(name,bytes){
  var blob=new Blob([bytes],{type:'application/pdf'});
  var get=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')):Promise.resolve(null);
  return get.then(function(dl){
    if(!dl){if(!window.claude&&blobSave(name,bytes,'application/pdf')){toast('Saved '+name);return}toast('Saving files is unavailable here.');return}
    return dl.save({filename:name,data:blob}).then(function(){toast('Saved '+name)}).catch(function(err){
      if(err&&err.code==='declined')return;
      if(err&&err.code==='rate_limited'){toast('Wait a moment, then try again.');return}
      toast('Could not save the PDF.')});
  }).catch(function(){toast('Saving failed.')});
}
function buildPDF(e){
  var P=getP(e.pid),blocks=sheetBlocks(e).map(function(b){return b.k==='p'&&b.label&&b.label[b.label.length-1]!==':'?{k:b.k,label:b.label+':',text:b.text}:b}),meta=[];
  var first=blocks.findIndex(function(b){return b.k==='h'&&/Chief/.test(b.text)});
  var pdata=blocks.slice(1,first).filter(function(b){return b.k==='p'});
  pdata.forEach(function(b){meta.push(b.label+' '+b.text)});
  blocks=blocks.slice(first);
  var pr=progress(e);
  if(SRC_P[P.id])meta.push('Based on College of Medicine, University of Baghdad teaching material');
  meta.push('Checklist coverage: history '+pr.h+' of '+pr.ht+', examination '+pr.x+' of '+pr.xt);
  var acc=(ACCENTS[DB.accent]&&ACCENTS[DB.accent].l.ac)||'#1F5FBF';
  return PDFW.build({title:'Case sheet: '+P.name,sub:P.g+' / '+P.sys,meta:meta,blocks:blocks,accent:acc,foot:'Teaching aid built from textbook patterns. Verify against local guidelines and your supervisor.'});
}
function canShare(){return typeof navigator!=='undefined'&&!!navigator.share&&typeof File==='function'}
function sharePDF(e){
  var bytes,name=pdfName(e);try{bytes=buildPDF(e)}catch(x){toast('Could not make the PDF');return}
  var f=new File([bytes],name,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:name}).catch(function(err){if(err&&err.name==='AbortError')return;offerBinary(name,bytes)});
  }else offerBinary(name,bytes);
}
function buildLogbookPDF(list){
  var p=DB.prof||{},blocks=[],acc=(ACCENTS[DB.accent]&&ACCENTS[DB.accent].l.ac)||'#1F5FBF',meta=[];
  if(p.name)meta.push('Student: '+p.name);
  if(p.module)meta.push('Module: '+p.module);
  var d0=dstr(list[0].t0),d1=dstr(list[list.length-1].t0);
  meta.push('Period: '+d0+' to '+d1);
  meta.push('Cases: '+list.length);
  meta.push('Generated: '+dstr(Date.now()));
  blocks.push({k:'h',text:'Contents'});
  list.forEach(function(e,i){var P=getP(e.pid);blocks.push({k:'p',label:(i+1)+'.',text:[dstr(e.t0),e.pt.ref||'No ID',[e.pt.age?e.pt.age+' y':'',e.pt.sex].filter(Boolean).join(' '),P.name,diagOf(e)].filter(Boolean).join('  |  ')})});
  list.forEach(function(e,i){
    var P=getP(e.pid);
    blocks.push({k:'pb'});
    blocks.push({k:'big',text:'Case '+(i+1)+': '+P.name});
    blocks.push({k:'p',text:P.g+' / '+P.sys+(SRC_P[P.id]?'   |   Based on College of Medicine, University of Baghdad teaching material':'')});
    sheetBlocks(e).forEach(function(b){blocks.push(b.k==='p'&&b.label&&b.label[b.label.length-1]!==':'?{k:b.k,label:b.label+':',text:b.text}:b)});
  });
  return PDFW.build({title:'Clinical logbook',sub:p.module||'Patient log',meta:meta,blocks:blocks,accent:acc,foot:'Teaching aid built from textbook patterns. Verify against local guidelines and your supervisor.'});
}
function pdfName(e){var P=getP(e.pid);return 'hp-'+(e.pt.ref||'patient').replace(/[^\w-]+/g,'_')+'-'+P.id+'-'+dstr(e.t0).replace(/[^\w-]+/g,'-')+'.pdf'}
function csvCell(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function buildCSV(){
  var rows=[['Date','Ref','Age','Sex','Location','Presentation','System','Working diagnosis','Top differential','History items asked','Exam items done','HPC notes','Occupation','Marital status','Residence','Admission date']];
  DB.encs.slice().sort(function(a,b){return a.t0-b.t0}).forEach(function(e){
    var P=getP(e.pid);if(!P)return;var pr=progress(e),ds=ddxScores(e);
    rows.push([dstr(e.t0),e.pt.ref,e.pt.age,e.pt.sex,e.pt.loc,P.name,P.sys,e.tx.dx,ds.nF?ds.res[0].d.name:'',pr.h+'/'+pr.ht,pr.x+'/'+pr.xt,e.tx.hpc,e.pt.occ,e.pt.mar,e.pt.res,e.pt.adm]);
  });
  return rows.map(function(r){return r.map(csvCell).join(',')}).join('\n');
}

function render(keepScroll){

  var dock='';

function stylePanel(){

}
function dockHTML(e){
  var ds=ddxScores(e);var mx=Math.max(ds.res.length?ds.res[0].s:0,0.01);

function afterRender(){

function viewEnc(e){
  if(!e||UI.pick)return viewPick(e);
  var P=getP(e.pid),pr=progress(e);
  var h='';
  var rf=redFlags(e);
  h+='<div style="margin-block-end:8px"><div style="margin-block-end:8px"><div class="eyebrow">'+esc(P.g)+' / '+esc(P.sys)+'</div><h2>'+esc(P.name)+'</h2>'+srcLine(SRC_P[P.id])+'</div><div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn small" data-act="ddxToggle" aria-pressed="'+(!DB.hideDdx)+'">DDx: '+(DB.hideDdx?'Hidden':'Shown')+'</button><button class="btn small" data-act="pickOpen" data-m="change">Change</button><button class="btn small" data-act="newEnc">New patient</button></div></div>';
  h+=infoCard(e);
  h+='<div class="stages" role="tablist">'+[['hist','History'],['exam','Exam'],['vit','Vitals'],['ddx','DDx'],['rev','Review'],['note','Note']].map(function(s){return '<button data-act="stage" data-s="'+s[0]+'"'+(UI.stage===s[0]?' aria-current="step"':'')+'>'+s[1]+(s[0]==='hist'?' <span class="mono small" id="pgH">'+pr.h+'/'+pr.ht+'</span>':s[0]==='exam'?' <span class="mono small" id="pgE">'+pr.x+'/'+pr.xt+'</span>':'')+'</button>'}).join('')+'<button class="tg" data-act="ddxToggle" aria-pressed="'+(!DB.hideDdx)+'">DDx '+(DB.hideDdx?'off':'on')+'</button></div>';
  h+='<div id="rfSlot" style="margin-block-start:12px">'+rfHTML(rf)+'</div>';
  var main='';

  else if(UI.stage==='exam')main=stageExam(e,P);
  else if(UI.stage==='vit')main=stageVit(e,P);
  else if(UI.stage==='ddx')main=stageDDx(e,P);
  else if(UI.stage==='rev')main=stageReview(e,P);

function rfHTML(rf){return rf.length?'<div class="alert" role="alert">Red flag: '+rf.map(function(i){return esc(i.t)}).join(' / ')+'</div>':''}

function viewPick(e){
  var q=UI.pq.toLowerCase();

function pickList(q){
  var h='';
  ['Medicine','Surgery','General'].forEach(function(g){
    var list=PRES.filter(function(p){return p.g===g&&(!q||(p.name+' '+p.sys).toLowerCase().indexOf(q)>=0)}).sort(function(a,b){return a.name<b.name?-1:1});
    if(!list.length)return;
    h+='<div class="eyebrow" style="margin-block:14px 8px">'+(g==='General'?'General approach':g)+'</div><div class="pick">'+list.map(function(p){return '<button data-act="pick" data-id="'+p.id+'"><b>'+esc(p.name)+'</b><span>'+esc(p.sys)+'</span>'+srcMark(SRC_P[p.id],16)+'</button>'}).join('')+'</div>';
  });
  return h||'<div class="empty">No presentation matches. Try a symptom word.</div>';
}
function triRow(e,P,it,kind){
  var st=e.f[fkey(P,it)]||0;
  var y=kind==='H'?'Yes':'Abn',n=kind==='H'?'No':'Nl';
  return '<div class="it'+(it.flag?' flag':'')+'" data-k="'+it.k+'"><div class="t">'+(it.flag?'<span class="pill red">Red flag</span> ':'')+esc(it.t)+'</div><div class="seg" role="group" aria-label="'+esc(it.t)+'"><button class="'+(kind==='H'?'y':'a')+(st===1?' on':'')+'" data-act="tri" data-v="1" aria-pressed="'+(st===1)+'" title="'+(kind==='H'?'Yes / present':'Abnormal finding present')+'">'+y+'</button><button class="n'+(st===-1?' on':'')+'" data-act="tri" data-v="-1" aria-pressed="'+(st===-1)+'" title="'+(kind==='H'?'No / absent':'Normal / absent')+'">'+n+'</button></div></div>';
}
function secHead(e,P,s){var n=0;s.items.forEach(function(it){if(e.f[fkey(P,it)])n++});return '<h3><span>'+esc(s.title)+'</span><span class="cnt">'+n+'/'+s.items.length+'</span></h3>'}
function secCls(e,P,s){var n=0;s.items.forEach(function(it){if(e.f[fkey(P,it)])n++});return n===s.items.length&&n>0?' done':''}
function stageHist(e,P){
  var h='<p class="small muted" style="margin-block-end:10px">Tap Yes or No on each question. The differential ranks itself as you go.</p>';
  P.sections.filter(function(s){return s.kind==='H'}).forEach(function(s){
    h+='<section class="card'+secCls(e,P,s)+'">'+secHead(e,P,s)+s.items.map(function(it){return triRow(e,P,it,'H')}).join('')+'</section>';
  });
  var T=function(k,label,ph,rows){return '<label class="f">'+label+'<textarea data-b="tx.'+k+'" rows="'+(rows||2)+'" placeholder="'+esc(ph)+'">'+esc(e.tx[k])+'</textarea></label>'};
  h+='<section class="card"><h3>History of presenting complaint</h3>'+T('hpc','Details in your own words','Onset, course, severity (0 to 10), previous episodes, treatments tried and response',3)+'</section>';

   +T('pmh','Past medical history','HTN, DM, IHD, stroke, asthma, TB, rheumatic fever, anaemia, transfusions')
   +T('psh','Past surgical history','Previous operations and dates, anaesthetic problems, complications')
   +T('dh','Drug history','Regular and over-the-counter: ACE inhibitors, NSAIDs, steroids, anticoagulants, inhalers, antibiotics')
   +T('all','Allergies','Drug, food or latex, and the reaction')
   +T('fh','Family history','IHD or stroke (men under 55, women under 65), TB, asthma, cancer, diabetes, thyroid, bleeding disorders')
   +T('sh','Social history','Occupation and exposures (dust, asbestos), smoking pack-years, alcohol, travel, pets, living conditions, ADLs')

function stageExam(e,P){
  var gen=[['G0','Washed hands, introduced self, took consent'],['G1','Patient positioned and exposed appropriately, chaperone offered'],['G2','Inspected the bed space and general appearance']];

function stageVit(e,P){
  var v=e.v;
  var I=function(k,l,u,step){return '<label class="f">'+l+(u?' <span class="muted">'+u+'</span>':'')+'<input type="number" inputmode="decimal" step="'+(step||'1')+'" data-b="v.'+k+'" value="'+esc(v[k])+'"></label>'};
  var h='<section class="card vit"><h3>Vital signs</h3><div class="grid4">'+I('hr','Pulse','/min')+I('sbp','Systolic','mmHg')+I('dbp','Diastolic','mmHg')+I('rr','Resp. rate','/min')+I('spo2','SpO2','%')+I('temp','Temp','°C','0.1')+'<label class="f">Consciousness<select data-b="v.avpu"><option value="A"'+(!v.avpu||v.avpu==='A'?' selected':'')+'>Alert</option><option value="C"'+(v.avpu==='C'?' selected':'')+'>Confused (new)</option><option value="V"'+(v.avpu==='V'?' selected':'')+'>Voice</option><option value="P"'+(v.avpu==='P'?' selected':'')+'>Pain</option><option value="U"'+(v.avpu==='U'?' selected':'')+'>Unresponsive</option></select></label><label class="f">On oxygen?<select data-b="v.o2"><option value="">Room air</option><option value="1"'+(v.o2?' selected':'')+'>Supplemental O2</option></select></label></div>'
   +'<div class="grid2" style="margin-block-start:10px">'+I('wt','Weight','kg','0.1')+I('ht','Height','cm')+'</div><div id="vitOut" style="margin-block-start:12px">'+vitOut(v)+'</div></section>';
  var sug=P.sc.filter(function(id){return id!=='news'&&SCMAP[id]});
  if(sug.length){h+='<h3 style="margin-block:14px 8px">Suggested scores for this presentation</h3>'+sug.map(function(id){return scoreCard(SCMAP[id],scHolder())}).join('')}
  h+='<p class="small muted">All calculators are on the Scores tab.</p>';
  return h;

function vitOut(v){
  var n=news2(v),fl=vitFlags(v),b=bmi(v),sb=num(v.sbp),db=num(v.dbp);
  var map=(sb!=null&&db!=null)?Math.round((sb+2*db)/3):null;
  var h='<div class="grid3"><div><div class="eyebrow">NEWS2</div><div class="big">'+(n.any?(n.miss.length?n.tot+'+':n.tot):'--')+'</div></div><div><div class="eyebrow">MAP</div><div class="big">'+(map!=null?map:'--')+'</div></div><div><div class="eyebrow">BMI</div><div class="big">'+(b||'--')+'</div></div></div>';
  if(n.any)h+='<p class="small" style="margin-block-start:8px">'+esc(n.txt)+(n.miss.length?' Missing: '+n.miss.join(', ')+'.':'')+'</p>';
  if(fl.length)h+='<div style="margin-block-start:8px" class="row">'+fl.map(function(f){return '<span class="pill amber">'+esc(f)+'</span>'}).join('')+'</div>';
  return h;
}
function ddRows(e,full){
  var ds=ddxScores(e),mx=Math.max(ds.res.length?ds.res[0].s:0,0.01),h='';
  if(!ds.res.length)return '<div class="note">This template has no built-in differential. Write your own below.</div>';
  if(!ds.nF)h+='<div class="note">Showing prevalence only. Tick findings and this list re-ranks.</div>';
  var lim=full?ds.res.length:6;
  ds.res.slice(0,lim).forEach(function(r,i){
    var f=fitLabel(r,mx,ds.nF,i),nx=full?nextToCheck(e,r):[];
    h+='<div class="dd"><div class="h"><div class="nm">'+esc(r.d.name)+(r.d.mnm?' <span class="pill red">Must not miss</span>':'')+'</div><span class="pill '+f[1]+'">'+f[0]+'</span></div><div class="bar'+(ds.nF?'':' mute')+'" style="margin-block-start:6px"><i style="width:'+Math.round(r.s/mx*100)+'%"></i></div>';
    if(full&&(r.pos.length||r.neg.length||nx.length)){
      h+='<details><summary>Why</summary>';
      if(r.pos.length)h+='<div><b>For:</b><ul>'+r.pos.map(function(it){return '<li>'+esc(it.t)+'</li>'}).join('')+'</ul></div>';
      if(r.neg.length)h+='<div><b>Against (absent):</b><ul>'+r.neg.map(function(it){return '<li>'+esc(it.t)+'</li>'}).join('')+'</ul></div>';
      if(nx.length)h+='<div><b>Check next to confirm:</b><ul>'+nx.map(function(x){return '<li>'+(x.kind==='H'?'Ask: ':'Examine: ')+esc(x.it.t)+'</li>'}).join('')+'</ul></div>';
      h+='</details>';
    }
    h+='</div>';
  });
  return h;
}

      return '<div class="scrow"><span>'+esc(it[0])+'</span><div class="seg one"><button class="y'+(idx===1?' on':'')+'" data-act="scChk" data-sid="'+s.id+'" data-i="'+i+'" aria-pressed="'+(idx===1)+'">'+(idx===1?'Yes (+'+opts[1][1]+')':'Yes')+'</button></div></div>';

/* ---- Review (learn mode) ---- */
function stageReview(e,P){
  var pr=progress(e),h='';
  var unH=[],unE=[],flagMiss=[];
  P.sections.forEach(function(s){
    var l=s.items.filter(function(it){return !e.f[fkey(P,it)]});
    if(!l.length)return;
    (s.kind==='H'?unH:unE).push({t:s.title,l:l});
    l.forEach(function(it){if(it.flag)flagMiss.push(it)});
  });
  var nH=unH.reduce(function(a,x){return a+x.l.length},0),nE=unE.reduce(function(a,x){return a+x.l.length},0);
  var pctH=pr.ht?Math.round(pr.h/pr.ht*100):0,pctE=pr.xt?Math.round(pr.x/pr.xt*100):0;
  h+='<div class="card"><h3>How complete was this encounter?</h3><div class="grid3"><div><div class="eyebrow">History</div><div class="big">'+pctH+'%</div><div class="small muted">'+pr.h+' of '+pr.ht+'</div></div><div><div class="eyebrow">Exam</div><div class="big">'+pctE+'%</div><div class="small muted">'+pr.x+' of '+pr.xt+'</div></div><div><div class="eyebrow">Red flags</div><div class="big">'+(P.sections.reduce(function(a,s){return a+s.items.filter(function(it){return it.flag}).length},0)-flagMiss.length)+'</div><div class="small muted">asked of '+P.sections.reduce(function(a,s){return a+s.items.filter(function(it){return it.flag}).length},0)+'</div></div></div></div>';
  if(flagMiss.length)h+='<div class="alert" role="alert"><b>Red flags you have not asked about:</b><ul style="margin:4px 0 0;padding-inline-start:18px">'+flagMiss.map(function(it){return '<li>'+esc(it.t)+'</li>'}).join('')+'</ul></div>';
  if(!DB.hideDdx&&P.dd.length){
    var ds=ddxScores(e),top=ds.res.slice(0,3),seen={},hv=[];
    top.forEach(function(r){nextToCheck(e,r).forEach(function(x){if(!seen[x.it.k]){seen[x.it.k]=1;hv.push({x:x,d:r.d})}})});
    hv.sort(function(a,b){return b.x.w-a.x.w});
    if(hv.length)h+='<div class="card"><h3>Highest-value items you skipped</h3><p class="small muted" style="margin-block-end:6px">These would best separate your leading diagnoses.</p>'+hv.slice(0,6).map(function(o){return '<div class="small" style="padding-block:4px">'+(o.x.kind==='H'?'Ask: ':'Examine: ')+esc(o.x.it.t)+' <span class="muted">('+esc(o.d.name)+')</span></div>'}).join('')+'</div>';
    var mm=mnmStatus(e).filter(function(x){return !x.ex});
    if(mm.length)h+='<div class="card"><h3>Must-not-miss diagnoses not yet excluded</h3><ul style="margin:0;padding-inline-start:18px">'+mm.map(function(x){return '<li>'+esc(x.d.name)+'</li>'}).join('')+'</ul><p class="small muted" style="margin-block-start:6px">Say how you would exclude each one before you finish the case.</p></div>';
    if(e.tx.dx){
      var q=e.tx.dx.toLowerCase(),idx=-1;ds.res.forEach(function(r,i){var n=r.d.name.toLowerCase();if(idx<0&&(n.indexOf(q)>=0||q.indexOf(n)>=0))idx=i});
      h+='<div class="card"><h3>Your working diagnosis</h3><p>'+esc(e.tx.dx)+(idx>=0?' ranks <b>#'+(idx+1)+'</b> of '+ds.res.length+' on the differential.':' is not one of the built-in differentials for this presentation. That may be fine; check it against the textbooks.')+'</p></div>';
    }
    h+='<div class="card"><h3>Learn the leading diagnoses</h3><p class="small muted" style="margin-block-end:8px">The features that point to each diagnosis, and whether you checked them.</p>';
    top.forEach(function(r){
      var feats=[];P.sections.forEach(function(s){s.items.forEach(function(it){var w=it.w[r.d.k];if(w>=3)feats.push({it:it,w:w,kind:s.kind})})});
      feats.sort(function(a,b){return b.w-a.w});
      h+='<details'+(r===top[0]?' open':'')+'><summary><b>'+esc(r.d.name)+'</b></summary><div style="margin-block-start:4px">'+(feats.length?feats.slice(0,8).map(function(f){var st=e.f[fkey(P,f.it)];return '<div class="small" style="padding-block:3px"><span class="pill '+(st===1?'teal':st===-1?'grey':'amber')+'">'+(st===1?'Present':st===-1?'Absent':'Not asked')+'</span> '+esc(f.it.t)+'</div>'}).join(''):'<div class="small muted">No strongly weighted features defined.</div>')+'</div></details>';
    });
    h+='</div>';
  }else if(DB.hideDdx&&P.dd.length){
    h+='<div class="card"><h3>Differential hidden</h3><p class="small muted" style="margin-block-end:10px">Write your own differential first. Then show it to see the leading diagnoses and the features you skipped.</p><button class="btn primary" data-act="ddxToggle">Show differential</button></div>';
  }
  h+='<div class="card"><h3>History questions not asked ('+nH+')</h3>'+(unH.length?unH.map(function(x){return '<details><summary>'+esc(x.t)+' ('+x.l.length+')</summary><ul style="margin:4px 0 0;padding-inline-start:18px">'+x.l.map(function(it){return '<li class="small">'+esc(it.t)+'</li>'}).join('')+'</ul></details>'}).join(''):'<p class="small">Everything was covered.</p>')+'</div>';
  h+='<div class="card"><h3>Examination steps not done ('+nE+')</h3>'+(unE.length?unE.map(function(x){return '<details><summary>'+esc(x.t)+' ('+x.l.length+')</summary><ul style="margin:4px 0 0;padding-inline-start:18px">'+x.l.map(function(it){return '<li class="small">'+esc(it.t)+'</li>'}).join('')+'</ul></details>'}).join(''):'<p class="small">Everything was covered.</p>')+'</div>';
  h+='<p class="small muted">Not every item applies to every patient, so use this to learn the pattern rather than to chase 100%.</p>';
  return h;
}

  if(o.done){

    var miss=items.filter(function(i){return !o.marks[i.k]});
    return '<div class="card"><div class="eyebrow">Result</div><h2>'+pct+'% ('+hit+'/'+items.length+')</h2><p class="muted small">'+esc(P.name)+'</p></div><div class="card"><h3>Missed items</h3>'+(miss.length?'<ul style="margin:0;padding-inline-start:18px">'+miss.map(function(i){return '<li>'+esc(i.t)+'</li>'}).join('')+'</ul>':'<p>Nothing missed.</p>')+'</div><button class="btn primary" data-act="osceReset">New station</button>'+osceHistory();
  }
  var h='<div class="card row" style="justify-content:space-between"><div><div class="eyebrow">'+esc(P.name)+'</div><div class="timer" id="oscet">'+fmtT(o.left)+'</div></div><button class="btn primary" data-act="osceFinish">Finish</button></div>';
  var lastSec='';
  h+='<div class="card">';
  items.forEach(function(i){
    if(i.sec!==lastSec){h+='<div class="eyebrow" style="margin-block:12px 4px">'+esc(i.sec)+'</div>';lastSec=i.sec}
    h+='<div class="it" data-ok="'+i.k+'"><div class="t">'+esc(i.t)+'</div><div class="seg one"><button class="y'+(o.marks[i.k]?' on':'')+'" data-act="osceTick" aria-pressed="'+!!o.marks[i.k]+'">Done</button></div></div>';
  });

}
function fmtT(s){return p2(Math.floor(s/60))+':'+p2(s%60)}
function osceHistory(){

function finishOsce(){
  var o=UI.osce;if(!o||o.done)return;clearInterval(timerId);o.done=true;
  var items=osceItems(o.pid),hit=items.filter(function(i){return o.marks[i.k]}).length,pct=Math.round(hit/items.length*100);

function genQuiz(pid){
  var pool=pid?[getP(pid)]:PRES;
  for(var tries=0;tries<80;tries++){
    var P=pool[Math.floor(Math.random()*pool.length)];if(P.dd.length<4)continue;
    var d=P.dd[Math.floor(Math.random()*P.dd.length)],items=[];
    P.sections.forEach(function(s){s.items.forEach(function(it){
      var w=it.w[d.k];if(!(w>=3))return;var best=true;for(var k in it.w){if(k!==d.k&&it.w[k]>w)best=false}
      if(best)items.push({it:it,kind:s.kind})})});
    if(items.length<3)continue;
    var pick=shuffle(items).slice(0,4).sort(function(a,b){return a.kind<b.kind?-1:1});
    var others=shuffle(P.dd.filter(function(x){return x!==d})).slice(0,3);
    return {pid:P.id,d:d,items:pick,all:items,opts:shuffle(others.concat([d])),ans:null};
  }
  return null;
}

  if(!q)return h;
  var P=getP(q.pid);
  h+='<div class="card q"><div class="eyebrow">'+esc(P.name)+'</div><p style="margin-block:6px 8px">A patient has these findings. What is the most likely diagnosis?</p><ul>'+q.items.map(function(x){return '<li>'+(x.kind==='H'?'History: ':'Exam: ')+esc(x.it.t)+'</li>'}).join('')+'</ul>';
  q.opts.forEach(function(o,i){
    var cls='opt';if(q.ans!=null){if(o===q.d)cls+=' right';else if(i===q.ans)cls+=' wrong'}
    h+='<button class="'+cls+'" data-act="quizAns" data-i="'+i+'"'+(q.ans!=null?' disabled':'')+'>'+esc(o.name)+'</button>';

    h+='<div class="note" style="margin-block-start:10px;background:var(--surface2);color:var(--ink)"><b>'+(q.opts[q.ans]===q.d?'Correct.':'Answer: '+esc(q.d.name)+'.')+'</b> Other strong clues for this diagnosis:<ul>'+q.all.filter(function(x){return q.items.indexOf(x)<0}).slice(0,4).map(function(x){return '<li>'+esc(x.it.t)+'</li>'}).join('')+'</ul></div>';
  }

}

};
var ACC_LEGACY={blue:'ward',teal:'navy',green:'sage',amber:'graphite'};
function applyAccent(){
  if(ACC_LEGACY[DB.accent])DB.accent=ACC_LEGACY[DB.accent];
  if(!ACCENTS[DB.accent])DB.accent='ward';
  var a=ACCENTS[DB.accent],st=document.getElementById('accentStyle');
  if(!st){st=document.createElement('style');st.id='accentStyle';document.body.appendChild(st)}
  var r=function(c){return '--bg:'+c.bg+';--surface:'+c.surf+';--surface2:'+c.surf2+';--ink:'+c.ink+';--muted:'+c.muted+';--line:'+c.line+';--accent:'+c.ac+';--accent-ink:'+c.ai+';--accent-soft:'+c.soft+';'};
  st.textContent=':root{'+r(a.l)+'}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){'+r(a.d)+'}}:root[data-theme="dark"]{'+r(a.d)+'}';
}
function applyTheme(){var r=document.documentElement;if(DB.theme)r.setAttribute('data-theme',DB.theme);else r.removeAttribute('data-theme')}

/* ================= boot ================= */
applyTheme();applyAccent();
