<style>

<div class="toast" id="toast" hidden></div>
<input type="file" id="imp" accept=".json,application/json" hidden>

<script id="content" type="text/plain">
@chest|Chest pain|Cardiovascular|Medicine
SC heart,wells
I 12-lead ECG within 10 min; hs-troponin (0/1 h or 0/3 h); CXR; FBC, U&E, glucose, lipids; D-dimer only if Wells says PE unlikely; echo; CT aortogram if dissection suspected
D acs|ACS (unstable angina / MI)|!|1.5
D ang|Stable angina||1
D pe|Pulmonary embolism|!|0.8
D dis|Aortic dissection|!|0.3
D ptx|Pneumothorax (tension)|!|0.4
D peri|Pericarditis / myocarditis||0.6
D pneu|Pneumonia / pleurisy||0.8
D gerd|GORD / oesophageal spasm||1.2
D msk|Musculoskeletal / costochondritis||1.2
D anx|Anxiety / panic||0.6
H Pain (site, radiation, character)
- Central or retrosternal site {acs:2,ang:2,gerd:1,dis:1,peri:1}
- Radiation to left arm, neck or jaw {acs:2,ang:2}
- Heavy, tight, crushing or squeezing {acs:3,ang:3}
- Sharp, stabbing, worse on breathing in (pleuritic) {peri:2,pe:2,pneu:2,ptx:2,msk:1}
- Tearing pain radiating to the back, abrupt onset {dis:4}
- Reproduced by movement or pressing on the chest {msk:3}
H Timing and triggers
- Brought on by exertion, relieved by rest within minutes {ang:4,acs:1}
- Pain at rest lasting more than 20 minutes {acs:3}
- Worse lying flat, better leaning forward {peri:3}
- Burning, after meals or lying flat, relieved by antacids {gerd:3}
- Sudden onset at rest with breathlessness {pe:2,ptx:3}
- Exercise tolerance: how far on the flat, stairs, hills (record distance)
H Associated symptoms
- Sweating, nausea or vomiting {acs:2}
- Breathlessness {acs:1,pe:2,ptx:2,pneu:1}
- Palpitations or syncope {acs:1,pe:1,dis:1}
- Fever, cough, sputum {pneu:3,peri:1}
- Haemoptysis {pe:2}
- Recent viral illness {peri:2}
- Unilateral leg swelling, recent surgery, immobility, long travel, malignancy, OCP {pe:3}
- Panic, hyperventilation, tingling around the mouth, fear of dying {anx:4}
H Risk factors
- Hypertension, diabetes, hyperlipidaemia, smoking, family history of IHD {acs:2,ang:2,dis:1}
- Previous MI, angina, stent or CABG {acs:1,ang:1}
- Marfan's, bicuspid valve, cocaine use {dis:2}
E General and vitals
! Shock: pallor, sweating, hypotension, tachycardia {acs:2,dis:2,pe:2,ptx:2}
- Hypoxia or tachypnoea {pe:2,ptx:2,pneu:2}
- BP difference between arms more than 20 mmHg {dis:4}
- Xanthelasma, corneal arcus {acs:1,ang:1}
E Cardiovascular
- Raised JVP {pe:2,peri:1,ptx:1}
- Muffled heart sounds, pulsus paradoxus {peri:3}
- Pericardial friction rub {peri:4}
- New aortic regurgitation murmur or absent peripheral pulse {dis:4}
- Gallop rhythm, basal crackles (heart failure) {acs:2}
- Unilateral calf swelling or tenderness {pe:3}
E Chest
- Hyper-resonance with absent breath sounds {ptx:4}
- Tracheal deviation {ptx:3}
- Bronchial breathing, dullness, crackles {pneu:4}
- Chest wall tenderness on palpation {msk:4}
- Anxious and hyperventilating with an otherwise normal examination {anx:3}

@palp|Palpitations|Cardiovascular|Medicine
SC chads
I 12-lead ECG (during an episode if possible); Holter or event recorder; TFT; FBC; U&E, Mg, Ca; echo; troponin if chest pain
D af|Atrial fibrillation||1.2
D svt|SVT (AVNRT / AVRT)||1
D vt|Ventricular tachycardia|!|0.4
D ect|Ectopic beats (benign)||1.5
D thy|Thyrotoxicosis||0.7
D anx|Anxiety / panic||1
D anaem|Anaemia||0.6
D drug|Drugs, caffeine, stimulants||0.8
D brady|Heart block / sick sinus|!|0.4
H Character
- Fast, regular, sudden start and sudden stop {svt:4}
- Irregularly irregular, chaotic {af:4}
- Isolated missed beat, thump or pause {ect:4}
- Gradual onset and offset, linked to anxiety {anx:3,thy:1}
- Ask the patient to tap out the rhythm: regular or irregular, fast or slow
- Duration of episodes: seconds, minutes, hours
H Associated and triggers
! Syncope or near-syncope {vt:3,brady:3,svt:1,af:1}
! Chest pain or breathlessness during episodes {vt:2,af:1,svt:1}
- Heat intolerance, weight loss, tremor, sweating {thy:4}
- Fatigue, pallor, heavy periods {anaem:3}
- Caffeine, alcohol, stimulants, decongestants, salbutamol, thyroxine {drug:3,ect:1}
- Stress, panic, tingling around the mouth {anx:3}
- Previous MI, cardiomyopathy, heart failure {vt:3,af:1}
- Family history of sudden death or arrhythmia {vt:2}
- Hypertension, valve disease, rheumatic fever {af:2}
E
- Pulse irregularly irregular {af:5}
- Regular tachycardia above 150 {svt:3,vt:2}
- Bradycardia {brady:4}
- Hypotension or signs of compromise {vt:2,af:1,svt:1}
- Fine tremor, warm sweaty palms, goitre, lid lag {thy:4}
- Pallor {anaem:3}
- Murmur (mitral stenosis or regurgitation) {af:2}
- Cannon a waves in JVP {vt:2,brady:2}
- Signs of heart failure {af:1,vt:1}

@breath|Breathlessness|Respiratory|Medicine
SC wells,curb,qsofa,news
I SpO2 and ABG; CXR; ECG; FBC, U&E, BNP; peak flow and spirometry; D-dimer or CTPA guided by Wells; echo; sputum culture
D hf|Heart failure||1.2
D copd|COPD exacerbation||1.2
D ast|Asthma||1
D pneu|Pneumonia||1
D pe|Pulmonary embolism|!|0.8
D ptx|Pneumothorax|!|0.4
D eff|Pleural effusion||0.6
D ild|Interstitial lung disease||0.5
D anaem|Anaemia||0.6
D mal|Lung cancer / SVC obstruction||0.5
D anx|Anxiety / hyperventilation||0.7
D tamp|Pericardial effusion / tamponade|!|0.2
H Onset and pattern
- Sudden onset (minutes) {pe:3,ptx:3,ast:1}
- Progressive over weeks to months {ild:3,copd:2,mal:2,hf:2,anaem:1}
- Exertional: record distance on the flat, stairs, hills {hf:1,copd:1,anaem:1,ild:1}
- Orthopnoea (number of pillows) {hf:4}
- Paroxysmal nocturnal dyspnoea {hf:4}
- Nocturnal or seasonal variation, triggers (dust, cold air, allergens) {ast:4}
H Associated symptoms
- Cough with sputum and fever {pneu:3,copd:2}
- Wheeze {ast:3,copd:3,hf:1}
- Pleuritic chest pain {pe:2,pneu:2,ptx:2}
- Haemoptysis {pe:2,mal:3,pneu:1}
- Ankle swelling {hf:3}
- Weight loss, night sweats {mal:3}
- Unilateral leg swelling, recent surgery or immobility {pe:4}
H Risk factors
- Smoker (pack-years) {copd:4,mal:3,ild:1}
- Occupational dust, asbestos, birds, amiodarone {ild:3,mal:2}
- IHD, hypertension, diabetes {hf:3}
- Atopy, eczema, family history of asthma {ast:3}
- Panic, tingling around the mouth, normal examination {anx:4}
E General
! Cyanosis, exhaustion, silent chest, cannot complete sentences {ast:2,copd:2,pe:1,ptx:1,pneu:1}
- Respiratory rate, accessory muscle use, pursed-lip breathing {copd:3,ast:2}
- Clubbing {mal:3,ild:3}
- Pallor {anaem:4}
- Raised JVP {hf:3,pe:2,tamp:3}
- Peripheral oedema {hf:3}
- Asterixis (CO2 retention flap) {copd:2}
E Chest
- Hyper-expanded chest, reduced cricosternal distance {copd:3}
- Tracheal deviation {ptx:3,eff:2,mal:1}
- Stony dull percussion, reduced breath sounds at the base {eff:5}
- Bronchial breathing, increased vocal resonance, dullness {pneu:5}
- Polyphonic expiratory wheeze {ast:3,copd:3}
- Fine end-inspiratory crackles at the bases (velcro) {ild:5}

  if(hr==null)miss.push('HR');else add('HR',hr<=40?3:hr<=50?1:hr<=90?0:hr<=110?1:hr<=130?2:3);

  var any3=false;for(var k in parts)if(parts[k]===3)any3=true;
  var txt=tot>=7?'High (7 or more): emergency response, critical care review.':tot>=5?'Medium (5 to 6): urgent response by a clinician skilled in acute illness.':any3?'Low to medium: a single red score of 3 needs urgent ward-based review.':tot>=1?'Low (1 to 4): ward-based response, at least 4-6 hourly observations.':'Low (0): routine monitoring.';

  L.push('');L.push('O - OBJECTIVE');
  var vl=vitLine(v);if(vl)L.push('Vitals: '+vl);
  var n=news2(v);if(n.any&&!n.miss.length)L.push('NEWS2: '+n.tot);
  if(c.ep.length){L.push('Abnormal findings:');c.ep.forEach(function(t){L.push('  - '+t)})}
  if(c.en.length){L.push('Normal or absent:');c.en.forEach(function(t){L.push('  - '+t)})}
  if(tx.exn)L.push('Other examination: '+tx.exn);
  var sr=scoreResults(e);if(sr.length){L.push('Scores:');sr.forEach(function(t){L.push('  - '+t)})}
  L.push('');L.push('A - ASSESSMENT');
  var hid=DB.hideDdx;
  L.push('Working diagnosis: '+(tx.dx||(!hid&&ds.nF?ds.res[0].d.name+' (suggested by findings)':'not yet formulated')));
  if(!hid&&ds.nF){L.push('Differential (ranked by fit with findings): '+ds.res.slice(0,4).map(function(r,i){return (i+1)+'. '+r.d.name}).join('; '))}
  var mm=hid?[]:mnmStatus(e);if(mm.length)L.push('Must not miss: '+mm.map(function(x){return x.d.name+(x.ex?' (excluded)':' (not yet excluded)')}).join('; '));
  var rf=redFlags(e);if(rf.length)L.push('Red flags present: '+rf.map(function(i){return i.t}).join('; '));
  L.push('');L.push('P - PLAN');
  L.push('Suggested initial work-up: '+P.inv);
  if(tx.plan)L.push('Own plan: '+tx.plan);
  L.push('');L.push('Teaching aid. Verify against local guidelines and your supervisor.');

}
function sentence(arr){return arr.join('; ')}
function buildPres(e){
  var P=getP(e.pid),c=collect(e),tx=e.tx,v=e.v||{},ds=ddxScores(e),L=[];
  L.push('This is a '+ptWho(e)+(e.pt.loc?' ('+e.pt.loc+')':'')+', presenting with '+(e.cc||(P.id==='other'?'an unspecified complaint':P.name.toLowerCase()))+(e.dur?' for '+e.dur:'')+'.');
  if(tx.hpc)L.push(tx.hpc.replace(/\s+$/,'').replace(/\.?$/,'.'));
  if(c.hp.length)L.push('Pertinent positives: '+sentence(c.hp)+'.');
  if(c.hn.length)L.push('Pertinent negatives: '+sentence(c.hn)+'.');
  var bg=[];if(tx.pmh)bg.push('past history of '+tx.pmh);if(tx.dh)bg.push('on '+tx.dh);if(tx.all)bg.push('allergies: '+tx.all);if(tx.sh)bg.push(tx.sh);if(tx.fh)bg.push('family history: '+tx.fh);
  if(bg.length)L.push('Background: '+bg.join('; ')+'.');
  var rp=rosPres(e);if(rp)L.push(rp);
  var vl=vitLine(v);if(vl)L.push('On examination, '+vl+'.');
  if(c.ep.length)L.push('Abnormal findings: '+sentence(c.ep)+'.');
  if(c.en.length)L.push('Pertinent normal findings: '+sentence(c.en)+'.');
  var hid=DB.hideDdx;var lead=tx.dx||(!hid&&ds.nF?ds.res[0].d.name:'');
  var keys=c.hp.slice(0,2).concat(c.ep.slice(0,2));
  if(lead){L.push('In summary, this is a '+ptWho(e)+' with '+(e.cc||(P.id==='other'?'an unspecified complaint':P.name.toLowerCase()))+(keys.length?', '+keys.join(', ').toLowerCase():'')+'. My leading diagnosis is '+lead+'.')}
  var alts=(!hid&&ds.nF)?ds.res.slice(1,4).map(function(r){return r.d.name}):[];
  if(alts.length)L.push('Differentials include '+alts.join(', ')+'.');
  var mm=hid?[]:mnmStatus(e).filter(function(x){return !x.ex}).map(function(x){return x.d.name});
  if(mm.length)L.push('I would specifically exclude '+mm.join(', ')+'.');
  L.push('I would investigate with '+P.inv.split(';').slice(0,4).join(',').trim()+'.');
  return L.join('\n\n');
}

function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function copyText(text){
  var p=(navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(text):Promise.reject();
  return p.then(function(){return true}).catch(function(){
    try{var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}});
}
function blobSave(name,text){try{var b=new Blob([text],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},3000);return true}catch(e){return false}}
function offerFile(name,text){
  var get=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')):Promise.resolve(null);
  return get.then(function(dl){
    if(!dl){if(!window.claude&&blobSave(name,text)){toast('Saved '+name);return}return copyText(text).then(function(){toast('Saving is unavailable here. Copied to clipboard.')})}
    return dl.save({filename:name,data:text}).then(function(){toast('Saved '+name)}).catch(function(err){
      if(err&&err.code==='declined')return;
      if(err&&err.code==='rate_limited'){toast('Wait a moment, then try again.');return}
      return copyText(text).then(function(){toast('Could not save. Copied to clipboard.')})});
  }).catch(function(){return copyText(text).then(function(){toast('Saving failed. Copied to clipboard.')})});
}
function csvCell(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function buildCSV(){
  var rows=[['Date','Ref','Age','Sex','Location','Presentation','System','Working diagnosis','Top differential','History items asked','Exam items done','HPC notes']];
  DB.encs.slice().sort(function(a,b){return a.t0-b.t0}).forEach(function(e){
    var P=getP(e.pid);if(!P)return;var pr=progress(e),ds=ddxScores(e);
    rows.push([dstr(e.t0),e.pt.ref,e.pt.age,e.pt.sex,e.pt.loc,P.name,P.sys,e.tx.dx,ds.nF?ds.res[0].d.name:'',pr.h+'/'+pr.ht,pr.x+'/'+pr.xt,e.tx.hpc]);

function genQuiz(pid){
  var pool=pid?[getP(pid)]:PRES;
  for(var tries=0;tries<80;tries++){
    var P=pool[Math.floor(Math.random()*pool.length)];if(P.dd.length<4)continue;
    var d=P.dd[Math.floor(Math.random()*P.dd.length)],items=[];
    P.sections.forEach(function(s){s.items.forEach(function(it){
      var w=it.w[d.k];if(!(w>=3))return;var best=true;for(var k in it.w){if(k!==d.k&&it.w[k]>w)best=false}
      if(best)items.push({it:it,kind:s.kind})})});
    if(items.length<3)continue;
    var pick=shuffle(items).slice(0,4).sort(function(a,b){return a.kind<b.kind?-1:1});
    var others=shuffle(P.dd.filter(function(x){return x!==d})).slice(0,3);
    return {pid:P.id,d:d,items:pick,all:items,opts:shuffle(others.concat([d])),ans:null};
  }
  return null;
}

    DB.encs=DB.encs.filter(function(x){return x.id!==id});if(DB.curId===id){DB.curId=null}UI.armed=null;saveSoon();render(true);toast('Deleted');
  },
  expJson:function(){if(!DB.encs.length){toast('Nothing to export yet');return}offerFile('bedside-hp-log-'+dstr(Date.now())+'.json',JSON.stringify({app:'bedside-hp',v:1,encs:DB.encs},null,1))},
  expCsv:function(){if(!DB.encs.length){toast('Nothing to export yet');return}offerFile('bedside-hp-logbook-'+dstr(Date.now())+'.csv',buildCSV())},
  impPick:function(){$('#imp').value='';$('#imp').click()},
  scChk:function(t){
    var s=SCMAP[t.dataset.sid],h=scHolder(),i=parseInt(t.dataset.i,10);
    var st=h[s.id]||(h[s.id]={v:{}});st.t=1;st.v[i]=st.v[i]===1?0:1;scUpdate(s,st,t);touch();
  },
  signSys:function(t){UI.signsys=t.dataset.sys;render(true)},
  prMode:function(t){UI.pr=t.dataset.m;render(true)},
  osceStart:function(){
    var pid=$('#oscePid').value||PRES[Math.floor(Math.random()*PRES.length)].id;UI.oscePid=$('#oscePid').value;UI.osceMins=parseInt($('#osceMins').value,10);
    UI.osce={pid:pid,left:UI.osceMins*60,marks:{},running:true,done:false};render();
  },
  osceTick:function(t){var o=UI.osce,k=t.closest('[data-ok]').dataset.ok;if(o.marks[k])delete o.marks[k];else o.marks[k]=1;t.classList.toggle('on',!!o.marks[k]);t.setAttribute('aria-pressed',!!o.marks[k])},
  osceFinish:function(){finishOsce()},
  osceReset:function(){clearInterval(timerId);UI.osce=null;render()},
  quizNew:function(){UI.quizPid=$('#quizPid').value;UI.quiz=genQuiz(UI.quizPid);if(!UI.quiz)toast('Not enough material for that topic. Try Random.');render(true)},
  quizAns:function(t){var q=UI.quiz;if(q.ans!=null)return;q.ans=parseInt(t.dataset.i,10);DB.quiz.t++;if(q.opts[q.ans]===q.d)DB.quiz.c++;saveSoon();render(true)}
};
function scUpdate(s,st,t){
  var tot=scoreTotal(s,st.v);var r=$('#scr-'+s.id);if(r)r.innerHTML=scResult(s,st);var p=$('#scp-'+s.id);if(p)p.textContent=tot;
  if(t&&t.dataset.act==='scChk'){var i=parseInt(t.dataset.i,10),on=st.v[i]===1,opt=s.items[i][1][1][1];t.classList.toggle('on',on);t.setAttribute('aria-pressed',on);t.textContent=on?'Yes (+'+opt+')':'Yes'}
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var a=ACT[t.dataset.act];if(a)a(t,ev);
});
function onField(ev){
  var t=ev.target;
  if(t.id==='pq'){UI.pq=t.value;$('#pickList').innerHTML=pickList(t.value.toLowerCase());return}
  if(t.id==='logq'){UI.logq=t.value;$('#logList').innerHTML=logList();return}
  if(t.id==='signq'){UI.signq=t.value;$('#signList').innerHTML=signList();return}
  if(t.dataset&&t.dataset.sc){
    var pp=t.dataset.sc.split(':'),s=SCMAP[pp[0]],h=scHolder(),st=h[s.id]||(h[s.id]={v:{}});st.t=1;st.v[parseInt(pp[1],10)]=parseInt(t.value,10);scUpdate(s,st,null);touch();return}
  if(t.dataset&&t.dataset.pk){var sh=smkHolder();sh[t.dataset.pk]=t.value;if(t.dataset.pk==='c'&&t.value!=='')sh.p='';touch();var outs=document.querySelectorAll('.pyOut');for(var oi=0;oi<outs.length;oi++)outs[oi].textContent=pyText(sh);return}
  if(t.dataset&&t.dataset.b){
    var e=curEnc();if(!e)return;var path=t.dataset.b,val=t.value;
    if(path==='v.o2')val=t.value==='1';
    setPath(e,path,val);touch();
    if(path.indexOf('v.')===0){var vo=$('#vitOut');if(vo)vo.innerHTML=vitOut(e.v);var nw=$('#scr-news');if(nw){var n=news2(e.v);nw.textContent=n.any?n.tot+(n.miss.length?'+':''):'--'}}
  }
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
$('#imp').addEventListener('change',function(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var o=JSON.parse(r.result),list=Array.isArray(o)?o:o.encs;if(!Array.isArray(list))throw 0;
      var add=0,have={};DB.encs.forEach(function(x){have[x.id]=x});
      list.forEach(function(x){if(!x||!x.id||!getP(x.pid))return;var old=have[x.id];if(!old){DB.encs.push(x);add++}else if((x.t||0)>(old.t||0)){DB.encs[DB.encs.indexOf(old)]=x;add++}});
      saveSoon();render(true);toast('Imported '+add+' encounter'+(add===1?'':'s'));
    }catch(err){toast('That file is not a Bedside H&P export.')}
  };
  r.readAsText(f);
});
var ACCENTS={
 blue:{n:'Blue',l:['#1F5FBF','#DCE8FA','#FFFFFF'],d:['#7DB0F5','#172F52','#0A1C36']},
 teal:{n:'Teal',l:['#0A7580','#D5ECEE','#FFFFFF'],d:['#4EC3CD','#143A40','#06262A']},
 green:{n:'Green',l:['#2B7A3E','#DDF0E2','#FFFFFF'],d:['#6FD08A','#153221','#07230F']},
 plum:{n:'Plum',l:['#8A3A7A','#F3E1EF','#FFFFFF'],d:['#E19AD3','#3A1A35','#2E0F29']},
 amber:{n:'Amber',l:['#B4570A','#FBE8D4','#FFFFFF'],d:['#F0A25A','#3A2410','#2E1505']}
};
function applyAccent(){
  if(!ACCENTS[DB.accent])DB.accent='blue';
  var a=ACCENTS[DB.accent],st=document.getElementById('accentStyle');
  if(!st){st=document.createElement('style');st.id='accentStyle';document.body.appendChild(st)}
  var r=function(c){return '--accent:'+c[0]+';--accent-soft:'+c[1]+';--accent-ink:'+c[2]+';'};
  st.textContent=':root{'+r(a.l)+'}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){'+r(a.d)+'}}:root[data-theme="dark"]{'+r(a.d)+'}';
}
function applyTheme(){var r=document.documentElement;if(DB.theme)r.setAttribute('data-theme',DB.theme);else r.removeAttribute('data-theme')}

/* ================= boot ================= */
applyTheme();applyAccent();
(function(){
  var e=curEnc();
  if(!e&&DB.curId){DB.curId=null}
  if(!e)UI.pick=true;
  UI.infoOpen=!e||!e.pt.ref;
  render();
})();
})();

</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
