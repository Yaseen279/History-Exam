23":"Is it in a lymph node area?","H24":"Is there an infection nearby?","H25":"Is it a firm small brown bump that dimples when pinched?","H26":"Does melanoma run in your family?","H27":"Do you have fair skin?","H28":"Do you have many moles?"},"dyspep":{"H0":"Do you get burning pain behind the breastbone?","H1":"Do you get regurgitation?","H2":"Is it worse when lying flat?","H3":"Is it worse after large meals?","H4":"Is the upper abdominal pain related to food?","H5":"Does night pain ease when you eat?","H6":"Is the pain made worse by food?","H7":"Do you take NSAIDs?","H8":"Do you take aspirin?","H9":"Do you take steroids?","H10":"Do you drink alcohol?","H11":"Do you feel bloated?","H12":"Do you feel full after a few mouthfuls?","H13":"Do you feel sick?","H14":"Have you no alarm symptoms (weight loss, vomiting, bleeding, trouble swallowing)?","H15":"Do you have difficulty swallowing?","H16":"Do you have persistent vomiting?","H17":"Have you lost weight without trying?","H18":"Have you been told you are anaemic?","H19":"Have you vomited blood?","H20":"Have you passed black, tarry stools?","H21":"Are you over 55 with new symptoms?","H22":"Does gastric cancer run in your family?","H23":"Do you get colicky right upper abdominal pain after fatty meals?","H24":"Does the pain spread to the right shoulder?","H25":"Does the epigastric pain go through to the back?","H26":"Do you drink alcohol heavily?","H27":"Do you have gallstones?","H28":"Do you vomit?","H29":"Do you get chest tightness on exertion?","H30":"Do you sweat with the pain?","H31":"Have you been treated for H. pylori before?","H32":"Do ulcers run in your family?","H33":"Is sanitation poor where you live?","H34":"Do you have diabetes, with early fullness and vomiting of undigested food?"},"postop":{"H3":"Is there bleeding in the first six hours after surgery?","H4":"Is the patient in shock in the immediate post-operative period?","H5":"Is there respiratory depression in the immediate period?","H6":"Is there an arrhythmia in the immediate period?","H7":"Is there anaphylaxis in the immediate period?","H8":"Is there fever or chest symptoms on days 1 to 2 (wind)?","H9":"Is there fever on days 3 to 4 (water: urine)?","H10":"Is there fever on days 5 to 6 (walking: legs and lungs)?","H11":"Is there fever from day 7 (wound, collections, leak)?","H12":"Is there fever after a new drug or a transfusion (wonder drugs)?","H13":"Does the patient have a cough?","H14":"Is the patient bringing up sputum?","H15":"Is the patient breathless?","H16":"Is the patient not breathing deeply or not mobilising?","H17":"Does the patient have wound pain?","H18":"Is the wound red?","H19":"Is the wound swollen?","H20":"Is there wound discharge?","H21":"Has the wound burst open?","H22":"Is pink fluid leaking on coughing or straining?","H23":"Is it day 5 to 10 after surgery?","H24":"Does it burn when the patient passes urine?","H25":"Is the patient passing urine more often?","H26":"Is the catheter still in?","H27":"Is the patient unable to pass urine?","H28":"Does the patient have discomfort above the pubic bone?","H29":"Does the patient have calf pain or swelling?","H30":"Does the patient have pain on breathing in?","H31":"Is the patient breathless?","H32":"Does the patient have abdominal pain?","H33":"Is the abdomen distended?","H34":"Has the patient vomited?","H35":"Has the patient passed no wind or stool?","H36":"Is the fever rising?","H37":"Has the patient had rigors?","H38":"Is the abdominal pain getting worse after bowel surgery?","H39":"Did rigors start during a transfusion?","H40":"Did rigors start after a new drug?","H41":"Has a rash appeared?","H42":"Is the cannula or central line site painful?","H43":"Is the cannula or central line site red?","H44":"Is the pain increasing?","H45":"Does the patient feel dizzy?","H46":"Does the patient feel faint early after surgery?","H47":"Does the patient have tingling around the mouth or fingers?","H48":"Does the patient have cramps after thyroid or parathyroid surgery?","H49":"Does the patient have diabetes?","H50":"Is the patient malnourished?","H51":"Is the patient obese?","H52":"Is the patient on steroids?","H53":"Does the patient smoke?","H54":"Is the patient immunosuppressed?","H55":"Was the surgery an emergency or contaminated?","H56":"Was the operation long?","H57":"Is the patient immobile?","H58":"Does the patient have a malignancy?","H59":"Has the patient had a DVT before?","H60":"Did the patient miss thromboprophylaxis?"},"other":{"H0":"~Ask: what is your main complaint, in your own words?","H1":"~Ask: how long has this been going on?","H2":"~Ask: where exactly is it, and does it spread anywhere?","H3":"~Ask: did it start suddenly or gradually?","H4":"~Ask: is this the first time, or has it happened before?","H5":"~Ask: what is it like, and how bad is it from 0 to 10?","H6":"~Ask: is it constant or does it come and go?","H7":"~Ask: does it vary through the day?","H8":"~Ask: what makes it better or worse?","H9":"~Ask: how has it affected your daily activities?","H10":"~Ask: have you noticed any other symptoms with it?","H11":"~Ask: have you had anything like this before?","H12":"~Ask: have you been given a diagnosis for it before?","H13":"~Ask: what treatment have you had, and did it help?","H14":"~Ask: what do you think is causing it?","H15":"~Ask: what worries you most about it?","H16":"~Ask: what are you hoping we can do for you?","H17":"Have you lost weight without trying?","H18":"Have you had a fever?","H19":"Have you had night sweats?","H20":"Have you had any bleeding?","H21":"Have you noticed bruising anywhere?","H22":"Have you had chest pain?","H23":"Have you been breathless?","H24":"Have you collapsed?","H25":"Have you been confused?","H26":"Do you have any new weakness?","H27":"Have you lost sensation anywhere?","H28":"Have you lost vision?"},"genhx":{"H0":"~Record the patient's name, age and gender","H1":"~Record the patient's occupation","H2":"~Record the marital status","H3":"~Record where the patient lives (residency)","H4":"~Record the religion","H5":"~Record the date of admission","H6":"~Record the date you are taking the history","H7":"~Record the mode of referral (how the patient was sent to you)","H8":"~Record the mode of arrival (how the patient got here)","H9":"~Ask: why have you come to hospital? Use the patient's own words","H10":"~Ask: how long has each complaint lasted?","H11":"~Ask: when were you last completely well?","H12":"~Ask: what was the first thing you noticed when you became ill?","H13":"~Ask for a full description of each other symptom","H14":"~If there is pain, ask: where exactly is it?","H15":"~If there is pain, ask: how did it start?","H16":"~If there is pain, ask: what is it like?","H17":"~If there is pain, ask: does it spread anywhere?","H18":"~If there is pain, ask: how long does it last?","H19":"~If there is pain, ask: does it come and go in a pattern?","H20":"~If there is pain, ask: how severe is it from 0 to 10?","H21":"~If there is pain, ask: what makes it worse?","H22":"~If there is pain, ask: what eases it?","H23":"~If there is pain, ask: what other symptoms come with it?","H24":"Have you had a similar problem before?","H25":"Do you have diabetes?","H26":"Do you have high blood pressure?","H27":"Have you had angina or a heart attack?","H28":"Have you ever had jaundice?","H29":"Have you ever had tuberculosis?","H30":"Have you ever had rheumatic fever?","H31":"Do you have epilepsy?","H32":"Do you have asthma?","H33":"Have you ever had a stroke?","H34":"Have you been in hospital before?","H35":"Have you had any operations, under general or local anaesthesia?","H36":"Have you had any other procedures, such as angioplasty or endoscopy?","H37":"Did you have any complications after an operation?","H38":"Have you ever had a blood transfusion?","H39":"Has anyone in your family had a similar illness?","H40":"Does high blood pressure run in your family?","H41":"Does diabetes run in your family?","H42":"Does heart disease run in your family?","H43":"Has anyone in your family had tuberculosis?","H44":"~Ask about first-degree relatives: their age, their health, or what they died of","H45":"~Ask: do you smoke? Work out the pack-years","H46":"~Ask: do you drink alcohol? How much, and what type?","H47":"~Ask about the home situation: who do you live with?","H48":"~Ask: how well do you get around, and do you have help at home?","H49":"~Ask about diet: what do you usually eat?","H50":"~Ask about the water supply: where does your drinking water come from?","H51":"Have you travelled abroad recently?","H52":"~Ask: what are your hobbies?","H53":"Do you keep animals in the house?","H54":"~Ask the sexual history (with sensitivity and privacy)","H55":"~Ask: what work did you do?","H56":"~Ask: how long did you do it?","H57":"Was there anything in your work that could affect your health, such as dust, chemicals, farming or birds?","H58":"~Ask: which medicines have you been prescribed?","H59":"~Ask: do you take any medicines you buy yourself?","H60":"~Ask: do you use herbal or alternative remedies?","H61":"Are you allergic to any drug? What reaction did it cause?","H62":"Do you have any other allergies, such as latex or food?","H63":"Have you ever had problems with an anaesthetic?"},"drain":{"H0":"~Record: which operation was done?","H1":"~Record: the date of the operation","H2":"~Record: which post-operative day is it?","H3":"~Record: why was the drain placed (therapeutic, diagnostic, prophylactic, monitoring or palliative)?","H4":"Is there more than one drain? Check, as they can be hidden under the patient's belongings","H5":"Do you have pain at the drain site?","H6":"Is fluid leaking around the drain?","H7":"Have you had a fever?","H8":"Have you had shaking chills (rigors)?","H9":"Have you had new abdominal pain since the drain was placed?","H10":"~Record: how much has drained over the last 24 hours?","H11":"~Record: is the output going up, going down, or steady?","H12":"~Record: what colour is the fluid (serous, serosanguinous, bloody, purulent, bilious, faecal, chylous)?","H13":"Has the drain suddenly stopped draining?","H14":"Is the fluid being replaced with IV fluids because the losses are large?"}};

/* OSCE technique guides: [phase, what to do / say]. Standard teaching sequence; check against your department's version. */
var GUIDES=[
{id:'hist',n:'History taking (Bailey & Love)',s:'History',st:[
['Prepare','Wash hands, introduce yourself, explain why you are there, ask permission, privacy, chaperone if needed. Plain language, no jargon.'],
['Record the basics','Name, age, sex, occupation, and the date and time you saw the patient.'],
['Present complaint','Ask for the main complaint in the patient’s own words, not what another doctor told them. Ask "What is the problem you want me to sort out?" List complaints in order of severity with exact dates.'],
['History of the complaint','Go right back to the beginning. Record onset, course, and any similar earlier episodes with dates. Do not use leading questions: ask "Does the pain ever move?" then "Where does it go?"'],
['Pain','Time and nature of onset, site, character (burning, throbbing, stabbing, constricting, colicky, aching), severity, progression, duration, how it ended, radiation, relieving factors, exacerbating factors, associated symptoms (vomiting, diarrhoea, painful micturition, missed periods).'],
['Rest of the affected system','Ask the remaining questions for the system that is involved, for example the full alimentary list for indigestion.'],
['Systematic direct questions: alimentary','Appetite, diet, weight, nausea, dysphagia, regurgitation, flatulence, heartburn, vomiting, haematemesis, indigestion pain, abdominal pain, jaundice, distension, bowel habit and stool, rectal bleeding, mucus, prolapse, incontinence, tenesmus.'],
['Systematic direct questions: other systems','Respiratory (cough, sputum, haemoptysis, dyspnoea, wheeze, chest pain, exercise tolerance), cardiovascular (orthopnoea, PND, palpitations, ankle swelling, dizziness, walking distance), urogenital (loin pain, frequency, stream, dysuria, haematuria, menstrual and obstetric history), nervous system (fits, weakness, sensory change, headache) and musculoskeletal.'],
['Past medical and surgical','Previous illnesses, operations, accidents, diabetes, rheumatic fever, bleeding tendency, asthma, allergies, TB, sexually transmitted and tropical diseases.'],
['Drugs and immunizations','All prescription and over-the-counter drugs with doses. Always check allergies. Immunizations: BCG, diphtheria, tetanus, typhoid, measles.'],
['Family history','Causes of death of close relatives, and familial illness in siblings and children.'],
['Social history','Marital status, living accommodation, occupation and industrial exposures, travel abroad, leisure, smoking (cigarettes per day), alcohol (units per week).'],
['Close','Summarise back to the patient, ask "Is there anything I have missed?", then thank them.']
],pl:['Read the referral letter after you take your own history, so it does not bias you.','Record frequency and consistency instead of the words "diarrhoea" or "constipation".','The absence of an associated symptom is as important as its presence.']},

{id:'gen',n:'General examination and hands',s:'General',st:[
['Prepare','Wash hands, introduce, consent, privacy, chaperone, good light, patient positioned and exposed appropriately.'],
['General inspection','Look from the end of the bed: build, wasting (starvation, malignancy, TB, thyrotoxicosis, diabetes), obesity or fluid retention, facies (myxoedema, Cushing, acromegaly, Bell palsy), colour (pallor, jaundice, cyanosis), breathing and comfort.'],
['Hands: pulse first','Hold the hand to make contact and count the pulse (rate, rhythm, volume).'],
['Hands: nails and skin','Koilonychia (anaemia), clubbing (angle over 180 degrees, nail-fold swelling), splinter haemorrhages, pits and furrows, nicotine staining, callosities, palmar pallor, palmar erythema, temperature and sweating.'],
['Eyes','Palpebral fissures, ptosis, proptosis, pupils (size, equality, light and accommodation reaction), eye movements in all directions, diplopia, nystagmus, conjunctival pallor, scleral jaundice, arcus senilis, xanthelasma, fundoscopy.'],
['Mouth and tongue','Cyanosis, anaemia, hydration, ulcers, candida, teeth and gums, breath odour.'],
['Neck','Lymph nodes (see lymph node guide), thyroid, JVP.'],
['Oedema','Press over the ankles and sacrum and look for pitting.'],
['Finish','Cover the patient, thank them, wash hands. State your general findings even when normal.']
],pl:['Clubbing: pulmonary, cardiac and gastrointestinal causes.','Examine the whole patient, not only the area they complain about.']},

{id:'abd',n:'Abdominal examination (Bailey & Love)',s:'Examination',st:[
['Prepare the room and couch','Warm, private room with good light. A hard couch with the backrest raised 15 to 20 degrees keeps the lordosis and relaxes the abdominal wall.'],
['Your position','Hands clean, warm, short nails. Sit or kneel beside the bed so your forearm is horizontal and level with the abdomen. Do not lean over from standing.'],
['Expose and relax','Lie flat on one or two pillows. Expose from the xiphisternum to the mid-thigh (or nipples to knees), covering the lower abdomen and genitalia for dignity. Head on a pillow, arms by the sides (not behind the head). If still tense, flex the hips to 45 degrees and the knees to 90.'],
['General look and hands','Cachexia, pallor, jaundice. Then hands, nails and face (clubbing, leuconychia, palmar erythema, flap, pallor, scleral icterus, mouth).'],
['Inspect from the end of the bed','Skin (scars, striae, dilated veins, rashes, pigmentation), umbilicus (inverted and central; everted with ascites or hernia), shape, movements, pulsations and hernias. Old scars are white and recent ones pink; scars can bulge as incisional hernias. Wide pink-purple striae suggest Cushing. Distension: the 5 Fs (fat, fluid, flatus, faeces, fetus). Does the patient lie still (peritonitis) or roll around (colic)? Abdominal movement is lost in generalised peritonitis and paradoxical in diaphragm paralysis.'],
['Veins and signs','Flow away from the umbilicus (caput medusae, portal hypertension); flow upwards in flank and chest veins (IVC obstruction, with leg swelling). Bruising around the umbilicus (Cullen) or in the flanks (Grey Turner) suggests retroperitoneal bleeding: haemorrhagic pancreatitis, ruptured aorta, ruptured ectopic. Visible peristalsis: pyloric obstruction or distal small bowel obstruction. Epigastric pulsation that persists in every position suggests an aortic aneurysm; one that disappears in the knee-elbow position is transmitted from a tumour.'],
['Light palpation','Ask the patient to point to the pain first. Start away from it. If right-handed, start in the left iliac fossa and go anticlockwise to the right iliac fossa. Watch the face. Look for tenderness and guarding.'],
['Rebound','Four ways: sudden release of a pressing hand; ask the patient to cough; gentle percussion over the area (the best); gently shake the bed. Voluntary guarding is from fear or cold hands. Involuntary guarding (rigidity) is reflex muscle contraction from parietal peritoneal inflammation and is the cardinal sign of peritonitis. Tenderness site clues: epigastrium peptic ulcer, right hypochondrium cholecystitis or hepatitis, left iliac fossa diverticulitis, right iliac fossa appendicitis or Crohn ileitis.'],
['Deep palpation for masses','Describe site, shape, size, surface, edge, consistency, fluid thrill, resonance and pulsatility, and whether it moves with breathing. Ask the patient to lift the head: an abdominal wall mass stays palpable but an intra-abdominal mass disappears. Faeces can be indented. A hard umbilical nodule is Sister Mary Joseph nodule (metastasis). Press during expiration, not with rapid hard pressure.'],
['Liver','Right hand flat and transverse in the right iliac fossa, parallel to the costal margin. Ask for a deep breath and move up inch by inch. Describe the edge and surface. Percuss the upper margin. Liver span is normally 10 to 14 cm. Smooth, soft, tender: hepatitis, heart failure, Budd-Chiari, fatty. Hard, nodular, painless: malignancy. Pulsatile: tricuspid regurgitation. Gallbladder: Murphy sign (fingers under the right costal margin, deep breath stops abruptly). A non-tender palpable gallbladder with jaundice suggests pancreatic cancer (Courvoisier law).'],
['Spleen','Start in the right iliac fossa below the umbilicus and move towards the tip of the left tenth rib. Lift the lower left ribs with the other hand. Look for the notch, dullness on percussion, and that you cannot get above it. The spleen must enlarge two to three times to be felt. It moves down and medially. Massive splenomegaly: CML, myelofibrosis, malaria, leishmaniasis.'],
['Kidneys','One hand behind the loin lifting forward, the other below the costal margin. Palpate between the hands and ballot an enlarged kidney. Kidney versus spleen: kidney can be got above, no notch, ballotable, resonant (bowel in front). Spleen: cannot get above, notch, not ballotable, dull.'],
['Percussion','Percuss the whole abdomen and over any mass. Shifting dullness for ascites: percuss from the midline to the flank, mark the dull note, roll the patient to the other side, wait 10 seconds, percuss again; it becomes resonant if ascites. Fluid thrill only in gross ascites. Loss of liver dullness means free gas; dull liver downwards in COPD. Succussion splash (not eaten for 4 hours) means delayed gastric emptying, as in pyloric stenosis.'],
['Auscultation','Bowel sounds: normal gurgles every few seconds, absent for 30 seconds (paralytic ileus), tinkling (obstruction). Listen for up to 2 minutes before calling it silent (generalised peritonitis, paralytic ileus). Loud borborygmi: mechanical obstruction. Bruits over the aorta, 2 to 3 cm above and lateral to the umbilicus (renal artery stenosis) and over the liver.'],
['Never forget','Supraclavicular nodes, hernial orifices (at rest and on coughing), femoral pulses, external genitalia, anal canal and rectum.'],
['Finish','Cover the patient. Present your findings and say which investigations you would arrange.']
],pl:['Examine genitalia and hernial orifices in every abdominal examination.','A tender mass is easier to feel by resting the hand and pressing a little deeper during expiration.','Tenderness on the opposite side when pressure is released can be a clue to the source of pain.']},

{id:'hernia',n:'Hernia and groin examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, chaperone, expose from the umbilicus to mid-thigh. Ask the patient to stand up.'],
['Look from the front','Exact site and shape of the lump: pear-shaped and oblique (indirect) or round and bulging forward (direct or femoral). Is it only inguinal or does it reach the scrotum? Look for visible bowel movement (enterocele). Does it extend into the scrotum? Look at the other groin and for scars from earlier repairs or a right iliac fossa incision.'],
['Feel from the front','Examine the scrotum and its contents. Can you get above the lump (feel its upper edge with normal cord above)? If yes it is scrotal, not a hernia.'],
['Feel from the side','Stand at the patient’s side with one hand in the small of his back and the examining hand flat on the lump, parallel to the inguinal ligament.'],
['Describe the lump','Position, temperature, tenderness, shape, size, tension, composition (solid, fluid, gas).'],
['Cough impulse','Compress the lump gently, ask the patient to turn away and cough. It must expand or become tense. Movement in one direction is not a cough impulse.'],
['Reduce it','Gently compress the lower part, then lift up towards the external ring, the way the patient does. Be very gentle with a possibly incarcerated hernia: do not push hard (reduction en masse). Taxis is not done for obstructed, strangulated or femoral hernias.'],
['Deep ring test','Once reduced, slide the fingers up and laterally to press over the internal ring and ask the patient to cough. Controlled: indirect. Not controlled: direct.'],
['Watch it reappear','Remove the hand. An indirect hernia slides obliquely down the canal; a direct hernia comes straight forward.'],
['Lying down','Large hernias are easier to reduce lying flat. This position is best for deciding if a hernia is femoral.'],
['Femoral hernia','Below the inguinal ligament and lateral to the pubic tubercle, behind the groin crease. Usually firm, rarely reducible, no usual cough impulse.'],
['Other side and abdomen','Examine the other groin (ask the patient to cough). Examine the abdomen for causes of raised pressure: bladder, ascites, mass, pregnancy. Feel the testis, epididymis and cord.'],
['Causes of straining','Per rectal for the prostate and rectal mass. Listen to the chest for cough and wheeze.'],
['Fitness','Assess the cardiovascular and respiratory systems for fitness for operation.'],
['If painful or irreducible','Check colour, temperature and tenderness. A strangulated hernia is very tender and the patient is unwell. Richter hernia: tender but no obstruction. Strangulated: tense, very tender, no cough impulse, vomiting, distension, toxic.']
],pl:['Irreducible: cannot be replaced. Incarcerated: stuck but not tender. Obstructed: bowel lumen blocked. Strangulated: blood supply compromised.','Always examine the hernial orifices in anyone with intestinal obstruction.','Direct hernias rarely strangulate because they do not pass through the internal ring.','Look-alikes in the groin: hydrocele (can get above it, transilluminates), node, saphena varix, femoral aneurysm, undescended testis.']},

{id:'lump',n:'Examination of any lump (Bailey & Love)',s:'Examination',st:[
['History','Duration, first symptom, other symptoms (pain, interference with movement or swallowing), progression, persistence (does it ever disappear?), multiplicity, what the patient thinks caused it.'],
['Site','Exact anatomical position, measured from bony points with a tape.'],
['Size and shape','Measure in three dimensions. Describe the shape, for example dumb-bell, pear or kidney shaped.'],
['Surface and skin','Smooth, bosselated or irregular. Colour and texture of the overlying skin.'],
['Temperature and tenderness','Use the dorsal fingers for temperature. Feel the non-tender part first and watch the face.'],
['Edge','Well defined or indistinct.'],
['Consistency','Stony hard, firm, rubbery, spongy or soft.'],
['Fluctuation','Press the centre while two fingers feel the sides, in two planes at right angles.'],
['Fluid thrill','Tap one side, feel the other. Place a hand edge between to block wall conduction.'],
['Transillumination','Pinpoint light at the side in a dark room. The whole lump should glow.'],
['Resonance','Percuss: solid and fluid lumps are dull, gas-filled ones resonant.'],
['Pulsatility','Fingers on opposite sides: pushed outwards and upwards means expansile; only upwards means transmitted.'],
['Compressibility and reducibility','Compressible lumps refill. Reducible lumps move away and may return with a cough.'],
['Bruit','Listen over the lump with a stethoscope.'],
['Relations','Mobility and fixity: skin, then deeper structures with the muscle tensed.'],
['Regional lymph nodes','Palpate the draining nodes (limbs: axillary and inguinal; head and neck: cervical; abdomen: para-aortic).'],
['Local tissues','Arteries, nerves, bones and joints nearby. Then examine the whole patient.']
],pl:['Describe first, then give a diagnosis.','A lump that disappears lying down or with exercise is only seen in a few types.','Pain suggests inflammation more than cancer. Many patients ignore a painless lump.']},

{id:'ulcer',n:'Examination of an ulcer',s:'Examination',st:[
['History','When first noticed, what drew attention (pain, bleeding, discharge), symptoms, changes since it appeared, previous ulcers at the same site or elsewhere, what the patient thinks caused it.'],
['Prepare','Wash hands, introduce, consent, expose the limb fully, good light. Use gloves. Do not remove a scab without permission.'],
['Site, size and shape','Exact site, measure it (trace on a clear sheet if irregular).'],
['Base','Healthy red granulation, slough, necrotic tissue, or exposed tendon or bone. Pale healing epithelium at the edge.'],
['Edge','Sloping (venous), punched out (neuropathic or ischaemic), undermined (pressure, TB), rolled and pearly (basal cell carcinoma), everted (squamous cell carcinoma).'],
['Depth','In millimetres, and which structures it reaches.'],
['Discharge','Serous, bloody, serosanguinous or purulent, and any smell.'],
['Surroundings and relations','Skin changes, tenderness, whether it is adherent to tendon, periosteum or bone (osteomyelitis).'],
['Local lymph nodes','Palpate the draining nodes: reactive or secondary deposits.'],
['Local tissues','Pulses and capillary refill, ABPI, sensation, venous changes, varicose veins.'],
['General examination','Hands and face for clues. Many systemic diseases present with ulcers.']
],pl:['Venous ulcers: gaiter area, sloping edge. Arterial: toes and heels, punched out. Neuropathic: sole and pressure points, painless.','A long-standing ulcer with a raised edge may be a Marjolin ulcer.']},

{id:'thy',n:'Neck swelling and thyroid (Bailey & Love)',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, sit the patient on a chair, expose the neck and upper chest.'],
['History points','Systemic illness (fever, weight loss, itch), mouth and throat symptoms, voice change, dysphagia, breathing difficulty, skin lumps, and symptoms of thyroid disease.'],
['Site','Anterior triangle (sternomastoid, jaw, midline) or posterior triangle (sternomastoid, trapezius, clavicle). Tense the muscles to define them: push the head down against your hand, and shrug against resistance.'],
['Relation to muscle','Palpate with the muscles relaxed and then contracted. A lump deep to muscle becomes less obvious when it contracts.'],
['Relation to the hyoid','Hold the jaw still and ask the patient to protrude the tongue. A swelling that moves is fixed to the hyoid (thyroglossal cyst).'],
['Relation to the trachea','Ask the patient to swallow a sip of water. Swellings attached to the trachea move up on swallowing.'],
['Thyroid: general','Agitation or lethargy, weight, sweating, voice, facies.'],
['Thyroid: hands','Pulse (tachycardia, AF, bradycardia), sweaty palms, fine fast tremor with arms outstretched and fingers separated (paper on the fingers).'],
['Thyroid: eyes','Lid retraction and lid lag (follow a finger downwards), exophthalmos (sclera visible below the iris), ophthalmoplegia (cannot look up and out), chemosis.'],
['Neck from the front','Look at the swelling and ask to swallow. Position of the trachea at the suprasternal notch. Confirm size, shape, surface and tenderness.'],
['Neck from behind','Thumbs on the ligamentum nuchae, head tilted slightly forward. Palpate each lobe and the isthmus with flat fingers. Swallow again. Can you feel the lower border, or is there retrosternal extension?'],
['Plane and skin','Tense the sternomastoid (turn the chin against your hand, or flex the neck against your hand): a thyroid lump stays deep to it. Pinch the skin to check it is free. A thyroid swells up on swallowing but does not move up on its own.'],
['Trachea','Middle finger down the midline from the suprasternal notch to find the trachea. A one-sided lobe pushes it to the opposite side.'],
['Describe the lump','Location, solitary or multiple, tenderness, shape, size, surface, consistency.'],
['Nodes','Palpate cervical and supraclavicular nodes.'],
['Percussion and auscultation','Percuss over the sternum for a retrosternal extension. Listen over the gland for a systolic bruit. Pemberton: both arms raised to the ears; facial flushing and neck vein engorgement mean retrosternal extension.'],
['Spread','Cancer: feel for neck nodes, the liver, and listen to the chest.'],
['General examination','Cardiovascular and nervous systems for hyper- or hypothyroidism (reflexes).'],
['Finish','State whether the patient is euthyroid, thyrotoxic or hypothyroid, and whether the swelling is diffuse or nodular.']
],pl:['The most important palpation is from behind.','Inability to get below the swelling on swallowing suggests significant retrosternal extension. Percussion is not reliable.','A hard, fixed node or a lump with hoarseness suggests malignancy.','Any thyroid lump may be malignant until proved otherwise.']},

{id:'nodes',n:'Lymph nodes',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, sit the patient up, expose neck, axillae, groins as needed.'],
['Plane and relation','Tense the sternomastoid: patient pushes the chin against your hand, or turns it against your hand. A deep swelling gets less obvious and less mobile when the muscle tightens; a swelling in front of the muscle stays prominent. Pinch the skin for fixity. Check fluctuation in two directions (Paget) and transillumination.'],
['Head and neck','Sit the patient on a stool and stand behind, neck slightly flexed. From in front or behind: submental, submandibular, pre-auricular, post-auricular, occipital, tonsillar, anterior and posterior cervical chains, supraclavicular.'],
['Axillae','Support the arm. Palpate the central, anterior (pectoral), posterior (subscapular), lateral and apical groups.'],
['Epitrochlear','Hold the elbow and feel above the medial epicondyle.'],
['Groins','Horizontal inguinal group and vertical femoral group.'],
['Popliteal','If indicated.'],
['Describe','Site, size, tender or not, hard or rubbery, discrete or matted, mobile or fixed.'],
['Drainage area','Examine the area drained by an abnormal node (scalp, mouth, breast, skin, genitalia).'],
['Organs','Liver, spleen, tonsils (tubercles), chest, breast, spine and sternum (tender in lymphoma). Mouth and throat for the primary.'],
['Finish','Say if lymphadenopathy is localised or generalised.']
],pl:['Hard, fixed, painless, matted nodes suggest malignancy.','A left supraclavicular node (Virchow) points to an abdominal primary.','Matted, firm nodes with a cold abscess or sinus: tuberculosis. Stony hard, nodular, fixed nodes: secondaries. Smooth rubbery nodes: lymphoma. Tender mobile nodes: infection.','FNAC first for a node; lymph node biopsy if lymphoma is suspected.']},

{id:'breast',n:'Breast examination (Bailey & Love)',s:'Examination',st:[
['History','Age (young women rarely have cancer), family history of breast or ovarian cancer (with ages), pregnancies and breastfeeding, relation of symptoms to menstruation, hormone drugs (pill, HRT), alcohol, obesity, implants or previous surgery.'],
['Prepare','Wash hands, introduce, full explanation and permission, privacy, chaperone, good light. Expose from the neck to the waist.'],
['Inspect sitting','Facing the patient at 45 degrees: size, shape (normally spherical) and symmetry across the nipple line. Extra breast or nipple, or absent breast. Then from the side: skin (mass, peau d’orange from lymphatic oedema, puckering from Cooper ligament invasion, ulcer, rash or shingles, scar, fistula, dilated veins, colour change), areola (scaling suggests eczema or Paget, Montgomery tubercles), nipple.'],
['Arms up and pectorals','Leaning forward: symmetry and restricted movement. Hands above the ears: symmetry, the fold under the breast, the axillae, nipple movement and dimpling. Pressing the hands on the waist contracts the pectorals and shows a hidden mass.'],
['Lie at 45 degrees','If the lump can only be felt in a certain position, examine her in that position too.'],
['Ask about pain','Ask which area is painful or tender before you palpate.'],
['Palpate','Use the palmar aspects of the fingers against the chest wall by quadrants or in a spiral, including behind the nipple, the axillary tail and the axilla. Normal breast first. Watch her face. Note consistency (firm in adults, soft in the elderly), temperature (hot: abscess or mastitis) and tenderness (mastitis, fibroadenosis, rarely cancer).'],
['Describe the lump','Site (quadrant), size, shape (globular or ugly), surface (smooth benign, irregular malignant), edge (well or ill defined), consistency (firm, hard, soft), and fixation. Benign tends to be mobile and smooth; malignant tends to be hard, irregular and fixed.'],
['Tethering or fixation','To skin: pinch the skin and move the lump (tethering). To breast tissue: hold the breast and move the lump. To muscle: hands pressed on the waist (pectoralis) or against a wall (serratus anterior). To chest wall: lump stays still with muscle relaxed. Tethered: skin puckers when the lump is moved outside its arc, but the lump is separate from the skin. Fixed: the lump cannot move without moving the skin.'],
['Nipple','Ask her to squeeze the nipple. Benign lesions push the nipple away; malignant ones pull it. Does an inverted nipple evert? One-sided and recent inversion is more significant. Discharge: one duct or many, colour (creamy normal, green-brown duct ectasia, bloody needs investigation).'],
['Axilla','Groups: anterior (pectoral), posterior (subscapular), lateral (humeral), central and apical. Hands above the ears or hold her arm. Support her arm at 45 degrees on your forearm so the muscles relax. Sweep the fingers from the apex of the axilla down against the chest wall. Then the anterior fold and axillary tail.'],
['Supraclavicular and arms','Feel the supraclavicular and infraclavicular fossae and neck. Check the arms for lymphoedema.'],
['Metastases','If locally advanced or indicated: chest percussion and auscultation, liver and ascites, rectal and pelvic examination, back and bone tenderness, and papilloedema or neurology for brain spread. Arm swelling can be from lymph node infiltration, axillary dissection or radiotherapy, DVT, cellulitis or a cannula.'],
['Finish','Cover her. Say you would arrange triple assessment: clinical examination, imaging (ultrasound or mammography) and biopsy.']
],pl:['Triple assessment is the basis for diagnosis of every breast lump.','The 7 Ds of nipple change: destruction, depression, discolouration, displacement, deviation, discharge, duplication.','Axillary nodes are palpable in about 10% of women with breast cancer.','Nipple discharge: bloody from one duct suggests papilloma or carcinoma; green or black from many ducts suggests duct ectasia; clear or straw suggests fibrocystic change; pus is infection; milk is lactation.','Mondor disease is thrombophlebitis of a superficial breast or chest wall vein.']},

{id:'pvd',n:'Peripheral arterial examination (legs)',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose both legs to the groin, lie flat, warm room.'],
['Inspect','Colour (pallor, rubor), hair loss, shiny skin, ulcers (location: toes, heels, pressure points), gangrene, scars, muscle wasting.'],
['Temperature','Compare both legs with the back of your hand from the thigh to the foot.'],
['Capillary refill','Press the toe pulp for 5 seconds: normal under 2 seconds.'],
['Palpate pulses','Femoral (mid-inguinal point), popliteal, posterior tibial (behind the medial malleolus), dorsalis pedis. Compare both sides. Check for aneurysm at the femoral and popliteal.'],
['Abdomen','Palpate the aorta for an aneurysm.'],
['Auscultate','Femoral and iliac bruits.'],
['Buerger test','Raise the leg to 45 degrees for 1 to 2 minutes (pallor), then sit it over the edge of the bed (reactive hyperaemia).'],
['Sensation and power','Test sensation and power if neuropathy or ischaemia is suspected.'],
['Finish','Say you would check the ABPI, blood pressure in both arms, the heart (AF), and examine the other leg and the diabetic foot.']
],pl:['The 6 Ps of acute limb ischaemia: pain, pallor, pulselessness, paraesthesia, paralysis, perishing cold.','Ulcers: arterial ones are painful, on the toes or heels, with a punched-out look.']},

{id:'varic',n:'Varicose veins',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose both legs fully, examine standing.'],
['Inspect standing','Dilated veins along the great and small saphenous territories, swelling, skin changes (eczema, pigmentation, lipodermatosclerosis), ulcers, scars.'],
['Palpate','Warmth, tenderness, hard cords (thrombophlebitis), oedema, saphenofemoral junction cough impulse.'],
['Tap test','Tap the lower vein and feel the impulse at the knee or the groin.'],
['Trendelenburg','Lay the patient flat, raise the leg to empty the veins, compress the saphenofemoral junction, then stand. Slow filling with the pressure on: incompetence at the junction.'],
['Perforators','Repeat with a tourniquet at different levels to localise incompetent perforators.'],
['Auscultate','Listen for a bruit over any varicosity (arteriovenous malformation).'],
['Pulses','Palpate the arterial pulses and check for arterial insufficiency before any compression.'],
['Abdomen and pelvis','Abdominal masses (venous obstruction).'],
['Finish','Say you would do duplex ultrasound.']
],pl:['Check arterial supply before advising compression stockings.','A venous ulcer is usually over the gaiter area, shallow and with sloping edges.']},

{id:'cvs',n:'Cardiovascular examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose the chest, position at 45 degrees, chaperone for female patients.'],
['General','Comfort at rest, breathlessness, colour, cyanosis, oedema, scars (midline sternotomy, thoracotomy), pacemaker bulge.'],
['Hands','Clubbing, splinter haemorrhages, Osler nodes, Janeway lesions, xanthomata, capillary refill.'],
['Pulse','Radial: rate, rhythm (regular, irregular, irregularly irregular), then character. Radio-radial and radio-femoral delay.'],
['Blood pressure','Measure in both arms if indicated. Check for a postural drop when relevant.'],
['Face','Conjunctival pallor, jaundice, xanthelasma, corneal arcus, malar flush, high-arched palate, dental hygiene.'],
['Neck: carotid','Carotid pulse character, one side at a time. Never both at the same time.'],
['Neck: JVP','Lie at 45 degrees, head turned slightly left. Look for the double waveform above the clavicle. Measure the height above the sternal angle (normal under 4 cm). Hepatojugular reflux if indicated.'],
['Inspect the chest','Scars, visible apex, pulsations, deformity, pectus.'],
['Palpate','Apex beat: position and character (heave, displaced). Then the left sternal edge for heaves and palpable thrills at each valve area.'],
['Auscultate','Listen with the diaphragm at all four areas (mitral, tricuspid, pulmonary, aortic), then the bell for mitral stenosis. Feel the carotid pulse while listening.'],
['Dynamic manoeuvres','Roll the patient to the left side and listen at the apex in expiration (mitral stenosis). Sit forward and listen at the left sternal edge in held expiration (aortic regurgitation).'],
['Carotids and back','Listen for carotid bruits and radiation of aortic murmurs. Auscultate lung bases for crackles.'],
['Finish','Check for sacral and ankle oedema, palpate for hepatomegaly. Say you would check peripheral pulses, blood pressure, temperature, urine dip and do an ECG.']
],pl:['Say "irregularly irregular" for AF.','Time the murmur against the carotid pulse.','State the apex beat position in the intercostal space and its relation to the mid-clavicular line.']},

{id:'resp',n:'Respiratory examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose the chest to the waist, position at 45 degrees.'],
['General','Breathlessness at rest, use of accessory muscles, cough, wheeze, stridor, sputum pot, oxygen and inhalers.'],
['Hands','Clubbing, tar staining, cyanosis, wasting of small hand muscles, flapping tremor (CO2 retention), pulse.'],
['Face','Conjunctival pallor, Horner syndrome, central cyanosis, lip pursing.'],
['Neck','Tracheal position (sternal notch), JVP, cervical lymph nodes.'],
['Inspect the chest','Shape (barrel chest, pectus), scars, radiotherapy marks, asymmetry, respiratory rate and pattern.'],
['Palpate','Chest expansion (upper and lower, thumbs 5 cm apart, 3 cm is normal), apex beat, tactile or vocal fremitus.'],
['Percuss','Compare both sides at the apices, upper, mid and lower zones, front, back and axillae. Resonant, dull (stony dull) or hyper-resonant.'],
['Auscultate','Breath sounds and added sounds (crackles, wheeze, rub), then vocal resonance (99) in the same sites.'],
['Back','Sit forward. Inspect, palpate expansion, percuss, auscultate from the top to the bases, and look for sacral oedema.'],
['Finish','Check peripheral oedema and calves for DVT. Say you would do peak flow, sputum, CXR and oxygen saturations.']
],pl:['Compare left with right at every level.','Stony dullness suggests effusion; reduced expansion on the same side supports it.','Check the trachea before you decide which side is abnormal.']},

{id:'cn',n:'Cranial nerve examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, sit the patient facing you.'],
['I Olfactory','Ask about change in smell. Test each nostril separately if indicated.'],
['II Optic','Acuity (Snellen), colour (Ishihara), visual fields by confrontation, pupillary light reflexes (direct and consensual), swinging torch, fundoscopy.'],
['III IV VI','Pupil size, ptosis, eye movements in an H pattern, ask about double vision, nystagmus.'],
['V Trigeminal','Sensation in V1, V2, V3 on both sides, corneal reflex if indicated, jaw opening and clench (power of masseters).'],
['VII Facial','Raise eyebrows, close eyes tightly, show teeth, puff cheeks. Forehead sparing indicates an upper motor neuron lesion.'],
['VIII Vestibulocochlear','Whisper test, Rinne and Weber tests.'],
['IX X Glossopharyngeal, vagus','Say "ahh" and watch the uvula and palate, gag reflex if indicated, cough, voice quality.'],
['XI Accessory','Shrug the shoulders and turn the head against resistance.'],
['XII Hypoglossal','Tongue at rest (fasciculations), protrusion (deviates to the side of the lesion), movement.'],
['Finish','Say you would examine the limbs, gait and fundi, and arrange imaging if needed.']
],pl:['Rinne and Weber: conductive deafness has a negative Rinne, and Weber lateralises to the deaf ear.','The tongue deviates towards the weak side.']},

{id:'ul',n:'Upper limb neurological examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose arms, sit the patient up.'],
['Inspect','Wasting, fasciculations, abnormal movements, posture, scars.'],
['Tone','Elbow and wrist: move gently and feel for spasticity (clasp-knife), rigidity (lead-pipe, cogwheel) or reduced tone.'],
['Power','Shoulder abduction (C5), elbow flexion (C5/6), extension (C7), wrist extension (C6/7), finger flexion (C8), finger abduction (T1). MRC grade 0 to 5.'],
['Reflexes','Biceps (C5/6), supinator (C6), triceps (C7). Use reinforcement if absent.'],
['Coordination','Finger-to-nose (intention tremor), rapid alternating movements (dysdiadochokinesia).'],
['Sensation','Light touch, pinprick, then vibration and joint position sense. Test dermatomes, comparing sides.'],
['Special tests','Pronator drift (eyes closed, arms out), Tinel and Phalen (carpal tunnel).'],
['Finish','Say you would examine the lower limbs, cranial nerves and gait.']
],pl:['Upper motor neuron signs: increased tone, brisk reflexes, upgoing plantar (Babinski).','Lower motor neuron signs: wasting, fasciculations, reduced tone and reflexes.']},

{id:'ll',n:'Lower limb neurological examination and gait',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose both legs fully, lie flat.'],
['Gait','Watch the patient walk, turn and walk heel-to-toe. Ask to walk on tiptoes, on heels. Romberg test.'],
['Inspect','Wasting, fasciculations, deformities, scars.'],
['Tone','Roll the leg and flick the knee. Test for ankle clonus (5 beats or more is abnormal).'],
['Power','Hip flexion (L2), extension (L5/S1), knee extension (L3/4), flexion (L5/S1), ankle dorsiflexion (L4/5), plantar flexion (S1/2), great toe extension (L5).'],
['Reflexes','Knee (L3/4), ankle (S1/2), plantar response (Babinski).'],
['Coordination','Heel-shin test.'],
['Sensation','Light touch, pinprick, vibration (at the great toe, then upwards) and joint position sense. Dermatomes L2 to S1.'],
['Spine and nerve root','Straight leg raise, palpate the spine, check anal tone if cauda equina is suspected.'],
['Finish','Say you would test the saddle area and bladder function when relevant.']
],pl:['Cauda equina: saddle anaesthesia, bladder or bowel dysfunction, and bilateral leg weakness. This is an emergency.','Foot drop: L4/5, common peroneal nerve at the fibular neck.']},

{id:'gals',n:'Joints: GALS screen',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose to underwear, patient standing.'],
['Screening questions','Any pain or stiffness in the muscles, joints or back? Any difficulty getting dressed or climbing stairs?'],
['Gait','Walk to the end, turn and return. Look at symmetry, smoothness, stride length, turning ease.'],
['Arms','Inspect the hands and forearms (palms up and down), squeeze the metacarpals (tenderness), make a fist, pinch grip, put hands behind the head, check elbows.'],
['Legs','Inspect standing, then lying down: knee effusion (patellar tap, bulge test), hip movement (flexion, internal rotation), knee flexion and crepitus.'],
['Spine','From behind: scoliosis, muscle bulk, symmetry. Lateral flexion, Schober test for lumbar flexion, neck movements.'],
['Feet','Inspect the soles, arches, toes, and squeeze the metatarsals.'],
['Look, feel, move','For any abnormal joint: look (swelling, deformity, redness), feel (warmth, tenderness, effusion), move (active, passive, crepitus), then special tests and function.'],
['Finish','Say you would examine other joints, skin and nails, eyes, and ask about morning stiffness.']
],pl:['Inflammatory pain: morning stiffness more than 30 minutes that improves with activity.','Always examine the joint above and below.']},

{id:'pr',n:'Rectal examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, explain clearly why it is needed, get explicit consent, chaperone, privacy.'],
['Position','Left lateral, knees drawn up to the chest, buttocks at the edge of the bed.'],
['Inspect','Skin tags, fissure, fistula openings, external haemorrhoids, prolapse, rash, perianal soiling, scars.'],
['Gloves and lubricant','Put on gloves and apply lubricant. Tell the patient what you are about to do.'],
['Insert','Place the pad of the index finger on the anus and press gently. Wait for the sphincter to relax and ask the patient to breathe out.'],
['Sphincter tone','Resting tone and squeeze tone.'],
['Palpate the rectum','Walls all around for masses, tenderness, polyps. Anteriorly: the prostate in men (size, surface, median sulcus, nodules, tenderness) or the cervix in women.'],
['Finish','Withdraw, look at the glove for blood, mucus, pus, stool colour (melaena). Offer tissue, cover the patient.'],
['Document','State the findings and say if the examination was normal.']
],pl:['Prostate: smooth, rubbery and symmetric is normal; hard, nodular and loss of the median sulcus suggests cancer.','A very tender rectal examination suggests infection or fissure.']},

{id:'scr',n:'Scrotal examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, chaperone, expose from the waist to the knees, in a warm room. Examine standing, then lying.'],
['Inspect','Size, symmetry, colour, skin changes, scars, swelling, the position of the testes (high riding or horizontal).'],
['Palpate each testis','Use both hands. Size, consistency, tenderness, nodules. Compare both sides.'],
['Epididymis','Behind the testis: swelling, tenderness, cysts.'],
['Spermatic cord','Feel from the testis up to the external ring. Look for varicocele (bag of worms, increases on standing or Valsalva).'],
['Get above it','Can you get above the swelling? If not, it is an inguinoscrotal hernia.'],
['Transilluminate','Torch behind the swelling. Hydrocele and epididymal cyst light up; solid swellings do not.'],
['Cremasteric reflex','Stroke the inner thigh: the testis rises on the same side. Absent in torsion.'],
['Groins and abdomen','Examine hernial orifices, inguinal nodes, and the abdomen for masses.'],
['Finish','Say you would send urine for dip and microscopy, and arrange a scrotal ultrasound.']
],pl:['Sudden severe testicular pain in a young man is torsion until proven otherwise. Surgical emergency, within 6 hours.','A hard painless testicular lump is cancer until proven otherwise.']},

{id:'foot',n:'Diabetic foot and ulcer',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose both legs below the knees, sitting or lying.'],
['Inspect','Skin colour, callus, deformity (Charcot, claw toes, hallux valgus), nails, interdigital spaces, ulcers, gangrene, previous amputations. Look inside the shoes.'],
['Ulcer description','Site, size, shape, edge (sloping, punched-out, rolled), base (slough, granulation, bone), depth, discharge, surrounding skin, tenderness.'],
['Temperature and oedema','Compare both feet. Warmth suggests infection or Charcot foot.'],
['Pulses','Dorsalis pedis, posterior tibial, popliteal, femoral. Capillary refill.'],
['Neuropathy','10 g monofilament at standard sites, vibration with a 128 Hz tuning fork, ankle reflexes, pinprick.'],
['Infection','Look for cellulitis, abscess, probing to bone, and lymphangitis.'],
['Nodes','Check the popliteal and inguinal nodes.'],
['Finish','Say you would check glucose, HbA1c, an ABPI and X-ray for osteomyelitis, and refer to the diabetic foot team.']
],pl:['Neuropathic ulcers are painless, on pressure points, with warm foot.','Ischaemic ulcers are painful, at the toes or heels, with cold pale foot.']},

{id:'postop',n:'Post-operative examination',s:'Examination',st:[
['Begin','Greet, introduce, explain, consent, privacy, chaperone, good light, position and expose the patient.'],
['General appearance','Conscious, alert, oriented, comfortable or in pain, body build.'],
['Vital signs','Temperature, pulse, respiratory rate, blood pressure, oxygen saturation, urine output and bowel sounds. Fever is above 37.2 C after surgery; tachycardia suggests fever, infection, dehydration, pain or anxiety.'],
['General exam: eyes, mouth, hands','Eyes for pallor and jaundice, mouth for dryness and cyanosis, hands for pallor.'],
['Chest','Air entry, type of breathing, added sounds, basal crepitations.'],
['Abdomen','Inspect: symmetry, distension, dressing, movement with breathing. Palpate: soft or not, tender or not. Auscultate bowel sounds. Percuss.'],
['Lower limbs','Signs of DVT (calf tenderness, swelling), pitting oedema.'],
['Cannulas','Number, colour, site, and local complications (infiltration, thrombophlebitis).'],
['Urethral catheter','Bag: colour of the contents, amount, and the duration of collection.'],
['Surgical drains','Number, site, type, name, tube patency, bag amount and colour (and over what time), drain incision (discharge, erythema, herniation). Ask whether the patient has a drain, as it may be hidden.'],
['Site of operation','Name the wound and its length. Dressing clean or yellowish or bloody? Ask the examiner to remove the dressing.'],
['Inspect the wound','Edges approximated by sutures or staples, or gaping (dehiscence). Floor: epithelial, granulation, slough, abdominal cavity. Discharge and colour. Suture type and technique. Swelling (infection, haematoma, seroma), erythema.'],
['Palpate','Wearing gloves and after asking about pain: wound edge tenderness, induration, surrounding skin tenderness.'],
['After thyroidectomy','Voice change (hoarseness or stridor). Hypocalcaemia: perioral numbness, digital tingling, carpopedal spasm, Chvostek sign, Trousseau sign, hyperreflexia, tetany, seizure.'],
['Finish','Cover the patient, thank them, and summarise the findings and your impression.']
],pl:['Fever by day: wind (day 1 to 2, chest), water (day 3, urine), walking (day 5 to 6, DVT or PE), wound (day 7), wonder drugs (any day).','Primary haemorrhage is during the operation, reactionary within 24 hours, secondary at 7 to 10 days (usually infection).']},

{id:'drains',n:'Surgical drains',s:'Examination',st:[
['Why the drain is there','Therapeutic, diagnostic, prophylactic, monitoring or palliative. Ask whether the patient has a drain, as it may be hidden.'],
['Number and site','How many drains, and where each one comes out.'],
['Type','Open (Penrose, corrugated, Yeates, wick) or closed. Closed drains are passive (Robinson, urethral catheter, chest tube, T-tube) or active with suction (Jackson-Pratt, Redivac).'],
['Name','Name the drain and the cavity it drains.'],
['Drain tube','Patent, not kinked or blocked by clots, secured well, and lower than the incision.'],
['Drain bag or reservoir','Amount and colour of the fluid, and the time it was collected over. Active drains must be activated and the container emptied daily.'],
['Exit site','Discharge, erythema, skin excoriation, herniation, leakage around the tube.'],
['Wound','Examine the main wound as well.'],
['Is it ready to come out?','Output usually under 30 to 50 mL in 24 hours, falling, and serous or serosanguinous. No fever, sepsis, peritonitis, infection or collection. Do not remove if purulent, bilious, faecal, chylous or bloody until the cause is controlled.'],
['Typical timing','Thyroidectomy over 24 hours, colorectal anastomosis 5 to 7 days, T-tube in the CBD 10 to 14 days. Not a rule.'],
['Complications','Pain, irritation, bleeding, injury to adjacent organ, occlusion, leak, displacement, infection, fluid and electrolyte loss, pressure necrosis, fistula, hernia.']
],pl:['A drain should take the shortest safe route to the deepest, most dependent part and come out through a separate stab wound.','Drains older than 7 to 10 days raise the risk of infection, pain and fistula.']},

{id:'pres',n:'Presenting a case',s:'General',st:[
['Opening line','Age, sex, relevant occupation or background, presenting complaint and duration. "This is a 55-year-old man presenting with 6 hours of central chest pain."'],
['HPC','Onset, character, severity, associated symptoms, relevant positives and negatives, previous episodes.'],

function parse(raw){
  var P=[],cur=null,sec=null,grp=null,gk='',gNew=false,gMn=null;
  raw.split('\n').forEach(function(line){
    line=line.replace(/\s+$/,'');
    if(!line)return;
    var c=line.charAt(0);
    if(c==='@'){var a=line.slice(1).split('|');cur={id:a[0],name:a[1],sys:a[2],g:a[3],sc:[],inv:'',dd:[],sections:[],n:{H:0,E:0},pain:false,cz:[],route:''};P.push(cur);sec=null;grp=null;gk='';gMn=null;return}
    if(!cur)return;
    if(line.slice(0,2)==='SC'&&(line.length===2||line.charAt(2)===' ')){cur.sc=line.slice(2).trim().split(',').filter(Boolean);return}
    if(line.slice(0,2)==='I '){cur.inv=line.slice(2).trim();return}
    if(line.slice(0,2)==='D '){var d=line.slice(2).split('|');cur.dd.push({k:d[0],name:d[1],mnm:d[2]==='!',prior:parseFloat(d[3])||1});return}
    if(line==='G'||line.slice(0,2)==='G '){grp=line.slice(2).trim()||null;gNew=true;gMn=null;return}
    /* Y name|dd keys|section titles: one cause group for the "Causes to cover" card */
    if(line.slice(0,2)==='Y '){var y=line.slice(2).split('|');cur.cz.push({n:y[0].trim(),dd:(y[1]||'').split(',').map(function(x){return x.trim()}).filter(Boolean),secs:(y[2]||'').split(',').map(function(x){return x.trim()}).filter(Boolean)});return}
    /* M title|expansion: a memory aid; after G it heads the group, after H/E it heads that section */
    if(line.slice(0,2)==='M '){var mm=line.slice(2).split('|'),mo={t:mm[0].trim(),x:(mm[1]||'').trim()};if(gNew||!sec)gMn=mo;else sec.mn=mo;return}
    if(line.slice(0,2)==='R '){cur.route=line.slice(2).trim();return}
    if(line.slice(0,2)==='N '&&sec){sec.note=(sec.note?sec.note+' ':'')+line.slice(2).trim();return}
    if(line==='H'||line==='E'||line.slice(0,2)==='H '||line.slice(0,2)==='E '){
      if(gk&&gk!==c&&!gNew)grp=null;gk=c;gNew=false;
      var hd=line.slice(2).split('|');
      sec={kind:c,title:hd[0].trim()||(c==='H'?'History':'Examination'),mode:(hd[1]||'yn').trim(),pre:(hd[2]||'').trim(),g:grp,note:'',items:[],ix:cur.sections.length};
      if(gMn){sec.gmn=gMn;gMn=null}
      if(c==='H'&&grp&&/^pain/i.test(grp))cur.pain=true;
      cur.sections.push(sec);return}
    if((c==='-'||c==='!'||c==='*')&&sec){
      var t=line.slice(2).trim(),w={},xk=null;
      var mx=t.match(/\s+@(x?\d+)\s*$/);if(mx){xk=mx[1];t=t.slice(0,mx.index)}
      var m=t.match(/\s*\{([^}]*)\}\s*$/);
      if(m){t=t.slice(0,m.index).trim();m[1].split(',').forEach(function(p){var kv=p.split(':');if(kv.length===2)w[kv[0].trim()]=parseFloat(kv[1])})}
      var full=sec.pre?sec.pre+' '+lcFirst(t):t;
      sec.items.push({k:xk?sec.kind+xk:sec.kind+(cur.n[sec.kind]++),t:full,c:t,flag:c==='!',hy:c==='*',w:w});
      if(c==='*'){cur.hyMarked=cur.hyMarked||{};cur.hyMarked[sec.kind]=true}
    }
  });
  return P;
}

function demoAdj(pid,d,pt){

  if(r.sx&&r.sx[sex]!=null)out.m*=r.sx[sex];
  if(r.sm&&r.sm[sex]!=null)out.sm=r.sm[sex];
  if(r.fy&&sex==='F'&&isFinite(age)&&age<50)out.m*=r.fy;
  if(r.a&&isFinite(age)&&age>=0){var b=typeof r.a==='string'?AGEP[r.a]:r.a;for(var i=0;i<b.length;i++){if(age<=b[i][0]){out.m*=b[i][1];break}}}

  ROS.forEach(function(sys){
    var pos=[],neg=[];sys.i.forEach(function(t,i){var st=rosState(e,sys.k,i);if(st===1)pos.push(t.toLowerCase());else if(st===-1)neg.push(t.toLowerCase())});
    if(!pos.length&&!neg.length)return;
    if(!pos.length)out.push(sys.n+': negative');else out.push(sys.n+': '+pos.join(', ')+(neg.length?' (denies '+neg.join(', ')+')':''));
  });
  return out.join('. ');
}
function rosPres(e){
  var pos=[],asked=0;
  ROS.forEach(function(sys){sys.i.forEach(function(t,i){var st=rosState(e,sys.k,i);if(st)asked++;if(st===1)pos.push(t.toLowerCase()+' ('+sys.n.toLowerCase()+')')})});
  if(!asked)return '';
  return pos.length?'Systems review is positive for '+pos.join(', ')+', and otherwise negative.':'Systems review is negative.';
}

/* ================= vitals ================= */
function news2(v){
  var rr=num(v.rr),sp=num(v.spo2),sb=num(v.sbp),hr=num(v.hr),t=num(v.temp),parts={},tot=0,miss=[];
  function add(k,val){parts[k]=val;tot+=val}
  if(rr==null)miss.push('RR');else add('RR',rr<=8?3:rr<=11?1:rr<=20?0:rr<=24?2:3);
  if(sp==null)miss.push('SpO2');else add('SpO2',sp<=91?3:sp<=93?2:sp<=95?1:0);
  add('O2',v.o2?2:0);
  if(sb==null)miss.push('SBP');else add('SBP',sb<=90?3:sb<=100?2:sb<=110?1:sb<=219?0:3);
  if(hr==null)miss.push('HR');else add('HR',hr<=40?3:hr<=50?1:hr<=90?0:hr<=110?1:hr<=130?2:3);
  add('Consciousness',(v.avpu&&v.avpu!=='A')?3:0);
  if(t==null)miss.push('Temp');else add('Temp',t<=35?3:t<=36?1:t<=38?0:t<=39?1:2);
  var any3=false;for(var k in parts)if(parts[k]===3)any3=true;
  var txt=tot>=7?'High (7 or more): emergency response, critical care review.':tot>=5?'Medium (5 to 6): urgent response by a clinician skilled in acute illness.':any3?'Low to medium: a single red score of 3 needs urgent ward-based review.':tot>=1?'Low (1 to 4): ward-based response, at least 4-6 hourly observations.':'Low (0): routine monitoring.';
  return {tot:tot,parts:parts,miss:miss,txt:txt,any:Object.keys(v).some(function(k){return v[k]!==''&&v[k]!=null&&v[k]!==false&&k!=='ht'&&k!=='wt'&&k!=='dbp'})};
}
function vitFlags(v){
  var f=[],hr=num(v.hr),sb=num(v.sbp),db=num(v.dbp),rr=num(v.rr),sp=num(v.spo2),t=num(v.temp);
  if(hr!=null)f.push(hr>100?'Tachycardia':hr<60?'Bradycardia':'');
  if(sb!=null&&sb<90)f.push('Hypotension');
  if(sb!=null&&sb>=180)f.push('Severe hypertension');
  if(rr!=null&&rr>20)f.push('Tachypnoea');
  if(sp!=null&&sp<94)f.push('Low SpO2');
  if(t!=null)f.push(t>=38?'Fever':t<=35?'Hypothermia':'');
  if(hr!=null&&sb)f.push(hr/sb>=0.9?'Shock index '+(hr/sb).toFixed(2)+' (raised)':'');
  return f.filter(Boolean);
}
function vitLine(v){
  var a=[];
  if(num(v.hr)!=null)a.push('HR '+v.hr);
  if(num(v.sbp)!=null)a.push('BP '+v.sbp+'/'+(num(v.dbp)!=null?v.dbp:'?'));
  if(num(v.rr)!=null)a.push('RR '+v.rr);
  if(num(v.spo2)!=null)a.push('SpO2 '+v.spo2+'% '+(v.o2?'on oxygen':'on air'));
  if(num(v.temp)!=null)a.push('Temp '+v.temp+' C');
  if(v.avpu&&v.avpu!=='A')a.push('ACVPU: '+v.avpu);
  var b=bmi(v);if(b)a.push('BMI '+b);
  return a.join(' | ');
}
function bmi(v){var w=num(v.wt),h=num(v.ht);if(w&&h){var m=h/100;return (w/(m*m)).toFixed(1)}return ''}

/* ================= scores ================= */
function scoreTotal(s,st){var tot=0;st=st||{};s.items.forEach(function(it,i){var idx=st[i]||0;var o=it[1][idx]||it[1][0];tot+=o[1]});return tot}
function scoreInterp(s,tot){var out='';s.interp.forEach(function(r){if(tot>=r[0])out=r[1]});return out}
function scoreResults(e){
  var out=[];SCORES.forEach(function(s){
    if(s.special){var n=news2(e.v||{});if(n.any&&!n.miss.length)out.push('NEWS2 '+n.tot+' - '+n.txt);return}
    var st=e.sc[s.id];if(!st||!st.t)return;var tot=scoreTotal(s,st.v);out.push(s.name.replace(/ \(.*\)/,'')+' '+tot+' - '+scoreInterp(s,tot))});
  return out;
}

/* ================= note generation ================= */
function lc(s){return s}
function collect(e){
  var P=getP(e.pid),o={hp:[],hn:[],ep:[],en:[]},ot=e.ot||{};
  P.sections.forEach(function(sec){
    var pos=[],neg=[],chip=sec.mode!=='yn';
    sec.items.forEach(function(it){
      var st=e.f[fkey(P,it)];if(!st)return;
      if(st===1)pos.push(chip?lcFirst(it.c):it.t);else if(sec.mode!=='one')neg.push(chip?lcFirst(it.c):it.t)});
    var oth=(ot[P.id+'_'+sec.kind+sec.ix]||'').trim();if(oth)pos.push(oth);
    var H=sec.kind==='H',lab=sec.pre?sec.pre.replace(/:$/,''):sec.title;
    if(chip){
      if(pos.length)(H?o.hp:o.ep).push(lab+': '+pos.join(', '));
      if(neg.length)(H?o.hn:o.en).push(lab+': '+(H?'no ':'')+neg.join(', '));
    }else{pos.forEach(function(t){(H?o.hp:o.ep).push(t)});neg.forEach(function(t){(H?o.hn:o.en).push(t)})}
  });
  return o;
}
function paText(e){
  var a=e.pa;if(!a||!a.on)return '';var o=[];
  PAIN_DIMS.forEach(function(d){var v=a[d[0]];if(Array.isArray(v)?v.length:v)o.push(d[1].toLowerCase()+' '+(Array.isArray(v)?v.join(', ').toLowerCase():String(v).toLowerCase()))});
  if(a.oth)o.push(a.oth);
  return o.length?'Pain: '+o.join('; '):'';
}
function ptWho(e){var a=e.pt.age,s=e.pt.sex;var sx=s==='M'?'man':s==='F'?'woman':'patient';return (a?a+'-year-old ':'')+sx}
function topDx(e,n){var d=ddxScores(e);return d.res.slice(0,n).map(function(r){return r.d.name})}
function mnmStatus(e){var P=getP(e.pid);return P.dd.filter(function(d){return d.mnm&&ddOK(e,d)}).map(function(d){return {d:d,ex:!!e.x[d.k]}})}
/* Iraqi-style case sheet: patient data, complaint, HPI, review of systems, past/drug/family/social,
   general and systemic examination, investigations, diagnosis, management. Blocks feed both the text and the PDF. */
function sheetBlocks(e){
  var P=getP(e.pid),c=collect(e),B=[],tx=bgTx(e),v=e.v||{},ds=ddxScores(e),hid=DB.hideDdx;
  function H(t){B.push({k:'h',text:t})}
  function F(l,t){B.push({k:'p',label:l,text:t||'Not recorded.'})}
  function L(l,arr){if(!arr.length)return;B.push({k:'sub',text:l});arr.forEach(function(t){B.push({k:'b',text:t})})}
  H('Patient data');
  B.push({k:'kv',rows:[['Name / ID',e.pt.ref||''],['Age / sex',(e.pt.age?e.pt.age+' years':'')+(e.pt.sex?(e.pt.age?', ':'')+(e.pt.sex==='M'?'male':e.pt.sex==='F'?'female':e.pt.sex):'')],['Occupation',e.pt.occ],['Marital status',e.pt.mar],['Residence',e.pt.res],['Ward / bed',e.pt.loc],['Date of admission',e.pt.adm||dstr(e.t0)],['Date of history',e.pt.hdt||dstr(e.t0)],['Mode of referral',e.pt.mref],['Mode of arrival',e.pt.marr]]});
  H('Chief complaint');
  F('Complaint',(e.cc||(P.id==='other'?'':P.name))+(e.dur?', for '+e.dur:''));
  H('History of present illness');
  var so=socText(e);if(so)B.push({k:'p',text:so+'.'});var pt=paText(e);if(pt)B.push({k:'p',text:pt+'.'});
  gxLines(e).forEach(function(t){B.push({k:'b',text:t})});
  if(tx.hpc)B.push({k:'p',text:tx.hpc});
  L('Positive points',c.hp);L('Pertinent negatives',c.hn);
  if(!tx.hpc&&!so&&!gxLines(e).length&&!c.hp.length&&!c.hn.length)B.push({k:'p',text:'Not recorded.'});
  var rf=redFlags(e);if(rf.length)B.push({k:'flag',label:'Red flags present:',text:rf.map(function(i){return i.t}).join('; ')});
  H('Review of systems');
  var rs=rosSummary(e);B.push({k:'p',text:(rs||'Not recorded.')+(tx.ros?' Other: '+tx.ros:'')});
  H('Background history');
  F('Past medical',tx.pmh);F('Past surgical',tx.psh);F('Family history',tx.fh);F('Personal and social',tx.sh);F('Occupational',tx.occ);F('Drugs',tx.dh);F('Allergies',tx.all);
  H('Examination');
  var vl=vitLine(v);F('Vital signs',vl);
  var n=news2(v);if(n.any&&!n.miss.length)F('NEWS2',String(n.tot));
  L('Abnormal findings',c.ep);L('Normal or absent',c.en);
  if(tx.exn)F('Other findings',tx.exn);
  if(!c.ep.length&&!c.en.length&&!tx.exn)B.push({k:'p',text:'Systemic and local examination: not recorded.'});
  var sr=scoreResults(e);if(sr.length)L('Scores',sr);
  H('Assessment');
  F('Provisional diagnosis',tx.dx||(!hid&&ds.nF?ds.res[0].d.name+' (suggested by findings)':'Not yet formulated'));
  if(!hid&&ds.nF)F('Differential diagnosis',ds.res.slice(0,4).map(function(r,i){return (i+1)+'. '+r.d.name}).join('; '));
  var mm=hid?[]:mnmStatus(e);if(mm.length)F('Must not miss',mm.map(function(x){return x.d.name+(x.ex?' (excluded)':' (not yet excluded)')}).join('; '));
  H('Investigations and plan');
  F('Suggested investigations',P.inv);
  F('Plan',tx.plan||'Not recorded.');
  return B;
}
function buildSheet(e){
  var P=getP(e.pid),L=['CASE SHEET - '+P.name.toUpperCase()];
  sheetBlocks(e).forEach(function(b){
    if(b.k==='h'){L.push('');L.push(b.text.toUpperCase())}
    else if(b.k==='b')L.push('  - '+b.text);
    else if(b.k==='sub')L.push(b.text+':');
    else if(b.k==='kv')b.rows.forEach(function(r){L.push(r[0]+': '+(r[1]||'-'))});
    else if(b.k==='note')L.push(b.text);
    else L.push((b.label?b.label.replace(/:?$/,':')+' ':'')+b.text);
  });
  L.push('');L.push(COMP_LINE);
  return L.join('\n');
}
var COMP_LINE='Companion tool only. Do not rely on it: check everything against your textbooks, the handbook and your supervisor.';
function sentence(arr){return arr.join('; ')}
function cap(arr,n){return arr.length>n?arr.slice(0,n).join('; ')+' and '+(arr.length-n)+' more':arr.join('; ')}
function lowerFirst(s){return s.charAt(0).toLowerCase()+s.slice(1)}
/* Ward-round case presentation, in the order a consultant expects: one-liner, HPI, background, examination,
   impression, plan. Capped so that it fits about one minute of speech (about 150 words). */
function presParts(e){
  var P=getP(e.pid),c=collect(e),tx=bgTx(e),v=e.v||{},ds=ddxScores(e),hid=DB.hideDdx,S=[];
  var cc=e.cc?lowerFirst(e.cc):(P.id==='other'?'an unspecified complaint':P.name.toLowerCase());
  var pm=[tx.pmh,tx.psh?'previous surgery: '+tx.psh:''].filter(Boolean).join('; ');var pmh=pm?(' with a background of '+pm.replace(/\.$/,'')):'';
  S.push(['Opening','This is '+(e.pt.ref?e.pt.ref+', a ':'a ')+ptWho(e)+pmh+', presenting with '+cc+(e.dur?' for '+e.dur:'')+'.']);
  var h=[];
  if(socText(e))h.push(socText(e)+'.');
  if(paText(e))h.push(paText(e)+'.');
  if(tx.hpc)h.push(tx.hpc.replace(/\s+$/,'').replace(/\.?$/,'.'));
  if(c.hp.length)h.push(cap(c.hp,6)+'.');
  if(c.hn.length)h.push('Negatives: '+cap(c.hn,4)+'.');
  var rp=rosPres(e);if(rp)h.push(rp);
  if(h.length)S.push(['History',h.join(' ')]);
  var bg=[];if(tx.dh)bg.push('on '+tx.dh);if(tx.all)bg.push('allergic to '+tx.all);if(tx.sh)bg.push(tx.sh);if(tx.occ)bg.push('works as/exposure: '+tx.occ);if(tx.fh)bg.push('family history of '+tx.fh);
  if(bg.length)S.push(['Background',bg.join('; ').replace(/\.$/,'')+'.']);
  var x=[],vl=vitLine(v);if(vl)x.push('Vitals: '+vl+'.');
  if(c.ep.length)x.push('Positive findings: '+cap(c.ep,6)+'.');
  if(c.en.length)x.push('Pertinent negatives: '+cap(c.en,3)+'.');
  if(x.length)S.push(['Examination',x.join(' ')]);
  var lead=tx.dx||(!hid&&ds.nF?ds.res[0].d.name:'');
  var im=[];
  if(lead)im.push('My impression is '+lead+'.');
  var alts=(!hid&&ds.nF)?ds.res.slice(lead===(ds.res[0]&&ds.res[0].d.name)?1:0,4).map(function(r){return r.d.name}).slice(0,3):[];
  if(alts.length)im.push('Differentials include '+alts.join(', ')+'.');
  var mm=hid?[]:mnmStatus(e).filter(function(m){return !m.ex&&m.d.name!==lead&&alts.indexOf(m.d.name)<0}).map(function(m){return m.d.name});
  if(mm.length)im.push('I would exclude '+mm.slice(0,3).join(', ')+'.');
  if(im.length)S.push(['Impression',im.join(' ')]);
  S.push(['Plan',tx.plan?tx.plan.replace(/\.?$/,'.'):'I would investigate with '+P.inv.split(';').slice(0,4).map(function(s){return s.trim()}).join(', ')+'.']);
  return S;
}
function buildPres(e){return presParts(e).map(function(p){return '['+p[0]+']\n'+p[1]}).join('\n\n')}
function presStats(e){
  var w=presParts(e).reduce(function(n,p){return n+p[1].split(/\s+/).filter(Boolean).length},0),sec=Math.round(w/2.5);
  return {w:w,sec:sec,txt:w+' words, about '+sec+' seconds at a steady speaking pace'+(sec>75?'. Too long: cut the lower-value negatives and keep the key positives.':sec<30?'. Short: add more of the history and examination.':'.')};
}

/* ================= files / clipboard ================= */
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function copyText(text){
  var p=(navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(text):Promise.reject();
  return p.then(function(){return true}).catch(function(){
    try{var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}});
}
function blobSave(name,text,mime){try{var b=new Blob([text],{type:mime||'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},3000);return true}catch(e){return false}}
function offerFile(name,text){
  var raw=text;if(/\.(txt|csv)$/i.test(name))text='\ufeff'+text;
  var get=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')):Promise.resolve(null);
  return get.then(function(dl){
    if(!dl){if(!window.claude&&blobSave(name,text)){toast('Saved '+name);return true}return copyText(raw).then(function(){toast('Saving is unavailable here. Copied to clipboard.')})}
    return dl.save({filename:name,data:text}).then(function(){toast('Saved '+name);return true}).catch(function(err){
      if(err&&err.code==='declined')return;
      if(err&&err.code==='rate_limited'){toast('Wait a moment, then try again.');return}
      return copyText(raw).then(function(){toast('Could not save. Copied to clipboard.')})});
  }).catch(function(){return copyText(raw).then(function(){toast('Saving failed. Copied to clipboard.')})});
}
function offerBinary(name,bytes){
  var blob=new Blob([bytes],{type:'application/pdf'});
  var get=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')):Promise.resolve(null);
  return get.then(function(dl){
    if(!dl){if(!window.claude&&blobSave(name,bytes,'application/pdf')){toast('Saved '+name);return}toast('Saving files is unavailable here.');return}
    return dl.save({filename:name,data:blob}).then(function(){toast('Saved '+name)}).catch(function(err){
      if(err&&err.code==='declined')return;
      if(err&&err.code==='rate_limited'){toast('Wait a moment, then try again.');return}
      toast('Could not save the PDF.')});
  }).catch(function(){toast('Saving failed.')});
}
function buildPDF(e){
  var P=getP(e.pid),blocks=sheetBlocks(e).map(function(b){return b.k==='p'&&b.label&&b.label[b.label.length-1]!==':'?{k:b.k,label:b.label+':',text:b.text}:b}),meta=[];

}
function canShare(){return typeof navigator!=='undefined'&&!!navigator.share&&typeof File==='function'}

/* High-yield (must-ask): red flags, items marked * in the content, or, where a complaint has no marks yet, strong clues (weight 3+) */
function isHY(P,it){if(it.flag||it.hy)return true;if(P.hyMarked&&P.hyMarked[it.k.charAt(0)])return false;for(var k in it.w)if(it.w[k]>=3)return true;return false}
function mnHTML(m){return m?'<div class="mn"><span class="mnl">Remember</span><b>'+esc(m.t)+'</b>'+(m.x?'<span>'+esc(m.x)+'</span>':'')+'</div>':''}
function czState(e,P,c){var t=0,n=0;P.sections.forEach(function(s){if(c.secs.indexOf(s.title)<0)return;s.items.forEach(function(it){t++;if(e.f[fkey(P,it)])n++})});return {n:n,t:t}}
function czHTML(e,P){
  if(!P.cz||!P.cz.length)return '';
  var done=0,rows=P.cz.map(function(c,i){
    var st=czState(e,P,c);if(st.n)done++;
    var dx=c.dd.map(function(k){var d=P.dmap[k];return d?(d.mnm?'<u>'+esc(d.name)+'</u>':esc(d.name)):''}).filter(Boolean).join(', ');
    return '<button class="czr'+(st.n?' on':'')+'" data-act="czGo" data-i="'+i+'" style="--hue:'+(czHue[i%czHue.length])+'"><span class="czn">'+esc(c.n)+'</span><span class="czd">'+dx+'</span><span class="czs" aria-label="'+(st.n?'Asked':'Not asked yet')+'">'+(st.n?'\u2713':'Ask')+'</span></button>';
  }).join('');
  var hk=HOOKS[P.id];
  return '<section class="card cz" id="czSlot"><div class="czh"><div><div class="eyebrow">Causes to cover</div>'+(hk?'<b class="czm">'+esc(hk[0])+'</b>':'')+'</div><span class="cnt">'+done+'/'+P.cz.length+'</span></div><p class="small muted" style="margin-block:2px 8px">Ask the story first, then screen each cause with a few questions. Tap a cause to jump to its questions. <u>Underlined</u>: must not miss.</p><div class="czl">'+rows+'</div></section>';
}

-start:10px"><label class="f">Complaint (own words)<input type="text" data-b="cc" value="'+esc(e.cc)+'" autocomplete="off"></label><label class="f">Duration / onset<input type="text" data-b="dur" value="'+esc(e.dur)+'" autocomplete="off"></label></div><div class="row" style="margin-block-start:10px;justify-content:space-between"><span class="small muted">Use initials or a bed number. Data stays in this browser.</span><button class="btn small" data-act="infoToggle">Done</button></div></div>';

function recentHTML(){

function vitOut(v){
  var n=news2(v),fl=vitFlags(v),b=bmi(v),sb=num(v.sbp),db=num(v.dbp);

  var any3=false;for(var k in n.parts)if(n.parts[k]===3)any3=true;
  var lv=!n.any?'':n.tot>=7?' hi':(n.tot>=5||any3)?' md':' lo';

  return h;
}
function ddRows(e,full){
  var ds=ddxScores(e),mx=Math.max(ds.res.length?ds.res[0].s:0,0.01),h='';

  if(full)h+='<p class="small muted" style="margin-block-end:8px">'+(ds.demo?'Adjusted for the patient\u2019s '+[e.pt.age?'age ('+esc(e.pt.age)+')':'',e.pt.sex?'sex':''].filter(Boolean).join(' and ')+'.':'Enter age and sex in the patient data to adjust this list.')+(ds.na.length?' Not possible for this sex: '+ds.na.map(function(d){return esc(d.name)}).join(', ')+'.':'')+'</p>';
  var lim=full?ds.res.length:6;

    var f=fitLabel(r,mx,ds.nF,i),nx=full?nextToCheck(e,r):[];

    if(full&&(r.pos.length||r.neg.length||nx.length)){
      h+='<details><summary>Why</summary>';
      if(r.pos.length)h+='<div><b>For:</b><ul>'+r.pos.map(function(it){return '<li>'+esc(it.t)+'</li>'}).join('')+'</ul></div>';
      if(r.neg.length)h+='<div><b>Against (absent):</b><ul>'+r.neg.map(function(it){return '<li>'+esc(it.t)+'</li>'}).join('')+'</ul></div>';
      if(nx.length)h+='<div><b>Check next to confirm:</b><ul>'+nx.map(function(x){return '<li>'+(x.kind==='H'?'Ask: ':'Examine: ')+esc(x.it.t)+'</li>'}).join('')+'</ul></div>';
      h+='</details>';

/* ---- Log ---- */
function diagOf(e){var ds=ddxScores(e);return e.tx.dx||(!DB.hideDdx&&ds.nF?ds.res[0].d.name:'')}
function filtered(){
  var q=UI.logq.toLowerCase();
  return DB.encs.filter(function(e){var P=getP(e.pid);if(!P)return false;
    if(!q)return true;
    var s=[e.pt.ref,e.pt.loc,e.cc,e.tx.dx,e.tx.hpc,P.name,P.sys,diagOf(e)].join(' ').toLowerCase();return s.indexOf(q)>=0}).sort(function(a,b){return b.t0-a.t0});
}

function backupNote(){
  var lb=DB.lastBackup,days=lb?Math.floor((Date.now()-lb)/864e5):null;
  if(!DB.encs.length)return '';
  if(!lb)return '<div class="alert" style="margin-block-end:12px">You have never backed up. Tap Back up everything and keep the file in WhatsApp saved messages or Drive.</div>';
  if(days>=7)return '<div class="alert" style="margin-block-end:12px">Last backup was '+days+' days ago. Back up again.</div>';
  return '<p class="small muted" style="margin-block-end:12px">Last backup '+(days===0?'today':days+' day'+(days===1?'':'s')+' ago')+'.</p>';
}

    var P=getP(e.pid),pr=progress(e),ds=ddxScores(e),armed=UI.armed===e.id;

  }).join('');
