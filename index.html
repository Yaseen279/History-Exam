<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1F5FBF"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Bedside H&amp;E</title>

<style>
/* Layout concept: phone-first clinical clipboard. Bottom tab bar on phones, left rail on tablets,
   live differential docked at the bottom on phones and as a sticky side panel on wide screens. */
:root{
  --bg:#E9EEF1;--surface:#FFFFFF;--surface2:#DFE7EB;--ink:#0C1A21;--muted:#516670;--line:#CBD7DD;
  --accent:#0A7580;--accent-ink:#FFFFFF;--accent-soft:#D5ECEE;
  --danger:#BE3B2D;--danger-bg:#FBE6E3;--warn:#9A6200;--warn-bg:#FBEFD5;--ok:#2B7A4B;--ok-bg:#DDF0E4;
  --f-disp:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
  --f-body:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
  --sh:0 1px 2px rgba(16,36,43,.06),0 4px 14px rgba(16,36,43,.05);
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#091116;--surface:#111E24;--surface2:#1A2B32;--ink:#E6EFF2;--muted:#93A9B0;--line:#27404A;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  --accent:#4EC3CD;--accent-ink:#06262A;--accent-soft:#143A40;
  --danger:#FF8173;--danger-bg:#3A1C19;--warn:#E8B45C;--warn-bg:#352913;--ok:#6FD093;--ok-bg:#15301F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#091116;--surface:#111E24;--surface2:#1A2B32;--ink:#E6EFF2;--muted:#93A9B0;--line:#27404A;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  --accent:#4EC3CD;--accent-ink:#06262A;--accent-soft:#143A40;
  --danger:#FF8173;--danger-bg:#3A1C19;--warn:#E8B45C;--warn-bg:#352913;--ok:#6FD093;--ok-bg:#15301F;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;line-height:1.12;letter-spacing:-.015em}
h2{font-size:1.65rem;font-weight:800}h3{font-size:1.02rem;font-weight:700;letter-spacing:-.005em}
p{margin:0}
.app{display:flex;flex-direction:column;min-height:100vh}
.main{flex:1;min-width:0;padding-inline:16px;padding-block:12px 170px;max-width:1120px;width:100%;margin-inline:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:1.2rem;letter-spacing:-.02em;line-height:1.05}

.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.7rem;color:var(--muted);letter-spacing:0;margin-block-start:2px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;background:none;border:0;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer;min-height:56px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.nav button:focus-visible,.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-block-end:14px;box-shadow:var(--sh)}
.card>h3{margin-block-end:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cnt{flex:none;font-family:var(--f-mono);font-size:.74rem;font-weight:500;color:var(--muted);background:var(--surface2);border-radius:99px;padding:2px 9px}
.card.done>h3{color:var(--muted)}
.card.done .cnt{background:var(--ok-bg);color:var(--ok)}
.card.done .cnt::before{content:'\2713 '}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:.92rem;cursor:pointer;transition:transform .08s ease}
.btn:active,.chip:active,.pick button:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:38px;padding:4px 12px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.stages{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px;margin-inline:-16px;padding-inline:16px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stages button{flex:1 0 auto;min-height:44px;padding:6px 14px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap}
.stages button[aria-current="step"]{background:var(--accent);color:var(--accent-ink)}
.stages button[aria-current="step"] .mono{opacity:.85}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);font-weight:700}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:1rem;color:var(--ink)}
textarea{min-height:76px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.it{display:flex;gap:12px;align-items:center;padding-block:9px;min-height:60px;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .t{flex:1;min-width:0;font-size:1rem;line-height:1.35}
.it.flag{border-inline-start:4px solid var(--danger);padding-inline-start:10px;background:linear-gradient(90deg,var(--danger-bg),transparent 55%)}
.it.pulse{animation:pulse 1.1s ease 1}
@keyframes pulse{0%,60%{background:var(--accent-soft)}100%{background:transparent}}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}
.pill.red{background:var(--danger-bg);color:var(--danger)}
.pill.amber{background:var(--warn-bg);color:var(--warn)}
.pill.green{background:var(--ok-bg);color:var(--ok)}
.pill.teal{background:var(--accent-soft);color:var(--accent)}
.pill.grey{background:var(--surface2);color:var(--muted)}
.seg{display:flex;flex:none;gap:6px}
.seg button{min-width:56px;min-height:48px;padding:0 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-weight:700;font-size:.88rem;cursor:pointer;transition:transform .08s ease,background .12s ease}
.seg button:active{transform:scale(.93)}
.seg button.y.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button.a.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.seg button.n.on{background:var(--surface2);color:var(--ink);border-color:var(--ink)}
.seg.one button{min-width:72px}
.alert{background:var(--danger-bg);color:var(--danger);border:1.5px solid var(--danger);border-radius:14px;padding:12px 14px;margin-block-end:12px;font-size:.9rem;font-weight:600}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.82rem;margin-block-end:12px}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.mute i{background:var(--muted);opacity:.5}
.dd{padding-block:9px;border-top:1px solid var(--line)}
.dd:first-child{border-top:0}
.dd .h{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.dd .nm{font-weight:600;min-width:0;font-size:.8rem;line-height:1.25}
.dd .pill{font-size:.6rem;padding:1px 6px}
.dd .nm .pill{margin-inline-start:2px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.dd .rk{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);flex:none}
.dd details{margin-block-start:6px;font-size:.76rem}
.dd summary{cursor:pointer;color:var(--accent);font-weight:600}
.dd ul{margin:6px 0 0;padding-inline-start:18px}
.dock{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface);color:var(--ink);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.18);padding:8px 16px;display:flex;gap:10px;align-items:center;cursor:pointer}
.dock .l{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;flex:none}
.dock .tops{display:flex;gap:5px;flex-wrap:wrap;min-width:0;flex:1}
.dock .tp{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:3px 9px;font-size:.68rem;line-height:1.25;font-weight:600;min-width:0}
.dock .tp.m{outline:1px solid currentColor}
.dockx{flex:none;background:var(--surface2);border:0;color:inherit;border-radius:10px;padding:6px 12px;font-weight:700;font-size:.78rem;min-height:38px;cursor:pointer}
.fab{position:fixed;left:16px;bottom:calc(122px + env(safe-area-inset-bottom,0px));z-index:26;display:flex;align-items:center;gap:6px;min-height:48px;padding:0 16px 0 14px;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.88rem;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fab:active{transform:scale(.95)}
.stages .tg{flex:0 0 auto;border:1.5px solid var(--line);color:var(--ink);margin-inline-start:auto}
.rosd{border-top:1px solid var(--line);padding-block:4px}
.rosd summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font-weight:600;min-height:44px;list-style:none}
.rosd summary::-webkit-details-marker{display:none}
.side{display:none}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick button{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:68px;cursor:pointer;box-shadow:var(--sh);transition:transform .08s ease}
.pick button b{display:block;font-weight:700;font-size:.98rem;line-height:1.2}
.pick button{position:relative}.pick button .srcmk{position:absolute;inset-block-end:8px;inset-inline-end:8px;opacity:.9}.srcln{display:flex;align-items:center;gap:8px;margin-block-start:6px;font-size:.74rem;color:var(--muted)}.srcln img{flex:none}.pick button span{font-size:.78rem;color:var(--muted)}
.sc summary{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:4px 0;cursor:pointer;font-weight:600;list-style:none}
.sc summary::-webkit-details-marker{display:none}
.sc .res{margin-block-start:10px;padding:10px 12px;background:var(--surface2);border-radius:10px}
.sc .res b{font-family:var(--f-mono);font-size:1.15rem}
.scrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:7px;border-top:1px solid var(--line);font-size:.9rem}
.scrow select{width:auto;max-width:55%}
.vit .big{font-family:var(--f-mono);font-size:1.5rem;font-weight:500}
.sign{padding-block:10px;border-top:1px solid var(--line)}
.sign:first-child{border-top:0}
.sign b{font-weight:600}
.timer{font-family:var(--f-mono);font-size:2.4rem;font-weight:500;letter-spacing:.02em}
.mono{font-family:var(--f-mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--surface2);color:var(--ink);border:1.5px solid var(--ink);box-shadow:var(--sh);padding:10px 18px;border-radius:99px;font-weight:600;font-size:.85rem;z-index:50;max-width:calc(100% - 32px);text-align:center}
.q{font-size:1rem}
.q li{margin-block:4px}
.opt{display:block;width:100%;text-align:start;margin-block:6px;padding:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;font-weight:600;cursor:pointer;min-height:46px}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.logrow{display:flex;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.logrow:first-child{border-top:0}
.logrow .o{flex:1;min-width:0;text-align:start;background:none;border:0;padding:0;cursor:pointer}
.logrow .o b{display:block;font-weight:600}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.hide{display:none}
.brand{white-space:nowrap}
.top>.row{flex-wrap:nowrap;gap:6px}
@media (max-width:560px){.brand small{display:none}}
@media (min-width:600px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){
  .app{flex-direction:row}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;width:104px;height:100vh;flex-direction:column;justify-content:flex-start;border-top:0;border-inline-end:1px solid var(--line);padding:16px 6px;gap:4px}
  .nav button{flex:none;border-radius:10px}
  .nav button[aria-current="page"]{background:var(--accent-soft)}
  .main{padding-block-end:48px;padding-inline:24px}
  .stages,.chips{margin-inline:0;padding-inline:0}
  .dock{display:none}
  .fab{bottom:24px;left:auto;right:24px}
  .toast{bottom:24px}
}
@media (min-width:1180px){
  .encgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
  .side.on{display:block;position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
}

SC
I Match the drain to the operation and the post-operative day; record output volume and character every 24 hours; send fluid for culture, amylase or bilirubin if a leak is suspected; imaging for a collection if output stops suddenly with fever or pain; remove when output is low and serous and the patient is well
H About the drain
- Operation done, date and post-operative day
- Why the drain was placed: therapeutic, diagnostic, prophylactic, monitoring or palliative
- Is there more than one drain? Ask, as drains can be hidden by the patient's belongings
- Pain at the drain site or a feeling of fluid leaking around it
- Fever, rigors or new abdominal pain since the drain was placed
H Fluid and function
- Amount drained over the last 24 hours, and the trend
- Colour change: serous, serosanguinous, bloody, purulent, bilious, faecal, chylous
- Has the drain stopped draining suddenly?
- Fluid replaced by IV fluids when the losses are large
E Identify the drain
- Number of drains
- Site of each drain and the incision it comes out of
- Type: open or closed, active (suction) or passive (gravity)
- Name: for example Penrose, corrugated, Robinson, Redivac, Jackson-Pratt, T-tube, chest tube, urethral catheter, NG tube
E Check the drain
- Drain tube patent, not kinked or blocked by clots, secured well, and below the level of the wound
- Drain bag or reservoir: amount and colour, and over what duration it collected
- Active drain: reservoir activated and emptied at least once a day
- Skin at the exit site clean and dry: discharge, erythema, erosion
- Drain site herniation or leakage around the tube
- Main wound examined: edges, discharge, collection under the wound
E Is it ready to come out?
- Output under about 30 to 50 mL in 24 hours (varies with the operation) and steadily falling
- Fluid serous or serosanguinous, not purulent, bilious, faecal, chylous or bloody
- Patient has no fever, sepsis, peritonitis, wound infection or abscess
- No collection on imaging, if imaging was done
- Procedure-specific timing respected (for example: thyroidectomy over 24 hours, colorectal anastomosis 5 to 7 days, T-tube in the CBD 10 to 14 days)

! Weight loss, fever or night sweats

- Respiratory: chest expansion, percussion, breath sounds

- Hernial orifices, genitalia and PR when indicated

['Collapsing (water-hammer) pulse','Cardiovascular','Ask about shoulder pain, then raise the arm and feel the radial pulse with your palm.','Aortic regurgitation. Also PDA, thyrotoxicosis, severe anaemia.'],

['Pulsus paradoxus','Cardiovascular','Deflate the cuff slowly; note a systolic fall of over 10 mmHg on inspiration.','Tamponade, severe asthma or COPD, constrictive pericarditis.'],
['Radio-femoral delay','Cardiovascular','Palpate radial and femoral pulses together.','Coarctation of the aorta.'],
['JVP','Cardiovascular','Patient at 45°, head turned slightly left. Measure vertical height above the sternal angle (normal up to 3 cm). Check hepatojugular reflux.','Raised: heart failure, tamponade, constrictive pericarditis. Raised and non-pulsatile: SVC obstruction.'],
['Kussmaul’s sign','Cardiovascular','JVP rises on inspiration.','Constrictive pericarditis, restrictive cardiomyopathy, severe right heart failure.'],
['Apex beat','Cardiovascular','Locate in the 5th intercostal space, mid-clavicular line. Note position and character.','Displaced: LV dilatation. Heaving: LV hypertrophy. Tapping: mitral stenosis.'],
['Quincke’s, Corrigan’s and de Musset’s signs','Cardiovascular','Nail-bed pulsation; visible carotid pulsation; head nodding with each beat.','Severe aortic regurgitation.'],
['Malar flush','Cardiovascular','Look at the cheeks.','Mitral stenosis.'],
['Endocarditis stigmata','Cardiovascular','Splinter haemorrhages, Osler nodes, Janeway lesions, Roth spots on fundoscopy.','Infective endocarditis.'],
['Clubbing','Respiratory','Look for loss of the nail-fold angle, drumstick fingertips, loss of the Schamroth window.','Lung cancer, bronchiectasis, pulmonary fibrosis, cyanotic heart disease, endocarditis, cirrhosis, IBD, coeliac disease.'],
['Tracheal deviation','Respiratory','Index and ring fingers on the clavicular heads, middle finger in the suprasternal notch; compare gaps.','Away: tension pneumothorax, large effusion. Towards: collapse, fibrosis, pneumonectomy.'],
['Vocal resonance, whispering pectoriloquy, egophony','Respiratory','Auscultate while the patient says “99”, whispers, or says “ee”.','Increased with consolidation (egophony: “ee” heard as “ay”). Reduced with effusion or pneumothorax.'],
['Bronchial breathing','Respiratory','Loud, high-pitched breath sounds with a gap between inspiration and expiration.','Consolidation, localised fibrosis, above an effusion.'],
['Stony dull percussion','Respiratory','Percuss over the lung base.','Pleural effusion.'],
['Asterixis','Respiratory','Arms outstretched, wrists dorsiflexed, fingers spread for 30 seconds.','CO2 retention, hepatic encephalopathy, uraemia.'],
['Pemberton’s sign','Endocrine','Raise both arms above the head for a minute; look for facial plethora or stridor.','Retrosternal goitre or thoracic inlet obstruction.'],

['Cullen’s and Grey Turner’s signs','Abdomen','Look for periumbilical and flank bruising.','Haemorrhagic pancreatitis or retroperitoneal bleed.'],
['Shifting dullness','Abdomen','Percuss from midline to flank until dull, keep finger there, roll the patient, percuss again after 30 seconds.','Ascites if resonance returns.'],
['Charcot’s triad and Reynolds’ pentad','Abdomen','Fever, jaundice, right upper quadrant pain. Add hypotension and confusion for Reynolds.','Ascending cholangitis.'],
['Stigmata of chronic liver disease','Abdomen','Spider naevi, palmar erythema, Dupuytren’s contracture, leukonychia, gynaecomastia, caput medusae.','Chronic liver disease or cirrhosis.'],
['Virchow’s node','Abdomen','Palpate the left supraclavicular fossa.','Gastrointestinal malignancy.'],
['Sister Mary Joseph nodule','Abdomen','Inspect and palpate the umbilicus.','Intra-abdominal malignancy.'],

['Deep palpation for masses','Describe site, shape, size, surface, edge, consistency, fluid thrill, resonance and pulsatility. Press during expiration, not with rapid hard pressure.'],
['Liver','Right hand flat and transverse in the right iliac fossa, parallel to the costal margin. Ask for a deep breath and move up inch by inch. Describe the edge and surface. Percuss the upper margin.'],
['Spleen','Start in the right iliac fossa below the umbilicus and move towards the tip of the left tenth rib. Lift the lower left ribs with the other hand. Look for the notch, dullness on percussion, and that you cannot get above it.'],
['Kidneys','One hand behind the loin lifting forward, the other below the costal margin. Palpate between the hands and ballot an enlarged kidney.'],
['Percussion','Percuss the whole abdomen and over any mass. Shifting dullness for ascites. Succussion splash for a distended stomach.'],
['Auscultation','Bowel sounds: normal gurgles every few seconds, absent for 30 seconds (paralytic ileus), tinkling (obstruction). Listen for bruits.'],
['Never forget','Supraclavicular nodes, hernial orifices (at rest and on coughing), femoral pulses, external genitalia, anal canal and rectum.'],
['Finish','Cover the patient. Present your findings and say which investigations you would arrange.']
],pl:['Examine genitalia and hernial orifices in every abdominal examination.','A tender mass is easier to feel by resting the hand and pressing a little deeper during expiration.','Tenderness on the opposite side when pressure is released can be a clue to the source of pain.']},

{id:'hernia',n:'Hernia and groin examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, chaperone, expose from the umbilicus to the knees. Ask the patient to stand up.'],
['Look from the front','Exact site and shape of the lump. Does it extend into the scrotum? Look at the other groin and for scars from earlier repairs or a right iliac fossa incision.'],
['Feel from the front','Examine the scrotum and its contents. Can you get above the lump (feel its upper edge with normal cord above)? If yes it is scrotal, not a hernia.'],
['Feel from the side','Stand at the patient’s side with one hand in the small of his back and the examining hand flat on the lump, parallel to the inguinal ligament.'],
['Describe the lump','Position, temperature, tenderness, shape, size, tension, composition (solid, fluid, gas).'],
['Cough impulse','Compress the lump gently, ask the patient to turn away and cough. It must expand or become tense. Movement in one direction is not a cough impulse.'],
['Reduce it','Gently compress the lower part, then lift up towards the external ring, the way the patient does. Be very gentle with a possibly incarcerated hernia: do not push hard (reduction en masse).'],
['Deep ring test','Once reduced, slide the fingers up and laterally to press over the internal ring and ask the patient to cough. Controlled: indirect. Not controlled: direct.'],
['Watch it reappear','Remove the hand. An indirect hernia slides obliquely down the canal; a direct hernia comes straight forward.'],
['Lying down','Large hernias are easier to reduce lying flat. This position is best for deciding if a hernia is femoral.'],
['Femoral hernia','Below the inguinal ligament and lateral to the pubic tubercle, behind the groin crease. Usually firm, rarely reducible, no usual cough impulse.'],
['Other side and abdomen','Examine the other groin (ask the patient to cough). Examine the abdomen for causes of raised pressure: bladder, ascites, mass, pregnancy.'],
['Fitness','Assess the cardiovascular and respiratory systems for fitness for operation.'],
['If painful or irreducible','Check colour, temperature and tenderness. A strangulated hernia is very tender and the patient is unwell. Richter hernia: tender but no obstruction.']
],pl:['Irreducible: cannot be replaced. Incarcerated: stuck but not tender. Obstructed: bowel lumen blocked. Strangulated: blood supply compromised.','Always examine the hernial orifices in anyone with intestinal obstruction.','Direct hernias rarely strangulate because they do not pass through the internal ring.']},

{id:'lump',n:'Examination of any lump (Bailey & Love)',s:'Examination',st:[
['History','Duration, first symptom, other symptoms (pain, interference with movement or swallowing), progression, persistence (does it ever disappear?), multiplicity, what the patient thinks caused it.'],
['Site','Exact anatomical position, measured from bony points with a tape.'],
['Size and shape','Measure in three dimensions. Describe the shape, for example dumb-bell, pear or kidney shaped.'],
['Surface and skin','Smooth, bosselated or irregular. Colour and texture of the overlying skin.'],
['Temperature and tenderness','Use the dorsal fingers for temperature. Feel the non-tender part first and watch the face.'],
['Edge','Well defined or indistinct.'],
['Consistency','Stony hard, firm, rubbery, spongy or soft.'],
['Fluctuation','Press the centre while two fingers feel the sides, in two planes at right angles.'],
['Fluid thrill','Tap one side, feel the other. Place a hand edge between to block wall conduction.'],
['Transillumination','Pinpoint light at the side in a dark room. The whole lump should glow.'],
['Resonance','Percuss: solid and fluid lumps are dull, gas-filled ones resonant.'],
['Pulsatility','Fingers on opposite sides: pushed outwards and upwards means expansile; only upwards means transmitted.'],
['Compressibility and reducibility','Compressible lumps refill. Reducible lumps move away and may return with a cough.'],
['Bruit','Listen over the lump with a stethoscope.'],
['Relations','Mobility and fixity: skin, then deeper structures with the muscle tensed.'],
['Regional lymph nodes','Palpate the draining nodes (limbs: axillary and inguinal; head and neck: cervical; abdomen: para-aortic).'],
['Local tissues','Arteries, nerves, bones and joints nearby. Then examine the whole patient.']
],pl:['Describe first, then give a diagnosis.','A lump that disappears lying down or with exercise is only seen in a few types.','Pain suggests inflammation more than cancer. Many patients ignore a painless lump.']},

{id:'ulcer',n:'Examination of an ulcer',s:'Examination',st:[
['History','When first noticed, what drew attention (pain, bleeding, discharge), symptoms, changes since it appeared, previous ulcers at the same site or elsewhere, what the patient thinks caused it.'],
['Prepare','Wash hands, introduce, consent, expose the limb fully, good light. Use gloves. Do not remove a scab without permission.'],
['Site, size and shape','Exact site, measure it (trace on a clear sheet if irregular).'],
['Base','Healthy red granulation, slough, necrotic tissue, or exposed tendon or bone. Pale healing epithelium at the edge.'],
['Edge','Sloping (venous), punched out (neuropathic or ischaemic), undermined (pressure, TB), rolled and pearly (basal cell carcinoma), everted (squamous cell carcinoma).'],
['Depth','In millimetres, and which structures it reaches.'],
['Discharge','Serous, bloody, serosanguinous or purulent, and any smell.'],
['Surroundings and relations','Skin changes, tenderness, whether it is adherent to tendon, periosteum or bone (osteomyelitis).'],
['Local lymph nodes','Palpate the draining nodes: reactive or secondary deposits.'],
['Local tissues','Pulses and capillary refill, ABPI, sensation, venous changes, varicose veins.'],
['General examination','Hands and face for clues. Many systemic diseases present with ulcers.']
],pl:['Venous ulcers: gaiter area, sloping edge. Arterial: toes and heels, punched out. Neuropathic: sole and pressure points, painless.','A long-standing ulcer with a raised edge may be a Marjolin ulcer.']},

{id:'thy',n:'Neck swelling and thyroid (Bailey & Love)',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, sit the patient on a chair, expose the neck and upper chest.'],
['History points','Systemic illness (fever, weight loss, itch), mouth and throat symptoms, voice change, dysphagia, breathing difficulty, skin lumps, and symptoms of thyroid disease.'],
['Site','Anterior triangle (sternomastoid, jaw, midline) or posterior triangle (sternomastoid, trapezius, clavicle). Tense the muscles to define them: push the head down against your hand, and shrug against resistance.'],
['Relation to muscle','Palpate with the muscles relaxed and then contracted. A lump deep to muscle becomes less obvious when it contracts.'],
['Relation to the hyoid','Hold the jaw still and ask the patient to protrude the tongue. A swelling that moves is fixed to the hyoid (thyroglossal cyst).'],
['Relation to the trachea','Ask the patient to swallow a sip of water. Swellings attached to the trachea move up on swallowing.'],
['Thyroid: general','Agitation or lethargy, weight, sweating, voice, facies.'],
['Thyroid: hands','Pulse (tachycardia, AF, bradycardia), sweaty palms, fine fast tremor with arms outstretched and fingers separated (paper on the fingers).'],
['Thyroid: eyes','Lid retraction and lid lag (follow a finger downwards), exophthalmos (sclera visible below the iris), ophthalmoplegia (cannot look up and out), chemosis.'],
['Neck from the front','Look at the swelling and ask to swallow. Position of the trachea at the suprasternal notch. Confirm size, shape, surface and tenderness.'],
['Neck from behind','Thumbs on the ligamentum nuchae, head tilted slightly forward. Palpate each lobe and the isthmus with flat fingers. Swallow again. Can you feel the lower border, or is there retrosternal extension?'],
['Describe the lump','Location, solitary or multiple, tenderness, shape, size, surface, consistency.'],
['Nodes','Palpate cervical and supraclavicular nodes.'],
['Percussion and auscultation','Percuss over the sternum for a retrosternal extension. Listen over the gland for a systolic bruit.'],
['General examination','Cardiovascular and nervous systems for hyper- or hypothyroidism (reflexes).'],
['Finish','State whether the patient is euthyroid, thyrotoxic or hypothyroid, and whether the swelling is diffuse or nodular.']
],pl:['The most important palpation is from behind.','Inability to get below the swelling on swallowing suggests significant retrosternal extension. Percussion is not reliable.','A hard, fixed node or a lump with hoarseness suggests malignancy.']},

{id:'nodes',n:'Lymph nodes',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, sit the patient up, expose neck, axillae, groins as needed.'],
['Head and neck','From in front or behind: submental, submandibular, pre-auricular, post-auricular, occipital, tonsillar, anterior and posterior cervical chains, supraclavicular.'],
['Axillae','Support the arm. Palpate the central, anterior (pectoral), posterior (subscapular), lateral and apical groups.'],
['Epitrochlear','Hold the elbow and feel above the medial epicondyle.'],
['Groins','Horizontal inguinal group and vertical femoral group.'],
['Popliteal','If indicated.'],
['Describe','Site, size, tender or not, hard or rubbery, discrete or matted, mobile or fixed.'],
['Drainage area','Examine the area drained by an abnormal node (scalp, mouth, breast, skin, genitalia).'],
['Organs','Liver, spleen, and tonsils.'],
['Finish','Say if lymphadenopathy is localised or generalised.']
],pl:['Hard, fixed, painless, matted nodes suggest malignancy.','A left supraclavicular node (Virchow) points to an abdominal primary.']},

{id:'breast',n:'Breast examination (Bailey & Love)',s:'Examination',st:[
['History','Age (young women rarely have cancer), family history of breast or ovarian cancer (with ages), pregnancies and breastfeeding, relation of symptoms to menstruation, hormone drugs (pill, HRT), alcohol, obesity, implants or previous surgery.'],
['Prepare','Wash hands, introduce, full explanation and permission, chaperone. Undress to the waist and wear a front-opening gown.'],
['Inspect sitting','Facing the patient: asymmetry, indentation, tethering, skin changes (puckering, peau d’orange, nodules, ulceration), nipple and areola.'],
['Arms up and pectorals','Ask her to lift her hands above her head, then press her hands on her hips to contract the pectorals. This accentuates tethering.'],
['Lie at 45 degrees','If the lump can only be felt in a certain position, examine her in that position too.'],
['Ask about pain','Ask which area is painful or tender before you palpate.'],
['Palpate','Use the flat of the fingers against the chest wall in all areas, including behind the nipple. Examine the normal breast first.'],
['Describe the lump','Size, consistency, surface contour, edge, mobility within the breast, and fixity to the ribs and pectoralis (hand on hip to tense it).'],
['Tethering or fixation','Tethered: skin puckers when the lump is moved outside its arc, but the lump is separate from the skin. Fixed: the lump cannot move without moving the skin.'],
['Nipple','Does an inverted nipple evert? One-sided and recent inversion is more significant. Discharge: one duct or many, colour (creamy normal, green-brown duct ectasia, bloody needs investigation).'],
['Axilla','Support her arm at 45 degrees on your forearm so the muscles relax. Sweep the fingers from the apex of the axilla down against the chest wall. Then the anterior fold and axillary tail.'],
['Supraclavicular and arms','Feel the supraclavicular and infraclavicular fossae and neck. Check the arms for lymphoedema.'],
['Metastases','If locally advanced or indicated, check spinal tenderness, chest for pleural effusion, and the liver.'],
['Finish','Cover her. Say you would arrange triple assessment: clinical examination, imaging (ultrasound or mammography) and biopsy.']
],pl:['Triple assessment is the basis for diagnosis of every breast lump.','The 7 Ds of nipple change: destruction, depression, discolouration, displacement, deviation, discharge, duplication.','Axillary nodes are palpable in about 10% of women with breast cancer.']},

{id:'pvd',n:'Peripheral arterial examination (legs)',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose both legs to the groin, lie flat, warm room.'],
['Inspect','Colour (pallor, rubor), hair loss, shiny skin, ulcers (location: toes, heels, pressure points), gangrene, scars, muscle wasting.'],
['Temperature','Compare both legs with the back of your hand from the thigh to the foot.'],
['Capillary refill','Press the toe pulp for 5 seconds: normal under 2 seconds.'],
['Palpate pulses','Femoral (mid-inguinal point), popliteal, posterior tibial (behind the medial malleolus), dorsalis pedis. Compare both sides. Check for aneurysm at the femoral and popliteal.'],
['Abdomen','Palpate the aorta for an aneurysm.'],
['Auscultate','Femoral and iliac bruits.'],
['Buerger test','Raise the leg to 45 degrees for 1 to 2 minutes (pallor), then sit it over the edge of the bed (reactive hyperaemia).'],
['Sensation and power','Test sensation and power if neuropathy or ischaemia is suspected.'],
['Finish','Say you would check the ABPI, blood pressure in both arms, the heart (AF), and examine the other leg and the diabetic foot.']
],pl:['The 6 Ps of acute limb ischaemia: pain, pallor, pulselessness, paraesthesia, paralysis, perishing cold.','Ulcers: arterial ones are painful, on the toes or heels, with a punched-out look.']},

{id:'varic',n:'Varicose veins',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose both legs fully, examine standing.'],
['Inspect standing','Dilated veins along the great and small saphenous territories, swelling, skin changes (eczema, pigmentation, lipodermatosclerosis), ulcers, scars.'],
['Palpate','Warmth, tenderness, hard cords (thrombophlebitis), oedema, saphenofemoral junction cough impulse.'],
['Tap test','Tap the lower vein and feel the impulse at the knee or the groin.'],
['Trendelenburg','Lay the patient flat, raise the leg to empty the veins, compress the saphenofemoral junction, then stand. Slow filling with the pressure on: incompetence at the junction.'],
['Perforators','Repeat with a tourniquet at different levels to localise incompetent perforators.'],
['Auscultate','Listen for a bruit over any varicosity (arteriovenous malformation).'],
['Pulses','Palpate the arterial pulses and check for arterial insufficiency before any compression.'],
['Abdomen and pelvis','Abdominal masses (venous obstruction).'],
['Finish','Say you would do duplex ultrasound.']
],pl:['Check arterial supply before advising compression stockings.','A venous ulcer is usually over the gaiter area, shallow and with sloping edges.']},

{id:'cvs',n:'Cardiovascular examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose the chest, position at 45 degrees, chaperone for female patients.'],
['General','Comfort at rest, breathlessness, colour, cyanosis, oedema, scars (midline sternotomy, thoracotomy), pacemaker bulge.'],
['Hands','Clubbing, splinter haemorrhages, Osler nodes, Janeway lesions, xanthomata, capillary refill.'],
['Pulse','Radial: rate, rhythm (regular, irregular, irregularly irregular), then character. Radio-radial and radio-femoral delay.'],
['Blood pressure','Measure in both arms if indicated. Check for a postural drop when relevant.'],
['Face','Conjunctival pallor, jaundice, xanthelasma, corneal arcus, malar flush, high-arched palate, dental hygiene.'],
['Neck: carotid','Carotid pulse character, one side at a time. Never both at the same time.'],
['Neck: JVP','Lie at 45 degrees, head turned slightly left. Look for the double waveform above the clavicle. Measure the height above the sternal angle (normal under 4 cm). Hepatojugular reflux if indicated.'],
['Inspect the chest','Scars, visible apex, pulsations, deformity, pectus.'],
['Palpate','Apex beat: position and character (heave, displaced). Then the left sternal edge for heaves and palpable thrills at each valve area.'],
['Auscultate','Listen with the diaphragm at all four areas (mitral, tricuspid, pulmonary, aortic), then the bell for mitral stenosis. Feel the carotid pulse while listening.'],
['Dynamic manoeuvres','Roll the patient to the left side and listen at the apex in expiration (mitral stenosis). Sit forward and listen at the left sternal edge in held expiration (aortic regurgitation).'],
['Carotids and back','Listen for carotid bruits and radiation of aortic murmurs. Auscultate lung bases for crackles.'],
['Finish','Check for sacral and ankle oedema, palpate for hepatomegaly. Say you would check peripheral pulses, blood pressure, temperature, urine dip and do an ECG.']
],pl:['Say "irregularly irregular" for AF.','Time the murmur against the carotid pulse.','State the apex beat position in the intercostal space and its relation to the mid-clavicular line.']},

{id:'resp',n:'Respiratory examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose the chest to the waist, position at 45 degrees.'],
['General','Breathlessness at rest, use of accessory muscles, cough, wheeze, stridor, sputum pot, oxygen and inhalers.'],
['Hands','Clubbing, tar staining, cyanosis, wasting of small hand muscles, flapping tremor (CO2 retention), pulse.'],
['Face','Conjunctival pallor, Horner syndrome, central cyanosis, lip pursing.'],
['Neck','Tracheal position (sternal notch), JVP, cervical lymph nodes.'],
['Inspect the chest','Shape (barrel chest, pectus), scars, radiotherapy marks, asymmetry, respiratory rate and pattern.'],
['Palpate','Chest expansion (upper and lower, thumbs 5 cm apart, 3 cm is normal), apex beat, tactile or vocal fremitus.'],
['Percuss','Compare both sides at the apices, upper, mid and lower zones, front, back and axillae. Resonant, dull (stony dull) or hyper-resonant.'],
['Auscultate','Breath sounds and added sounds (crackles, wheeze, rub), then vocal resonance (99) in the same sites.'],
['Back','Sit forward. Inspect, palpate expansion, percuss, auscultate from the top to the bases, and look for sacral oedema.'],
['Finish','Check peripheral oedema and calves for DVT. Say you would do peak flow, sputum, CXR and oxygen saturations.']
],pl:['Compare left with right at every level.','Stony dullness suggests effusion; reduced expansion on the same side supports it.','Check the trachea before you decide which side is abnormal.']},

{id:'cn',n:'Cranial nerve examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, sit the patient facing you.'],
['I Olfactory','Ask about change in smell. Test each nostril separately if indicated.'],
['II Optic','Acuity (Snellen), colour (Ishihara), visual fields by confrontation, pupillary light reflexes (direct and consensual), swinging torch, fundoscopy.'],
['III IV VI','Pupil size, ptosis, eye movements in an H pattern, ask about double vision, nystagmus.'],
['V Trigeminal','Sensation in V1, V2, V3 on both sides, corneal reflex if indicated, jaw opening and clench (power of masseters).'],
['VII Facial','Raise eyebrows, close eyes tightly, show teeth, puff cheeks. Forehead sparing indicates an upper motor neuron lesion.'],
['VIII Vestibulocochlear','Whisper test, Rinne and Weber tests.'],
['IX X Glossopharyngeal, vagus','Say "ahh" and watch the uvula and palate, gag reflex if indicated, cough, voice quality.'],
['XI Accessory','Shrug the shoulders and turn the head against resistance.'],
['XII Hypoglossal','Tongue at rest (fasciculations), protrusion (deviates to the side of the lesion), movement.'],
['Finish','Say you would examine the limbs, gait and fundi, and arrange imaging if needed.']
],pl:['Rinne and Weber: conductive deafness has a negative Rinne, and Weber lateralises to the deaf ear.','The tongue deviates towards the weak side.']},

{id:'ul',n:'Upper limb neurological examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose arms, sit the patient up.'],
['Inspect','Wasting, fasciculations, abnormal movements, posture, scars.'],
['Tone','Elbow and wrist: move gently and feel for spasticity (clasp-knife), rigidity (lead-pipe, cogwheel) or reduced tone.'],
['Power','Shoulder abduction (C5), elbow flexion (C5/6), extension (C7), wrist extension (C6/7), finger flexion (C8), finger abduction (T1). MRC grade 0 to 5.'],
['Reflexes','Biceps (C5/6), supinator (C6), triceps (C7). Use reinforcement if absent.'],
['Coordination','Finger-to-nose (intention tremor), rapid alternating movements (dysdiadochokinesia).'],
['Sensation','Light touch, pinprick, then vibration and joint position sense. Test dermatomes, comparing sides.'],
['Special tests','Pronator drift (eyes closed, arms out), Tinel and Phalen (carpal tunnel).'],
['Finish','Say you would examine the lower limbs, cranial nerves and gait.']
],pl:['Upper motor neuron signs: increased tone, brisk reflexes, upgoing plantar (Babinski).','Lower motor neuron signs: wasting, fasciculations, reduced tone and reflexes.']},

{id:'ll',n:'Lower limb neurological examination and gait',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose both legs fully, lie flat.'],
['Gait','Watch the patient walk, turn and walk heel-to-toe. Ask to walk on tiptoes, on heels. Romberg test.'],
['Inspect','Wasting, fasciculations, deformities, scars.'],
['Tone','Roll the leg and flick the knee. Test for ankle clonus (5 beats or more is abnormal).'],
['Power','Hip flexion (L2), extension (L5/S1), knee extension (L3/4), flexion (L5/S1), ankle dorsiflexion (L4/5), plantar flexion (S1/2), great toe extension (L5).'],
['Reflexes','Knee (L3/4), ankle (S1/2), plantar response (Babinski).'],
['Coordination','Heel-shin test.'],
['Sensation','Light touch, pinprick, vibration (at the great toe, then upwards) and joint position sense. Dermatomes L2 to S1.'],
['Spine and nerve root','Straight leg raise, palpate the spine, check anal tone if cauda equina is suspected.'],
['Finish','Say you would test the saddle area and bladder function when relevant.']
],pl:['Cauda equina: saddle anaesthesia, bladder or bowel dysfunction, and bilateral leg weakness. This is an emergency.','Foot drop: L4/5, common peroneal nerve at the fibular neck.']},

{id:'gals',n:'Joints: GALS screen',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose to underwear, patient standing.'],
['Screening questions','Any pain or stiffness in the muscles, joints or back? Any difficulty getting dressed or climbing stairs?'],
['Gait','Walk to the end, turn and return. Look at symmetry, smoothness, stride length, turning ease.'],
['Arms','Inspect the hands and forearms (palms up and down), squeeze the metacarpals (tenderness), make a fist, pinch grip, put hands behind the head, check elbows.'],
['Legs','Inspect standing, then lying down: knee effusion (patellar tap, bulge test), hip movement (flexion, internal rotation), knee flexion and crepitus.'],
['Spine','From behind: scoliosis, muscle bulk, symmetry. Lateral flexion, Schober test for lumbar flexion, neck movements.'],
['Feet','Inspect the soles, arches, toes, and squeeze the metatarsals.'],
['Look, feel, move','For any abnormal joint: look (swelling, deformity, redness), feel (warmth, tenderness, effusion), move (active, passive, crepitus), then special tests and function.'],
['Finish','Say you would examine other joints, skin and nails, eyes, and ask about morning stiffness.']
],pl:['Inflammatory pain: morning stiffness more than 30 minutes that improves with activity.','Always examine the joint above and below.']},

{id:'pr',n:'Rectal examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, explain clearly why it is needed, get explicit consent, chaperone, privacy.'],
['Position','Left lateral, knees drawn up to the chest, buttocks at the edge of the bed.'],
['Inspect','Skin tags, fissure, fistula openings, external haemorrhoids, prolapse, rash, perianal soiling, scars.'],
['Gloves and lubricant','Put on gloves and apply lubricant. Tell the patient what you are about to do.'],
['Insert','Place the pad of the index finger on the anus and press gently. Wait for the sphincter to relax and ask the patient to breathe out.'],
['Sphincter tone','Resting tone and squeeze tone.'],
['Palpate the rectum','Walls all around for masses, tenderness, polyps. Anteriorly: the prostate in men (size, surface, median sulcus, nodules, tenderness) or the cervix in women.'],
['Finish','Withdraw, look at the glove for blood, mucus, pus, stool colour (melaena). Offer tissue, cover the patient.'],
['Document','State the findings and say if the examination was normal.']
],pl:['Prostate: smooth, rubbery and symmetric is normal; hard, nodular and loss of the median sulcus suggests cancer.','A very tender rectal examination suggests infection or fissure.']},

{id:'scr',n:'Scrotal examination',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, chaperone, expose from the waist to the knees, in a warm room. Examine standing, then lying.'],
['Inspect','Size, symmetry, colour, skin changes, scars, swelling, the position of the testes (high riding or horizontal).'],
['Palpate each testis','Use both hands. Size, consistency, tenderness, nodules. Compare both sides.'],
['Epididymis','Behind the testis: swelling, tenderness, cysts.'],
['Spermatic cord','Feel from the testis up to the external ring. Look for varicocele (bag of worms, increases on standing or Valsalva).'],
['Get above it','Can you get above the swelling? If not, it is an inguinoscrotal hernia.'],
['Transilluminate','Torch behind the swelling. Hydrocele and epididymal cyst light up; solid swellings do not.'],
['Cremasteric reflex','Stroke the inner thigh: the testis rises on the same side. Absent in torsion.'],
['Groins and abdomen','Examine hernial orifices, inguinal nodes, and the abdomen for masses.'],
['Finish','Say you would send urine for dip and microscopy, and arrange a scrotal ultrasound.']
],pl:['Sudden severe testicular pain in a young man is torsion until proven otherwise. Surgical emergency, within 6 hours.','A hard painless testicular lump is cancer until proven otherwise.']},

{id:'foot',n:'Diabetic foot and ulcer',s:'Examination',st:[
['Prepare','Wash hands, introduce, consent, expose both legs below the knees, sitting or lying.'],
['Inspect','Skin colour, callus, deformity (Charcot, claw toes, hallux valgus), nails, interdigital spaces, ulcers, gangrene, previous amputations. Look inside the shoes.'],
['Ulcer description','Site, size, shape, edge (sloping, punched-out, rolled), base (slough, granulation, bone), depth, discharge, surrounding skin, tenderness.'],
['Temperature and oedema','Compare both feet. Warmth suggests infection or Charcot foot.'],
['Pulses','Dorsalis pedis, posterior tibial, popliteal, femoral. Capillary refill.'],
['Neuropathy','10 g monofilament at standard sites, vibration with a 128 Hz tuning fork, ankle reflexes, pinprick.'],
['Infection','Look for cellulitis, abscess, probing to bone, and lymphangitis.'],
['Nodes','Check the popliteal and inguinal nodes.'],
['Finish','Say you would check glucose, HbA1c, an ABPI and X-ray for osteomyelitis, and refer to the diabetic foot team.']
],pl:['Neuropathic ulcers are painless, on pressure points, with warm foot.','Ischaemic ulcers are painful, at the toes or heels, with cold pale foot.']},

{id:'postop',n:'Post-operative examination',s:'Examination',st:[
['Begin','Greet, introduce, explain, consent, privacy, chaperone, good light, position and expose the patient.'],
['General appearance','Conscious, alert, oriented, comfortable or in pain, body build.'],
['Vital signs','Temperature, pulse, respiratory rate, blood pressure, oxygen saturation, urine output and bowel sounds. Fever is above 37.2 C after surgery; tachycardia suggests fever, infection, dehydration, pain or anxiety.'],
['General exam: eyes, mouth, hands','Eyes for pallor and jaundice, mouth for dryness and cyanosis, hands for pallor.'],
['Chest','Air entry, type of breathing, added sounds, basal crepitations.'],
['Abdomen','Inspect: symmetry, distension, dressing, movement with breathing. Palpate: soft or not, tender or not. Auscultate bowel sounds. Percuss.'],
['Lower limbs','Signs of DVT (calf tenderness, swelling), pitting oedema.'],
['Cannulas','Number, colour, site, and local complications (infiltration, thrombophlebitis).'],
['Urethral catheter','Bag: colour of the contents, amount, and the duration of collection.'],
['Surgical drains','Number, site, type, name, tube patency, bag amount and colour (and over what time), drain incision (discharge, erythema, herniation). Ask whether the patient has a drain, as it may be hidden.'],
['Site of operation','Name the wound and its length. Dressing clean or yellowish or bloody? Ask the examiner to remove the dressing.'],
['Inspect the wound','Edges approximated by sutures or staples, or gaping (dehiscence). Floor: epithelial, granulation, slough, abdominal cavity. Discharge and colour. Suture type and technique. Swelling (infection, haematoma, seroma), erythema.'],
['Palpate','Wearing gloves and after asking about pain: wound edge tenderness, induration, surrounding skin tenderness.'],
['After thyroidectomy','Voice change (hoarseness or stridor). Hypocalcaemia: perioral numbness, digital tingling, carpopedal spasm, Chvostek sign, Trousseau sign, hyperreflexia, tetany, seizure.'],
['Finish','Cover the patient, thank them, and summarise the findings and your impression.']
],pl:['Fever by day: wind (day 1 to 2, chest), water (day 3, urine), walking (day 5 to 6, DVT or PE), wound (day 7), wonder drugs (any day).','Primary haemorrhage is during the operation, reactionary within 24 hours, secondary at 7 to 10 days (usually infection).']},

{id:'drains',n:'Surgical drains',s:'Examination',st:[
['Why the drain is there','Therapeutic, diagnostic, prophylactic, monitoring or palliative. Ask whether the patient has a drain, as it may be hidden.'],
['Number and site','How many drains, and where each one comes out.'],
['Type','Open (Penrose, corrugated, Yeates, wick) or closed. Closed drains are passive (Robinson, urethral catheter, chest tube, T-tube) or active with suction (Jackson-Pratt, Redivac).'],
['Name','Name the drain and the cavity it drains.'],
['Drain tube','Patent, not kinked or blocked by clots, secured well, and lower than the incision.'],
['Drain bag or reservoir','Amount and colour of the fluid, and the time it was collected over. Active drains must be activated and the container emptied daily.'],
['Exit site','Discharge, erythema, skin excoriation, herniation, leakage around the tube.'],
['Wound','Examine the main wound as well.'],
['Is it ready to come out?','Output usually under 30 to 50 mL in 24 hours, falling, and serous or serosanguinous. No fever, sepsis, peritonitis, infection or collection. Do not remove if purulent, bilious, faecal, chylous or bloody until the cause is controlled.'],
['Typical timing','Thyroidectomy over 24 hours, colorectal anastomosis 5 to 7 days, T-tube in the CBD 10 to 14 days. Not a rule.'],
['Complications','Pain, irritation, bleeding, injury to adjacent organ, occlusion, leak, displacement, infection, fluid and electrolyte loss, pressure necrosis, fistula, hernia.']
],pl:['A drain should take the shortest safe route to the deepest, most dependent part and come out through a separate stab wound.','Drains older than 7 to 10 days raise the risk of infection, pain and fistula.']},

{id:'pres',n:'Presenting a case',s:'General',st:[
['Opening line','Age, sex, relevant occupation or background, presenting complaint and duration. "This is a 55-year-old man presenting with 6 hours of central chest pain."'],
['HPC','Onset, character, severity, associated symptoms, relevant positives and negatives, previous episodes.'],
['Background','Key past medical and surgical history, drugs, allergies, relevant family and social history (smoking in pack-years).'],
['Examination','General appearance, vital signs, then the relevant system. Describe abnormal findings first, then pertinent negatives.'],
['Summary','One sentence that pulls it together.'],
['Diagnosis','Give your most likely diagnosis, then 2 or 3 differentials, including the dangerous one you must exclude.'],
['Plan','Investigations (bedside, blood, imaging), immediate treatment, and disposition.'],
['Close','Ask if the examiner wants more detail. Keep it under 2 minutes.']
],pl:['Say your diagnosis out loud even if you are not sure.','Never read the chart. Look at the examiner.']}
];

/* Minimal offline PDF writer (A4, Helvetica). No libraries, so it works with no connection. */
var PDFW=(function(){
  var W=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
  var MAP={'‘':"'",'’':"'",'“':'"','”':'"','–':'-','—':'-','−':'-','•':'-','≥':'>=','≤':'<=','°':' deg','µ':'u','×':'x','…':'...','→':'->',' ':' ','✓':'+','±':'+/-','½':'1/2'};
  function clean(s){
    s=String(s==null?'':s);var o='';
    for(var i=0;i<s.length;i++){
      var ch=s.charAt(i),c=s.charCodeAt(i);
      if(c>=32&&c<=126){o+=ch;continue}
      if(MAP[ch]!=null){o+=MAP[ch];continue}
      if(c===9){o+='  ';continue}
      var n=ch.normalize?ch.normalize('NFD').replace(/[̀-ͯ]/g,''):ch;
      if(n&&n.charCodeAt(0)>=32&&n.charCodeAt(0)<=126)o+=n.charAt(0);
      else if(c>126)o+='?';
    }
    return o;
  }
  function wid(s,size,bold){var w=0;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i)-32;w+=(c>=0&&c<W.length?W[c]:556)}return w*size/1000*(bold?1.13:1)}
  function esc(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
  function rgb(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255].map(function(x){return x.toFixed(3)}).join(' ')}

  /* doc: {title, sub, meta:[..], blocks:[{k:'h'|'p'|'b'|'sub'|'gap'|'flag', label, text}], foot, accent:'#1F5FBF'} */
  function build(doc){
    var PW=595,PH=842,M=46,CW=PW-2*M,FS=10,LH=14.2,pages=[],cur=null,y=0;
    var acc=doc.accent||'#1F5FBF';
    function newPage(){cur=[];pages.push(cur);y=PH-M}
    function need(h){if(y-h<M+22)newPage()}
    function txt(x,yy,s,size,bold,col){cur.push('BT /'+(bold?'F2':'F1')+' '+size+' Tf '+rgb(col||'#111111')+' rg '+x.toFixed(2)+' '+yy.toFixed(2)+' Td ('+esc(s)+') Tj ET')}
    function rect(x,yy,w,h,col){cur.push(rgb(col)+' rg '+x.toFixed(2)+' '+yy.toFixed(2)+' '+w.toFixed(2)+' '+h.toFixed(2)+' re f')}
    /* wrap runs of words, first span may be bold (label) */
    function wrap(label,text,indent,size,col){
      var words=[],i;
      if(label){label.split(/\s+/).forEach(function(w){if(w)words.push({t:w,b:true})})}
      text.split(/\s+/).forEach(function(w){if(w)words.push({t:w,b:false})});
      var x0=M+indent,max=CW-indent,lines=[],line=[],lw=0,sp=wid(' ',size,false);
      words.forEach(function(w){
        var ww=wid(w.t,size,w.b);
        if(line.length&&lw+sp+ww>max){lines.push(line);line=[];lw=0}
        line.push(w);lw+=(line.length>1?sp:0)+ww;
      });
      if(line.length)lines.push(line);
      return {lines:lines,x0:x0,sp:sp};
    }
    function drawPara(label,text,indent,size,col,bullet){
      var r=wrap(label,text,indent+(bullet?10:0),size,col);
      r.lines.forEach(function(line,li){
        need(LH);y-=LH;
        if(bullet&&li===0)rect(M+indent+2,y+3,2.6,2.6,col||'#111111');
        var x=r.x0;
        line.forEach(function(w,wi){txt(x,y,w.t,size,w.b,col);x+=wid(w.t,size,w.b)+r.sp*(w.b&&!(line[wi+1]&&line[wi+1].b)?1.8:1)});
      });
    }
    newPage();
    /* header */
    rect(0,PH-8,PW,8,acc);
    y=PH-M-4;
    txt(M,y,'BEDSIDE H&E',8.5,true,acc);
    y-=26;txt(M,y,clean(doc.title),20,true,'#0C1A21');
    if(doc.sub){y-=17;txt(M,y,clean(doc.sub),10.5,false,'#516670')}
    (doc.meta||[]).forEach(function(m){y-=14;txt(M,y,clean(m),9.5,false,'#333333')});
    y-=10;rect(M,y,CW,0.8,'#CBD7DD');y-=6;
    doc.blocks.forEach(function(b){
      var t=clean(b.text||''),l=clean(b.label||'');
      if(b.k==='pb'){newPage();return}
      if(b.k==='big'){need(40);y-=24;txt(M,y,t,16,true,'#0C1A21');y-=6;rect(M,y,CW,2,acc);y-=8;return}
      if(b.k==='gap'){y-=4;return}
      if(b.k==='h'){
        need(46);y-=20;rect(M,y-5,CW,18,'#EEF2F5');rect(M,y-5,3,18,acc);txt(M+10,y,t.toUpperCase(),10,true,'#0C1A21');y-=10;return}
      if(b.k==='sub'){need(26);y-=3;drawPara(t,'',0,FS,'#111111');return}
      if(b.k==='b'){drawPara('',t,12,FS,'#111111',true);return}
      if(b.k==='flag'){drawPara(l,t,0,FS,'#B3261E');return}
      drawPara(l,t,0,FS,'#111111');
    });
    /* footers */
    var n=pages.length;
    pages.forEach(function(p,i){
      var ft=clean(doc.foot||'');
      p.push('BT /F1 7.5 Tf '+rgb('#6A7A82')+' rg '+M+' 26 Td ('+esc(ft)+') Tj ET');
      var pg='Page '+(i+1)+' of '+n;
      p.push('BT /F1 7.5 Tf '+rgb('#6A7A82')+' rg '+(PW-M-wid(pg,7.5,false)).toFixed(2)+' 26 Td ('+esc(pg)+') Tj ET');
    });
    /* assemble objects */
    var objs=[];
    function add(s){objs.push(s);return objs.length}
    add('<< /Type /Catalog /Pages 2 0 R >>');
    add('PAGES');
    var f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    var f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    var kids=[];
    pages.forEach(function(p){
      var stream=p.join('\n');
      var c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');
      var pg=add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> /Contents '+c+' 0 R >>');
      kids.push(pg+' 0 R');
    });
    objs[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';
    var info=add('<< /Title ('+esc(clean(doc.title))+') /Producer (Bedside H&E) >>');
    var out='%PDF-1.4\n',offs=[];
    objs.forEach(function(o,i){offs.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
    var xr=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
    offs.forEach(function(o){out+=('0000000000'+o).slice(-10)+' 00000 n \n'});
    out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R /Info '+info+' 0 R >>\nstartxref\n'+xr+'\n%%EOF';
    var u=new Uint8Array(out.length);for(var i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
    return u;
  }
  return {build:build,clean:clean};
})();

  var P=getP(e.pid),res=P.dd.map(function(d){return {d:d,s:d.prior*2,pos:[],neg:[]}}),m={},nF=0,nPos=0;
  res.forEach(function(r){m[r.d.k]=r});
  P.sections.forEach(function(sec){sec.items.forEach(function(it){
    var st=e.f[fkey(P,it)];if(!st)return;nF++;if(st===1)nPos++;
    for(var k in it.w){var r=m[k];if(!r)continue;var w=it.w[k];
      if(st===1){r.s+=w;r.pos.push(it)}else if(st===-1&&w>=3){r.s-=w*0.5;r.neg.push(it)}}
  })});
  res.forEach(function(r){r.s=Math.max(0,r.s)});
  res.sort(function(a,b){return b.s-a.s||b.d.prior-a.d.prior});
  return {res:res,nF:res.length?nF:0,nPos:nPos};
}
function fitLabel(r,mx,nF,i){if(!nF)return ['Prior only','grey'];var q=r.s/mx;if(i===0)return ['Leading','teal'];return q>=0.7?['Strong','teal']:q>=0.4?['Possible','amber']:q>=0.15?['Less likely','grey']:['Unlikely','grey']}
function nextToCheck(e,r){
  var P=getP(e.pid),out=[];
  P.sections.forEach(function(sec){sec.items.forEach(function(it){
    if(e.f[fkey(P,it)])return;var w=it.w[r.d.k];if(w>=3)out.push({it:it,w:w,kind:sec.kind})})});
  out.sort(function(a,b){return b.w-a.w});return out.slice(0,3);
}
function redFlags(e){var P=getP(e.pid),o=[];P.sections.forEach(function(s){s.items.forEach(function(it){if(it.flag&&e.f[fkey(P,it)]===1)o.push(it)})});return o}
function progress(e){var P=getP(e.pid),h=0,ht=0,x=0,xt=0;P.sections.forEach(function(s){s.items.forEach(function(it){var st=e.f[fkey(P,it)];if(s.kind==='H'){ht++;if(st)h++}else{xt++;if(st)x++}})});return {h:h,ht:ht,x:x,xt:xt}}

 {k:'res',n:'Respiratory',i:['Cough','Sputum or coughing blood','Wheeze','Breathlessness']},
 {k:'git',n:'Gastrointestinal',i:['Loss of appetite','Nausea or vomiting','Difficulty swallowing','Abdominal pain','Change in bowel habit','Black stool or blood per rectum','Jaundice']},

function rosState(e,sk,i){return e.f['ros.'+sk+i]||0}
function rosStatus(e,sys){
  var pos=0,neg=0;sys.i.forEach(function(t,i){var st=rosState(e,sys.k,i);if(st===1)pos++;else if(st===-1)neg++});
  if(!pos&&!neg)return ['Not asked','grey'];
  if(pos)return [pos+' positive','amber'];
  return neg===sys.i.length?['Negative','green']:['Negative so far','grey'];
}
function rosRow(e,sys,i){

  return '<div class="it" data-rk="'+sys.k+i+'"><div class="t">'+esc(sys.i[i])+'</div><div class="seg"><button class="y'+(st===1?' on':'')+'" data-act="rosTri" data-v="1" aria-pressed="'+(st===1)+'">Yes</button><button class="n'+(st===-1?' on':'')+'" data-act="rosTri" data-v="-1" aria-pressed="'+(st===-1)+'">No</button></div></div>';

function rosCard(e){
  var h='<section class="card"><h3>Systems screen</h3><p class="small muted" style="margin-block-end:8px">Ask only the commonest symptom of each system. If all are No, tap "All no" and move on.</p>';
  ROS.forEach(function(sys){
    var s=rosStatus(e,sys);
    h+='<details class="rosd" data-sk="'+sys.k+'"><summary><span>'+esc(sys.n)+'</span><span class="pill '+s[1]+'" id="rosst-'+sys.k+'">'+s[0]+'</span></summary><div class="row" style="margin-block:4px 2px"><button class="btn small" data-act="rosNone" data-sk="'+sys.k+'">All no</button></div>';
    sys.i.forEach(function(t,i){h+=rosRow(e,sys,i)});
    h+='</details>';
  });
  h+='<label class="f" style="margin-block-start:10px">Other symptoms or notes<textarea data-b="tx.ros" rows="2" placeholder="Anything else the patient mentions">'+esc(e.tx.ros)+'</textarea></label></section>';
  return h;
}
function rosPill(e,sk){var sys=ROS.filter(function(x){return x.k===sk})[0],s=rosStatus(e,sys),p=document.getElementById('rosst-'+sk);if(p){p.textContent=s[0];p.className='pill '+s[1]}}
function rosSummary(e){
  var out=[];
  ROS.forEach(function(sys){
    var pos=[],neg=[];sys.i.forEach(function(t,i){var st=rosState(e,sys.k,i);if(st===1)pos.push(t.toLowerCase());else if(st===-1)neg.push(t.toLowerCase())});
    if(!pos.length&&!neg.length)return;
    if(!pos.length)out.push(sys.n+': negative');else out.push(sys.n+': '+pos.join(', ')+(neg.length?' (denies '+neg.join(', ')+')':''));
  });

}
function rosPres(e){
  var pos=[],asked=0;

  if(!asked)return '';
  return pos.length?'Systems review is positive for '+pos.join(', ')+', and otherwise negative.':'Systems review is negative.';
}

/* ================= vitals ================= */
function news2(v){
  var rr=num(v.rr),sp=num(v.spo2),sb=num(v.sbp),hr=num(v.hr),t=num(v.temp),parts={},tot=0,miss=[];
  function add(k,val){parts[k]=val;tot+=val}
  if(rr==null)miss.push('RR');else add('RR',rr<=8?3:rr<=11?1:rr<=20?0:rr<=24?2:3);
  if(sp==null)miss.push('SpO2');else add('SpO2',sp<=91?3:sp<=93?2:sp<=95?1:0);
  add('O2',v.o2?2:0);
  if(sb==null)miss.push('SBP');else add('SBP',sb<=90?3:sb<=100?2:sb<=110?1:sb<=219?0:3);
  if(hr==null)miss.push('HR');else add('HR',hr<=40?3:hr<=50?1:hr<=90?0:hr<=110?1:hr<=130?2:3);
  add('Consciousness',(v.avpu&&v.avpu!=='A')?3:0);
  if(t==null)miss.push('Temp');else add('Temp',t<=35?3:t<=36?1:t<=38?0:t<=39?1:2);
  var any3=false;for(var k in parts)if(parts[k]===3)any3=true;
  var txt=tot>=7?'High (7 or more): emergency response, critical care review.':tot>=5?'Medium (5 to 6): urgent response by a clinician skilled in acute illness.':any3?'Low to medium: a single red score of 3 needs urgent ward-based review.':tot>=1?'Low (1 to 4): ward-based response, at least 4-6 hourly observations.':'Low (0): routine monitoring.';
  return {tot:tot,parts:parts,miss:miss,txt:txt,any:Object.keys(v).some(function(k){return v[k]!==''&&v[k]!=null&&v[k]!==false&&k!=='ht'&&k!=='wt'&&k!=='dbp'})};
}
function vitFlags(v){
  var f=[],hr=num(v.hr),sb=num(v.sbp),db=num(v.dbp),rr=num(v.rr),sp=num(v.spo2),t=num(v.temp);
  if(hr!=null)f.push(hr>100?'Tachycardia':hr<60?'Bradycardia':'');
  if(sb!=null&&sb<90)f.push('Hypotension');
  if(sb!=null&&sb>=180)f.push('Severe hypertension');
  if(rr!=null&&rr>20)f.push('Tachypnoea');
  if(sp!=null&&sp<94)f.push('Low SpO2');
  if(t!=null)f.push(t>=38?'Fever':t<=35?'Hypothermia':'');
  if(hr!=null&&sb)f.push(hr/sb>=0.9?'Shock index '+(hr/sb).toFixed(2)+' (raised)':'');
  return f.filter(Boolean);
}
function vitLine(v){
  var a=[];
  if(num(v.hr)!=null)a.push('HR '+v.hr);
  if(num(v.sbp)!=null)a.push('BP '+v.sbp+'/'+(num(v.dbp)!=null?v.dbp:'?'));
  if(num(v.rr)!=null)a.push('RR '+v.rr);
  if(num(v.spo2)!=null)a.push('SpO2 '+v.spo2+'% '+(v.o2?'on oxygen':'on air'));
  if(num(v.temp)!=null)a.push('Temp '+v.temp+' C');
  if(v.avpu&&v.avpu!=='A')a.push('ACVPU: '+v.avpu);
  var b=bmi(v);if(b)a.push('BMI '+b);
  return a.join(' | ');
}
function bmi(v){var w=num(v.wt),h=num(v.ht);if(w&&h){var m=h/100;return (w/(m*m)).toFixed(1)}return ''}

/* ================= scores ================= */
function scoreTotal(s,st){var tot=0;st=st||{};s.items.forEach(function(it,i){var idx=st[i]||0;var o=it[1][idx]||it[1][0];tot+=o[1]});return tot}
function scoreInterp(s,tot){var out='';s.interp.forEach(function(r){if(tot>=r[0])out=r[1]});return out}
function scoreResults(e){
  var out=[];SCORES.forEach(function(s){
    if(s.special){var n=news2(e.v||{});if(n.any&&!n.miss.length)out.push('NEWS2 '+n.tot+' - '+n.txt);return}
    var st=e.sc[s.id];if(!st||!st.t)return;var tot=scoreTotal(s,st.v);out.push(s.name.replace(/ \(.*\)/,'')+' '+tot+' - '+scoreInterp(s,tot))});
  return out;
}

/* ================= note generation ================= */
function lc(s){return s}
function collect(e){
  var P=getP(e.pid),o={hp:[],hn:[],ep:[],en:[]};
  P.sections.forEach(function(sec){sec.items.forEach(function(it){
    var st=e.f[fkey(P,it)];if(!st)return;
    if(sec.kind==='H')(st===1?o.hp:o.hn).push(it.t);else(st===1?o.ep:o.en).push(it.t)})});
  return o;
}
function ptWho(e){var a=e.pt.age,s=e.pt.sex;var sx=s==='M'?'man':s==='F'?'woman':'patient';return (a?a+'-year-old ':'')+sx}
function topDx(e,n){var d=ddxScores(e);return d.res.slice(0,n).map(function(r){return r.d.name})}
function mnmStatus(e){var P=getP(e.pid);return P.dd.filter(function(d){return d.mnm}).map(function(d){return {d:d,ex:!!e.x[d.k]}})}
/* Iraqi-style case sheet: patient data, complaint, HPI, review of systems, past/drug/family/social,
   general and systemic examination, investigations, diagnosis, management. Blocks feed both the text and the PDF. */
function sheetBlocks(e){
  var P=getP(e.pid),c=collect(e),B=[],tx=e.tx,v=e.v||{},ds=ddxScores(e),hid=DB.hideDdx;
  function H(t){B.push({k:'h',text:t})}
  function F(l,t){B.push({k:'p',label:l,text:t||'Not recorded.'})}
  function L(l,arr){if(!arr.length)return;B.push({k:'sub',text:l});arr.forEach(function(t){B.push({k:'b',text:t})})}
  H('Patient data');
  F('Name / ID',e.pt.ref||'(not entered)');
  F('Age / sex',(e.pt.age?e.pt.age+' years':'age not entered')+(e.pt.sex?', '+(e.pt.sex==='M'?'male':e.pt.sex==='F'?'female':e.pt.sex):''));
  F('Occupation',e.pt.occ);F('Marital status',e.pt.mar);F('Residence',e.pt.res);F('Ward / bed',e.pt.loc);
  F('Date of admission',e.pt.adm||dstr(e.t0));
  H('Chief complaint');
  F('Complaint',(e.cc||(P.id==='other'?'':P.name))+(e.dur?', for '+e.dur:''));
  H('History of present illness');
  if(tx.hpc)B.push({k:'p',text:tx.hpc});
  L('Positive points',c.hp);L('Pertinent negatives',c.hn);
  if(!tx.hpc&&!c.hp.length&&!c.hn.length)B.push({k:'p',text:'Not recorded.'});
  H('Review of systems');
  var rs=rosSummary(e);B.push({k:'p',text:(rs||'Not recorded.')+(tx.ros?' Other: '+tx.ros:'')});
  H('Past medical and surgical history');
  F('Past medical',tx.pmh);F('Past surgical',tx.psh);
  H('Drug history and allergy');
  F('Drugs',tx.dh);F('Allergy',tx.all);
  H('Family history');
  F('Family history',tx.fh);
  H('Social history');
  F('Social history',tx.sh);
  H('General examination');
  var vl=vitLine(v);F('Vital signs',vl);
  var n=news2(v);if(n.any&&!n.miss.length)F('NEWS2',String(n.tot));
  H('Systemic / local examination');
  L('Abnormal findings',c.ep);L('Normal or absent',c.en);
  if(tx.exn)F('Other findings',tx.exn);
  if(!c.ep.length&&!c.en.length&&!tx.exn)B.push({k:'p',text:'Not recorded.'});
  var sr=scoreResults(e);if(sr.length)L('Scores',sr);
  H('Investigations');
  F('Suggested',P.inv);
  H('Diagnosis');
  F('Provisional diagnosis',tx.dx||(!hid&&ds.nF?ds.res[0].d.name+' (suggested by findings)':'Not yet formulated'));
  if(!hid&&ds.nF)F('Differential diagnosis',ds.res.slice(0,4).map(function(r,i){return (i+1)+'. '+r.d.name}).join('; '));
  var mm=hid?[]:mnmStatus(e);if(mm.length)F('Must not miss',mm.map(function(x){return x.d.name+(x.ex?' (excluded)':' (not yet excluded)')}).join('; '));
  var rf=redFlags(e);if(rf.length)B.push({k:'flag',label:'Red flags present:',text:rf.map(function(i){return i.t}).join('; ')});
  H('Management plan');
  F('Plan',tx.plan||'Not recorded.');
  return B;
}
function buildSheet(e){
  var P=getP(e.pid),L=['CASE SHEET - '+P.name.toUpperCase()];
  sheetBlocks(e).forEach(function(b){
    if(b.k==='h'){L.push('');L.push(b.text.toUpperCase())}
    else if(b.k==='b')L.push('  - '+b.text);
    else if(b.k==='sub')L.push(b.text+':');
    else L.push((b.label?b.label.replace(/:?$/,':')+' ':'')+b.text);
  });
